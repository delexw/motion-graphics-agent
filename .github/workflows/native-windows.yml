name: Native Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Full test suite, lint and format
    needs: [quality-static, quality-tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All macOS test suites and static checks passed."
  quality-static:
    name: Lint, format and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
  quality-tests:
    name: macOS tests (${{ matrix.suite }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, browser]
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.data/browser-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install test prerequisites
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          command -v jq >/dev/null || brew install jq
          npx --no-install browsers install chrome-headless-shell@stable --path "$PUPPETEER_CACHE_DIR"
          npx --no-install browsers install chrome@stable --path "$PUPPETEER_CACHE_DIR"
          node --import tsx --input-type=module -e "import { browserExecutablePath } from './src/server/runtime/browser.ts'; import { appendFileSync } from 'node:fs'; const browser = browserExecutablePath(); const desktop = browserExecutablePath(true); if (!browser || !desktop) throw Error('Installed CI browsers not found'); appendFileSync(process.env.GITHUB_ENV, 'HYPERFRAMES_BROWSER_PATH=' + browser + '\nVIDEO_BROWSER_PATH=' + desktop + '\n');"
      - name: Install the renderer-matched Chromium
        run: npm run multiplane:setup
      - name: Prepare public authoring resources for offline integration tests
        run: node --import tsx --input-type=module -e "import { updateSkill } from './src/server/agents/bundled-skills/installation.ts'; import { bundledSkills } from './src/server/agents/bundled-skills/registry.ts'; for (const skill of bundledSkills) await updateSkill(skill);"
      # Keep browser and render tests serial within each runner.
      - name: Run Vitest suite
        if: matrix.suite != 'browser'
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: npx --no-install vitest run "tests/$TEST_SUITE" --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results.json
      - name: Reject skipped or missing tests
        if: matrix.suite != 'browser'
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r = JSON.parse(readFileSync('test-results.json', 'utf8')); if (!r.success || !r.numTotalTests || r.numPendingTests || r.numTodoTests || r.numPassedTests !== r.numTotalTests) throw Error('Full suite must pass without skipped tests');"
      - name: Run Playwright browser tests
        id: playwright
        if: matrix.suite == 'browser'
        run: npm run test:browser -- --workers=1
      - name: Reject skipped or missing Playwright tests
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const { stats } = JSON.parse(readFileSync('test-results/playwright.json', 'utf8')); if (!stats.expected || stats.unexpected || stats.flaky || stats.skipped) throw Error('Playwright suite must pass without flaky or skipped tests');"
      - name: Upload Playwright traces on failure
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: test-results/
          if-no-files-found: ignore
  speech-dependencies:
    name: Python speech dependencies
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: command -v uv >/dev/null || brew install uv
      - name: Kokoro libraries match Kiteva's adapters
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/kokoro"
          uv pip install --python "$RUNNER_TEMP/kokoro/bin/python" -r src/server/audio/providers/kokoro/requirements.txt
          "$RUNNER_TEMP/kokoro/bin/python" -I scripts/check-speech-libraries.py kokoro
      - name: Pocket TTS libraries match Kiteva's adapters
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/pocket"
          uv pip install --python "$RUNNER_TEMP/pocket/bin/python" -r src/server/audio/providers/pocket-tts/requirements.txt
          "$RUNNER_TEMP/pocket/bin/python" -I scripts/check-speech-libraries.py pocket
      - name: Mandarin Pocket TTS libraries match Kiteva's adapters
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/pocket-zh"
          uv pip install --python "$RUNNER_TEMP/pocket-zh/bin/python" -r src/server/audio/providers/pocket-tts/chinese-requirements.txt
          "$RUNNER_TEMP/pocket-zh/bin/python" -I scripts/check-speech-libraries.py pocket-zh
      - name: Ming TTS libraries match Kiteva's adapters
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/ming"
          uv pip install --python "$RUNNER_TEMP/ming/bin/python" -r src/server/audio/providers/ming-tts/requirements-mlx.txt
          "$RUNNER_TEMP/ming/bin/python" -I scripts/check-speech-libraries.py ming
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.data/browser-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install local render prerequisites
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          npx --no-install browsers install chrome-headless-shell@stable --path $env:PUPPETEER_CACHE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx --input-type=module -e "import { browserExecutablePath } from './src/server/runtime/browser.ts'; import { appendFileSync } from 'node:fs'; const browser = browserExecutablePath(); if (!browser) throw Error('Installed CI browser not found'); appendFileSync(process.env.GITHUB_ENV, 'HYPERFRAMES_BROWSER_PATH=' + browser + '\n');"
      - name: Check types and build
        run: npm run build
      - name: Check native platform contracts
        run: npx vitest run tests/unit/native-platform.test.ts tests/unit/process-tree.test.ts tests/unit/workspace-links.test.ts tests/integration/windows-render-policy.test.ts tests/unit/windows-readiness.test.ts tests/unit/browser-executable.test.ts tests/integration/runtime-command.test.ts tests/integration/file-output.test.ts tests/integration/codex-command.test.ts tests/integration/command-child.test.ts --maxWorkers=4
      - name: Verify native Windows security boundary and real render
        env:
          # HyperFrames can nest Chrome's sandbox inside the native Windows sandbox.
          # The local 2D fixture still runs inside Kiteva's native sandbox.
          HYPERFRAMES_CHROME_SANDBOX: "0"
          # Hosted runners can lose Chrome's GPU process.
          PRODUCER_DISABLE_GPU: "true"
          PRODUCER_BROWSER_GPU_MODE: software
          PRODUCER_FORCE_SCREENSHOT: "true"
        run: npm run windows:check
