version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      compatible-packages:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-packages:
        patterns:
          - "*"
        update-types:
          - major
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  # All ecosystems use the same full-suite and Windows auto-merge gates.
  - package-ecosystem: pip
    directories:
      - /src/server/audio/providers/pocket-tts
      - /src/server/audio/providers/kokoro
      - /src/server/audio/providers/ming-tts
    # Ming setup.py prepares models; it is not Python package metadata.
    exclude-paths:
      - "**/setup.py"
    schedule:
      interval: daily
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
