function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry32(1420711);
function R(a,b){return a+(b-a)*rnd();}
function f1(v){return String(Math.round(v*10)/10);}
function f2(v){return String(Math.round(v*100)/100);}
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs){e.setAttribute(k,typeof attrs[k]==='number'?f1(attrs[k]):attrs[k]);}if(parent)parent.appendChild(e);return e;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
function lerp(a,b,p){return a+(b-a)*p;}
function easeInOut(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function easeOut(p){return 1-Math.pow(1-p,3);}
function backOut(p){var c1=2.1,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function show(e,v){e.setAttribute('display',v<=0.001?'none':'inline');e.setAttribute('opacity',f2(clamp(v,0,1)));}
function vis(e,on){e.setAttribute('display',on?'inline':'none');}

var clipId=0;
function container(parent,opt){
  var g=el('g',{},parent);
  el('path',{d:opt.d,fill:opt.plate,transform:'translate('+opt.po[0]+' '+opt.po[1]+')'},g);
  el('path',{d:opt.d,fill:opt.fill},g);
  var cid='cc'+(clipId++);
  var cp=el('clipPath',{id:cid,clipPathUnits:'userSpaceOnUse'},defs);
  el('path',{d:opt.d},cp);
  var dg=el('g',{'clip-path':'url(#'+cid+')',fill:opt.dot,opacity:0.88},g);
  var s=opt.step,ext=opt.ext;
  for(var y=-ext;y<=ext;y+=s){for(var x=-ext;x<=ext;x+=s){
    var xo=x+((Math.round(y/s)%2)?s/2:0);
    if(!opt.inside(xo,y))continue;
    var fv=clamp(0.5+(xo*0.6+y*0.8)/(2.2*ext),0,1);
    var rr=s*0.44*(0.22+0.78*fv);
    if(rr<0.5)continue;
    el('circle',{cx:xo,cy:y,r:rr},dg);
  }}

}

function cutout(g,type,s,light){
  var V=C.verm,CR=C.paper,INK=C.ink,OC=C.ochre,CB=C.cob;
  if(type===0){el('path',{d:starPath(4,s,s*0.38),fill:V},g);}
  else if(type===1){el('path',{d:starPath(6,s,s*0.5),fill:V},g);}
  else if(type===2){el('rect',{x:-s*0.68,y:-s*0.68,width:s*1.36,height:s*1.36,fill:V,stroke:CR,'stroke-width':Math.max(1.4,s*0.2),transform:'rotate(45)'},g);}
  else if(type===3){el('path',{d:'M0 '+f1(-s)+'C'+f1(s*0.7)+' '+f1(-s*0.25)+' '+f1(s*0.65)+' '+f1(s*0.55)+' 0 '+f1(s*0.6)+'C'+f1(-s*0.65)+' '+f1(s*0.55)+' '+f1(-s*0.7)+' '+f1(-s*0.25)+' 0 '+f1(-s)+'Z',fill:V},g);el('ellipse',{cx:0,cy:s*0.22,rx:s*0.27,ry:s*0.34,fill:OC},g);}
  else if(type===4){el('path',{d:'M0 '+f1(-s)+'V'+f1(s)+'M'+f1(-s)+' 0H'+f1(s)+'M'+f1(-s*0.55)+' '+f1(-s*0.55)+'L'+f1(s*0.55)+' '+f1(s*0.55)+'M'+f1(s*0.55)+' '+f1(-s*0.55)+'L'+f1(-s*0.55)+' '+f1(s*0.55),stroke:light?INK:OC,'stroke-width':Math.max(1.2,s*0.2),'stroke-linecap':'round',fill:'none'},g);}
  else if(type===5){el('circle',{cx:0,cy:0,r:s*0.75,fill:'none',stroke:light?CB:CR,'stroke-width':Math.max(1.4,s*0.3)},g);}
  else if(type===6){el('path',{d:'M0 '+f1(-s*0.8)+'V'+f1(s*0.8)+'M'+f1(-s*0.8)+' 0H'+f1(s*0.8),stroke:light?CB:OC,'stroke-width':Math.max(1.6,s*0.38),'stroke-linecap':'square',fill:'none'},g);}
  else if(type===7){el('path',{d:'M0 '+f1(-s)+'L'+f1(s*0.9)+' '+f1(s*0.65)+'L'+f1(-s*0.9)+' '+f1(s*0.65)+'Z',fill:light?INK:OC},g);}
  else if(type===8){el('circle',{cx:0,cy:0,r:s*0.85,fill:light?INK:CB},g);var q=s*0.36;[[-q,-q],[q,-q],[0,0],[-q,q],[q,q]].forEach(function(p){el('circle',{cx:p[0],cy:p[1],r:Math.max(0.6,s*0.14),fill:CR},g);});}
  else {var a={d:'M0 '+f1(-s)+'A'+f1(s)+' '+f1(s)+' 0 1 0 0 '+f1(s)+'A'+f1(s*0.72)+' '+f1(s*0.86)+' 0 1 1 0 '+f1(-s)+'Z',fill:CR};if(light){a.stroke=INK;a['stroke-width']=1;}el('path',a,g);}
}

function buildCluster(parent,cfg){
  var items=[],tries=0;
  while(items.length<cfg.n&&tries<4000){tries++;
    var a=rnd()*Math.PI*2,d=Math.sqrt(rnd());
    var x=cfg.cx+Math.cos(a)*d*cfg.rx,y=cfg.cy+Math.sin(a)*d*cfg.ry;
    if(x<24||x>1256||y<24||y>696)continue;
    var bad=false;
    for(var k=0;k<cfg.ex.length;k++){var e=cfg.ex[k];if(e.r?Math.hypot(x-e.x,y-e.y)<e.r:(x>e.x0&&x<e.x1&&y>e.y0&&y<e.y1)){bad=true;break;}}
    if(bad)continue;
    for(k=0;k<items.length;k++){if(Math.hypot(items[k].x-x,items[k].y-y)<30){bad=true;break;}}
    if(bad)continue;
    items.push({x:x,y:y,s:R(4,13),type:Math.floor(rnd()*10),r0:R(0,360),spin:R(-45,45),ph:R(0,6.28)});
  }
  items.sort(function(p,q){return Math.atan2(p.y-cfg.cy,p.x-cfg.cx)-Math.atan2(q.y-cfg.cy,q.x-cfg.cx);});
  var d='';items.forEach(function(it,k){d+=(k?'L':'M')+f1(it.x)+' '+f1(it.y);});
  var line=el('path',{d:d,fill:'none',stroke:cfg.lineColor,'stroke-width':1.4,'stroke-dasharray':'3 6','stroke-linecap':'round'},parent);
  items.forEach(function(it,k){it.ta=cfg.t0+k*cfg.st;it.g=el('g',{},parent);cutout(it.g,it.type,it.s,cfg.light);});
  return {items:items,line:line,t0:cfg.t0};
}
function renderCluster(cl,t){
  show(cl.line,0.75*seg(t,cl.t0+0.12,cl.t0+0.42));
  cl.line.setAttribute('stroke-dashoffset',f1(-t*14));
  for(var k=0;k<cl.items.length;k++){var it=cl.items[k];var p=seg(t,it.ta,it.ta+0.24);
    vis(it.g,p>0);
    var sc=backOut(p);var y=it.y+Math.sin(t*2.4+it.ph)*2.5;
    it.g.setAttribute('transform','translate('+f1(it.x)+' '+f1(y)+') rotate('+f1(it.r0+it.spin*t)+') scale('+f2(Math.max(0.01,sc))+')');
  }
}

var CW=0.66;
function boxW(n,fs){return n*CW*fs+fs*0.56;}
function rowLayout(words,fs,x,y,alignRight){var h=fs*1.36,gap=fs*0.28;var ws=words.map(function(w){return boxW(w.length,fs);});var tot=ws.reduce(function(s,v){return s+v;},0)+gap*(words.length-1);var cx=alignRight?x-tot:x;return ws.map(function(w){var r={x:cx,y:y,w:w,h:h,fs:fs};cx+=w+gap;return r;});}
function stackLayout(words,fs,x,y){var h=fs*1.36,pitch=h+10;return words.map(function(w,k){return {x:x,y:y+k*pitch,w:boxW(w.length,fs),h:h,fs:fs};});}
var LINES=[{words:['A','SMALL','IDEA'],starts:[0.2,0.5,0.8]},{words:['FINDS','ITS','VOICE'],starts:[1.65,1.95,2.25]}];
var DUR=0.3,OVL=0.1;
var L0a=rowLayout(LINES[0].words,32,64,720-60-32*1.36,false);
var L0b=rowLayout(LINES[0].words,12,1216,36,true);
var L1=stackLayout(LINES[1].words,54,64,64);
var txt=document.getElementById('txt');
var toks=[];
LINES.forEach(function(ln,li){ln.words.forEach(function(w,k){var d=document.createElement('div');d.className='tok';d.textContent=w;txt.appendChild(d);toks.push({div:d,line:li,idx:k,word:w,st:null});});});

function tokState(li,k,t){var s=LINES[li].starts;var end=k<s.length-1?s[k+1]+OVL:s[k]+DUR;return t<s[k]?'up':t<end?'cur':'done';}

function renderText(t){
  var op0=seg(t,0.08,0.18)*(1-seg(t,1.44,1.56));
  var op1=seg(t,1.58,1.66);
  var pc=easeInOut(seg(t,1.15,1.4));
  for(var n=0;n<toks.length;n++){var tk=toks[n];var li=tk.line,k=tk.idx;
    var op=li===0?op0:op1;
    var b;
    if(li===0){var a=L0a[k],c=L0b[k];b={x:lerp(a.x,c.x,pc),y:lerp(a.y,c.y,pc),w:lerp(a.w,c.w,pc),h:lerp(a.h,c.h,pc),fs:lerp(a.fs,c.fs,pc)};}
    else b=L1[k];
    var stt=tokState(li,k,t);
    var sc=1;
    if(stt==='cur'){var ps=seg(t,LINES[li].starts[k],LINES[li].starts[k]+0.18);sc=0.72+0.28*backOut(ps);}
    else if(stt==='up'){sc=0.94+0.06*easeOut(seg(t,li===0?0.08:1.58,li===0?0.22:1.72));}
    var sy=1;
    if(li===0&&pc>0&&pc<1){sy=1-0.35*Math.sin(pc*Math.PI);}
    var bg,fg,stroke=null;
    if(stt==='up'){fg=C.dim;if(li===0){bg='none';stroke='rgba(138,135,132,0.55)';}else{bg='rgba(20,18,26,0.16)';}}
    else if(stt==='cur'){bg=C.verm;fg=C.paper;}
    else{bg=C.ink;fg=C.paper;}
    tk.st={x:b.x,y:b.y,w:b.w,h:b.h,fs:b.fs,sc:sc,sy:sy,op:op,bg:bg,fg:fg,stroke:stroke};
    var s=tk.div.style;
    s.display=op<=0.001?'none':'block';
    s.left=f1(b.x)+'px';s.top=f1(b.y)+'px';s.width=f1(b.w)+'px';s.height=f1(b.h)+'px';
    s.lineHeight=f1(b.h)+'px';s.fontSize=f1(b.fs)+'px';
    s.background=bg==='none'?'transparent':bg;s.color=fg;
    s.boxShadow=stroke?'inset 0 0 0 1.5px '+stroke:'none';
    s.opacity=f2(op);
    s.transform='scale('+f2(sc)+','+f2(sc*sy)+')';
  }
}

function render(tt){
  var t=clamp(+tt||0,0,3);
  vis(gA,t<1.16);
  vis(gB,t>=0.9&&t<1.74);
  vis(gC,t>=1.48);

  pScr1.setAttribute('patternTransform','rotate('+f1(15+t*9)+')');
  pScr2.setAttribute('patternTransform','rotate('+f1(-20-t*6)+')');

  {
    var pa=backOut(seg(t,0.0,0.34));
    var ka=Math.max(0.01,(0.25+0.75*pa)*(1+0.02*Math.sin(t*4)));
    blobA.setAttribute('transform','translate(880 330) rotate('+f1(-10+t*12)+') scale('+f2(ka)+')');
    renderCluster(clA,t);
  }

  var pab=easeInOut(seg(t,0.92,1.14));
  var u=lerp(-720,1300,pab);
  vis(bandAB,t>=0.9&&t<=1.15);
  {bandPoly.setAttribute('points',band(u,300));bandDots.setAttribute('points',band(u,300));bandEdge.setAttribute('points',band(u+278,22));}
  clipBPoly.setAttribute('points','-2000,0 '+f1(u+400)+',0 '+f1(u)+',720 -2000,720');

  {
    var drift=(t-1.2)*18;
    planesB.setAttribute('transform','translate('+f1(-drift)+' 0)');
    for(var b=0;b<branches.length;b++){var pb=easeOut(seg(t,1.0+b*0.04,1.3+b*0.04));branches[b].setAttribute('stroke-dashoffset',f2(1-pb));}
    show(nodesB,seg(t,1.15,1.3));
    var ps=backOut(seg(t,1.02,1.3));
    sqB.setAttribute('transform','translate(720 330) rotate('+f1(20+25*easeOut(seg(t,1.02,1.3))+(t-1.0)*10)+') scale('+f2(Math.max(0.01,0.2+0.8*ps))+')');
    var pbu=backOut(seg(t,1.18,1.42));
    show(burst,seg(t,1.18,1.2));
    burst.setAttribute('transform','translate(1110 590) rotate('+f1(-30+30*easeOut(seg(t,1.18,1.42))+(t-1.18)*14)+') scale('+f2(Math.max(0.01,pbu))+')');
    renderCluster(clB,t);
  }

  var pbc=easeInOut(seg(t,1.5,1.72));
  var rc=lerp(0,1500,pbc);
  clipCCirc.setAttribute('r',f1(rc));
  vis(edgeC,pbc>0&&pbc<1);
  {edgeC1.setAttribute('r',f1(rc));edgeC2.setAttribute('r',f1(Math.max(0,rc-16)));}
  {
    var spin=-70*(1-easeOut(seg(t,1.5,1.82)))+(t-1.5)*7;
    rays.setAttribute('transform','rotate('+f1(spin)+' '+P[0]+' '+P[1]+')');
    rings.setAttribute('transform','rotate('+f1(-(t-1.5)*11)+' '+P[0]+' '+P[1]+')');
    var pf=backOut(seg(t,1.62,1.95));
    flowerC.setAttribute('transform','translate(965 470) rotate('+f1(-(t-1.6)*9)+') scale('+f2(Math.max(0.01,0.2+0.8*pf))+')');
    renderCluster(clC,t);
  }
  renderText(t);
}

function posterTokens(){
  var out='<g font-family="'+FONT+'" font-weight="700" text-anchor="middle">';
  toks.forEach(function(tk){var s=tk.st;if(!s||s.op<=0.001)return;
    var cx=s.x+s.w/2,cy=s.y+s.h/2;
    out+='<g opacity="'+f2(s.op)+'" transform="translate('+f1(cx)+' '+f1(cy)+') scale('+f2(s.sc)+' '+f2(s.sc*s.sy)+')">';
    out+='<rect x="'+f1(-s.w/2)+'" y="'+f1(-s.h/2)+'" width="'+f1(s.w)+'" height="'+f1(s.h)+'" fill="'+(s.bg==='none'?'none':s.bg)+'"'+(s.stroke?' stroke="'+s.stroke+'" stroke-width="1.5"':'')+'/>';
    out+='<text x="0" y="'+f1(s.fs*0.35)+'" font-size="'+f1(s.fs)+'" fill="'+s.fg+'">'+tk.word+'</text></g>';
  });
  return out+'</g>';
}

window.exportPoster=function(tt){
  render(tt);
  var c=svg.cloneNode(true);
  var hidden=c.querySelectorAll('[display="none"]');
  for(var k=0;k<hidden.length;k++){if(hidden[k].parentNode)hidden[k].parentNode.removeChild(hidden[k]);}
  c.removeAttribute('id');
  var s=new XMLSerializer().serializeToString(c);
  return s.replace(/<\/svg>\s*$/,posterTokens()+'</svg>');
};

var tl=gsap.timeline({paused:true});
var proxy={t:0};
tl.to(proxy,{t:3,duration:3,ease:'none',onUpdate:function(){render(proxy.t);}},0);
window.__timelines={video:tl};
window.addEventListener('hf-seek',function(ev){var tm=ev&&ev.detail?+ev.detail.time:0;tl.time(tm,false);render(tm);});
window.__render=render;
render(0);
})();
</script>
