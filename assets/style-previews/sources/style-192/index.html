<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stick Figure Explainer — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #F4F7F9; overflow: hidden; }
  #root { width: 100%; height: 100%; position: relative; }
  #stage { width: 100%; height: 100%; display: block; }
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#B9D5DE"/><stop offset="1" stop-color="#B9D5DE" stop-opacity="0"/></radialGradient>
    <radialGradient id="boardGlow"><stop offset="0" stop-color="#B9D5DE" stop-opacity="0.95"/><stop offset="0.75" stop-color="#B9D5DE" stop-opacity="0.35"/><stop offset="1" stop-color="#B9D5DE" stop-opacity="0"/></radialGradient>
    <clipPath id="boardClip"><rect x="544" y="224" width="272" height="222" rx="5"/></clipPath>
  </defs>

  <!-- stationary background -->
  <rect width="1280" height="720" fill="#F4F7F9"/>
  <rect y="560" width="1280" height="160" fill="#E3EBF0"/>
  <path d="M80 560H1200" stroke="#142536" stroke-width="4"/>

  <!-- shared prop: easel board -->
  <g fill="none" stroke="#142536" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 560L640 450M760 560L720 450"/>
    <rect id="board" x="540" y="220" width="280" height="230" rx="8" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#boardClip)">
    <circle id="boardRipple" cx="640" cy="280" r="300" fill="url(#boardGlow)" opacity="0"/>
  </g>

  <!-- network on the board (accent = active system) -->
  <g id="edges" fill="none" stroke="#005885" stroke-width="5" stroke-linecap="round">
    <path class="edge" d="M640 280L740 270" pathLength="1"/>
    <path class="edge" d="M640 280L780 380" pathLength="1"/>
    <path class="edge" d="M640 280L660 400" pathLength="1"/>
    <path class="edge" d="M740 270L780 380" pathLength="1"/>
    <path class="edge" d="M780 380L660 400" pathLength="1"/>
    <path class="edge" d="M740 270L660 400" pathLength="1"/>
  </g>
  <g id="nodes" fill="#FFFFFF" stroke="#005885" stroke-width="5">
    <circle class="node" cx="740" cy="270" r="14"/>
    <circle class="node" cx="780" cy="380" r="14"/>
    <circle class="node" cx="660" cy="400" r="14"/>
  </g>
  <circle id="core" cx="640" cy="280" r="18" fill="#005885"/>

  <!-- idea trail (drawn up to the bulb's travelled position) -->
  <path id="trail" d="" fill="none" stroke="#005885" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- figures (geometry written from timeline state) -->
  <g id="figA" fill="none" stroke="#142536" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle id="aHead" r="32"/>
    <path id="aBody"/>
  </g>
  <g id="figB" fill="none" stroke="#142536" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle id="bHead" r="32"/>
    <path id="bBody"/>
  </g>
  <g id="joints" fill="#142536"></g>

  <!-- idea prop: bulb -->
  <g id="bulb">
    <circle id="bulbGlow" cx="0" cy="0" r="72" fill="url(#glow)"/>
    <path d="M0 -38c-24 0-38 18-38 36 0 16 10 24 16 32v12h44v-12c6-8 16-16 16-32 0-18-14-36-38-36z" fill="#FFFFFF" stroke="#005885" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-12 50h24" stroke="#005885" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- labels next to named props -->
  <text id="lblIdea" x="402" y="104" font-size="24" font-weight="600" text-anchor="middle" fill="#005885">idea</text>
  <text id="lblSystem" x="680" y="204" font-size="24" font-weight="600" text-anchor="middle" fill="#005885" data-reveal-after="board">shared system</text>

  <!-- caption on the clean floor band -->
  <text id="caption" x="640" y="632" font-size="40" font-weight="700" text-anchor="middle" fill="#142536">An idea becomes a connected system</text>
</svg>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  // Bulb flight: quadratic Bezier from the raised hand to the board core.
  var P0 = { x: 402, y: 170 }, PC = { x: 540, y: 96 }, P1 = { x: 640, y: 280 };
  function bez(t) {
    var u = 1 - t;
    return { x: u * u * P0.x + 2 * u * t * PC.x + t * t * P1.x, y: u * u * P0.y + 2 * u * t * PC.y + t * t * P1.y };
  }

  // Two-bone IK: returns the middle joint for root -> target with segment lengths.
  function ik(rx, ry, tx, ty, l1, l2, bend) {
    var dx = tx - rx, dy = ty - ry;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = l1 + l2 - 0.01;
    if (d > maxD) { tx = rx + dx / d * maxD; ty = ry + dy / d * maxD; dx = tx - rx; dy = ty - ry; d = maxD; }
    if (d < 1e-3) d = 1e-3;
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var mx = rx + dx * a / d, my = ry + dy * a / d;
    return { x: mx + bend * (-dy) * h / d, y: my + bend * dx * h / d, tx: tx, ty: ty };
  }

  // All pose state — the single property owner is the GSAP timeline below.
  var S = {
    // figure A (idea holder)
    aHip: 300, aHand: { x: 282, y: 418 },
    // figure B (system partner)
    bHip: 990, bStep1: 0, bStep2: 0, bHand: { x: 1004, y: 420 },
    // props
    bulbT: 0, bulbScale: 0, bulbOn: 0, coreScale: 0, ripple: 0
  };
  var B_FOOT1_FROM = 950, B_FOOT1_TO = 895, B_FOOT2_FROM = 1034, B_FOOT2_TO = 985;

  var jointsG = $("joints");
  var jointEls = [];
  function setJoints(list) {
    while (jointEls.length < list.length) {
      var c = document.createElementNS(NS, "circle"); c.setAttribute("r", "7"); jointsG.appendChild(c); jointEls.push(c);
    }
    for (var i = 0; i < jointEls.length; i++) {
      if (i < list.length) { jointEls[i].setAttribute("cx", list[i].x.toFixed(2)); jointEls[i].setAttribute("cy", list[i].y.toFixed(2)); jointEls[i].style.display = ""; }
      else jointEls[i].style.display = "none";
    }
  }
  function P(p) { return p.x.toFixed(2) + " " + p.y.toFixed(2); }

  // Build one stick figure from hip, feet and hand targets.
  function figure(hipX, feet, handFront, handBack, facing) {
    var hip = { x: hipX, y: 420 };
    var neck = { x: hipX, y: 310 };
    var head = { x: hipX, y: 250 };
    var k1 = ik(hip.x, hip.y, feet[0].x, feet[0].y, 76, 72, -facing);
    var k2 = ik(hip.x, hip.y, feet[1].x, feet[1].y, 76, 72, -facing);
    var e1 = ik(neck.x, neck.y, handFront.x, handFront.y, 68, 66, facing);
    var e2 = ik(neck.x, neck.y, handBack.x, handBack.y, 68, 66, facing);
    var T = function (o) { return { x: o.tx, y: o.ty }; };
    var d = "M" + hipX.toFixed(2) + " 282L" + P(hip) +
      "L" + P(k1) + "L" + P(T(k1)) +
      "M" + P(hip) + "L" + P(k2) + "L" + P(T(k2)) +
      "M" + P(neck) + "L" + P(e1) + "L" + P(T(e1)) +
      "M" + P(neck) + "L" + P(e2) + "L" + P(T(e2));
    return { d: d, head: head, joints: [neck, e1, e2, hip, k1, k2], hand: { x: e1.tx, y: e1.ty } };
  }

  function stepFoot(from, to, p) {
    return { x: from + (to - from) * p, y: 556 - Math.sin(Math.PI * p) * 24 };
  }

  function render() {
    // Figure A: feet anchored on the floor, front hand follows the idea.
    var A = figure(S.aHip, [{ x: 256, y: 556 }, { x: 346, y: 556 }], S.aHand, { x: 284, y: 418 }, 1);
    $("aBody").setAttribute("d", A.d);
    $("aHead").setAttribute("cx", A.head.x.toFixed(2)); $("aHead").setAttribute("cy", A.head.y);

    // Figure B: steps toward the board, then plants a hand on it.
    var f1 = stepFoot(B_FOOT1_FROM, B_FOOT1_TO, S.bStep1);
    var f2 = stepFoot(B_FOOT2_FROM, B_FOOT2_TO, S.bStep2);
    var Bf = figure(S.bHip, [f1, f2], S.bHand, { x: S.bHip + 12, y: 418 }, -1);
    $("bBody").setAttribute("d", Bf.d);
    $("bHead").setAttribute("cx", Bf.head.x.toFixed(2)); $("bHead").setAttribute("cy", Bf.head.y);

    setJoints(A.joints.concat(Bf.joints));

    // Bulb: before launch it sits above the hand; in flight it follows the arc.
    var bp = bez(S.bulbT);
    var bulb = $("bulb");
    var shrink = 1 - 0.55 * Math.max(0, (S.bulbT - 0.6) / 0.4);
    bulb.setAttribute("transform", "translate(" + bp.x.toFixed(2) + " " + bp.y.toFixed(2) + ") scale(" + (S.bulbScale * shrink).toFixed(4) + ")");
    bulb.setAttribute("opacity", S.bulbOn.toFixed(4));
    $("bulbGlow").setAttribute("opacity", (0.55 + 0.45 * S.bulbScale).toFixed(3));

    // Trail drawn up to the travelled point.
    if (S.bulbT > 0.001) {
      var d = "M" + P(P0), n = 28;
      for (var i = 1; i <= n; i++) d += "L" + P(bez(S.bulbT * i / n));
      $("trail").setAttribute("d", d);
    } else $("trail").setAttribute("d", "");

    var cs = S.coreScale;
    $("core").setAttribute("transform", "translate(640 280) scale(" + cs.toFixed(4) + ") translate(-640 -280)");
    $("boardRipple").setAttribute("r", (40 + 300 * S.ripple).toFixed(2));
    $("boardRipple").setAttribute("opacity", (S.ripple > 0 ? 0.9 * (1 - 0.65 * S.ripple) : 0).toFixed(3));
  }

  // Initial static states for GSAP-owned SVG attributes.
  var edges = document.querySelectorAll(".edge");
  var nodes = document.querySelectorAll(".node");
  gsap.set(edges, { attr: { "stroke-dasharray": "1 1", "stroke-dashoffset": 1 } });
  gsap.set(nodes, { scale: 0, transformOrigin: "50% 50%" });
  gsap.set(["#lblIdea", "#lblSystem"], { opacity: 0 });
  gsap.set("#caption", { opacity: 0, y: 10 });

  var tl = gsap.timeline({ paused: true, onUpdate: render });

  // Caption: stable reading surface from the opening.
  tl.to("#caption", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.05);

  // BEAT 1 — CHOICE (0–0.85): the idea appears; figure A reaches up and claims it.
  tl.to(S, { bulbOn: 1, bulbScale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.05);
  tl.to("#lblIdea", { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.18);
  tl.to(S.aHand, { x: 392, y: 222, duration: 0.45, ease: "power2.inOut" }, 0.15);
  // hold the choice pose 0.6 – 0.85

  // BEAT 2 — ACTION (0.85–1.4): hand follows through, idea arcs onto the shared board.
  tl.to(S, { aHip: 312, duration: 0.4, ease: "power2.inOut" }, 0.82);
  tl.to(S.aHand, { x: 438, y: 214, duration: 0.18, ease: "power2.in" }, 0.85);
  tl.to(S.aHand, { x: 446, y: 262, duration: 0.3, ease: "power2.out" }, 1.03);
  tl.to(S, { bulbT: 1, duration: 0.55, ease: "power1.inOut" }, 0.87);
  tl.to("#lblIdea", { opacity: 0, duration: 0.2, ease: "power1.in" }, 0.9);
  tl.to(S, { bulbOn: 0, duration: 0.1, ease: "none" }, 1.36);
  tl.to(S, { coreScale: 1, duration: 0.25, ease: "back.out(2.2)" }, 1.36);
  tl.to(S, { ripple: 1, duration: 0.6, ease: "power2.out" }, 1.38);
  tl.to("#lblSystem", { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.42);

  // Figure B walks in: hip glides while each foot lifts on an arc and plants.
  tl.to(S, { bHip: 935, duration: 0.6, ease: "power1.inOut" }, 0.9);
  tl.to(S, { bStep1: 1, duration: 0.3, ease: "power1.inOut" }, 0.9);
  tl.to(S, { bStep2: 1, duration: 0.32, ease: "power1.inOut" }, 1.1);

  // BEAT 3 — RESULT (1.45–2.3): B's hand contacts the board; the system connects.
  tl.to(S.bHand, { x: 900, y: 330, duration: 0.18, ease: "power2.in" }, 1.45);
  tl.to(S.bHand, { x: 812, y: 352, duration: 0.2, ease: "power2.out" }, 1.63);
  tl.to(nodes, { scale: 1, duration: 0.22, ease: "back.out(2)", stagger: 0.09 }, 1.82);
  tl.to(edges, { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power2.out", stagger: 0.07 }, 1.8);

  // Hold the outcome to 3.0 s.
  tl.to({}, { duration: 0.01 }, 2.99);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0, false);
  render();
  window.addEventListener("hf-seek", function (e) {
    var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tl.time();
    tl.seek(t, false); render();
  });
})();
</script>
