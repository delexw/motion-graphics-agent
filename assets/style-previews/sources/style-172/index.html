<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One-Action Microgames — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #120C33; overflow: hidden; }
  #root { width: 100%; height: 100%; position: relative; }
  #stage { width: 100%; height: 100%; display: block; }
  text { font-family: "Arial Rounded MT Bold", "Trebuchet MS", Verdana, Helvetica, Arial, sans-serif; font-weight: 700; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx=".44" cy=".47" r=".75">
      <stop offset="0" stop-color="#34248A"/><stop offset="1" stop-color="#120C33"/>
    </radialGradient>
    <radialGradient id="gl">
      <stop offset="0" stop-color="#FFE14D" stop-opacity=".55"/><stop offset="1" stop-color="#FFE14D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="st" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1.6" fill="#8F80FF"/><circle cx="60" cy="66" r="1" fill="#8F80FF"/>
    </pattern>
  </defs>

  <!-- Stationary environment -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#st)"/>

  <!-- HUD: static level line -->
  <text x="40" y="50" font-size="16" fill="#C9C2FF">LEVEL 1 · An idea becomes a connected system</text>

  <!-- CUE: goal pill (label grouped with its container) -->
  <g id="goal" transform="translate(560 100)">
    <g id="goalInner">
      <rect x="-200" y="-26" width="400" height="52" rx="26" fill="#FFFFFF"/>
      <text x="0" y="8" font-size="22" fill="#120C33" text-anchor="middle">GOAL: CONNECT THE IDEA</text>
    </g>
  </g>

  <!-- OUTCOME: warm glow (environment result state) -->
  <circle id="glow" cx="560" cy="350" r="250" fill="url(#gl)" opacity="0"/>

  <!-- OUTCOME: hexagon perimeter (dotted) -->
  <path id="hex" d="M740 350L650 194 470 194 380 350 470 506 650 506Z" fill="none" stroke="#3DF5A6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0"/>

  <!-- OUTCOME: links drawn from the idea to each node -->
  <g id="links" stroke="#3DF5A6" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L740 350"/>
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L650 194"/>
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L470 194"/>
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L380 350"/>
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L470 506"/>
    <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M560 350L650 506"/>
  </g>

  <!-- Idea bulb with rays -->
  <g id="rays" transform="translate(560 350)">
    <g id="raysInner" opacity="0">
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(30)"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(90)"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(150)"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(210)"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(270)"/>
      <rect x="-5" y="-128" width="10" height="30" rx="5" fill="#FFE14D" transform="rotate(330)"/>
    </g>
  </g>
  <g id="bulb" transform="translate(560 350)">
    <g id="bulbInner">
      <circle cx="0" cy="-10" r="66" fill="#4B3F96" stroke="#120C33" stroke-width="6"/>
      <circle id="bulbLit" cx="0" cy="-10" r="66" fill="#FFE14D" stroke="#120C33" stroke-width="6" opacity="0"/>
      <rect x="-26" y="48" width="52" height="30" rx="8" fill="#C9C2FF" stroke="#120C33" stroke-width="5"/>
      <!-- sleepy (flat) face → smile -->
      <path id="faceOff" d="M-18 0h36" fill="none" stroke="#8F80FF" stroke-width="6" stroke-linecap="round"/>
      <path id="faceOn" d="M-18 0q18-36 36 0" fill="none" stroke="#120C33" stroke-width="6" stroke-linecap="round" opacity="0"/>
    </g>
  </g>

  <!-- Nodes: cue state = loose hollow dashed circles, result = docked green rounded squares -->
  <g id="nodes">
    <g transform="translate(740 350)"><g class="node" data-dx="70" data-dy="-26" data-r="-24">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
    <g transform="translate(650 194)"><g class="node" data-dx="48" data-dy="-38" data-r="18">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
    <g transform="translate(470 194)"><g class="node" data-dx="-56" data-dy="-30" data-r="-14">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
    <g transform="translate(380 350)"><g class="node" data-dx="-74" data-dy="22" data-r="22">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
    <g transform="translate(470 506)"><g class="node" data-dx="-44" data-dy="40" data-r="-20">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
    <g transform="translate(650 506)"><g class="node" data-dx="60" data-dy="34" data-r="16">
      <circle class="nOff" r="30" fill="none" stroke="#8F80FF" stroke-width="4" stroke-dasharray="8 7"/>
      <rect class="nOn" x="-34" y="-34" width="68" height="68" rx="18" fill="#3DF5A6" stroke="#120C33" stroke-width="5" opacity="0"/>
    </g></g>
  </g>

  <!-- OUTCOME banner (kept below the action zone) -->
  <g id="banner" transform="translate(560 612)">
    <g id="bannerInner" opacity="0">
      <text x="0" y="20" font-size="56" fill="#3DF5A6" text-anchor="middle" stroke="#120C33" stroke-width="8" paint-order="stroke">SYSTEM ONLINE!</text>
    </g>
  </g>

  <!-- Score pill: away from the action zone -->
  <g id="score" transform="translate(1060 192)">
    <g id="scoreInner" opacity="0">
      <rect x="-70" y="-22" width="140" height="44" rx="22" fill="#3DF5A6"/>
      <text x="0" y="8" font-size="20" fill="#120C33" text-anchor="middle">+6 LINKS</text>
    </g>
  </g>

  <!-- CONTROL: single TAP button -->
  <g id="control" transform="translate(1060 388)">
    <g id="controlInner">
      <circle id="ring" r="124" fill="none" stroke="#FF4F8B" stroke-width="4" stroke-dasharray="14 12" opacity=".7"/>
      <circle id="ripple" r="96" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0"/>
      <circle cx="0" cy="4" r="96" fill="#120C33"/>
      <g id="cap">
        <circle cx="0" cy="-8" r="96" fill="#FF4F8B" stroke="#120C33" stroke-width="6"/>
        <text x="0" y="8" font-size="44" fill="#FFFFFF" text-anchor="middle">TAP</text>
      </g>
    </g>
  </g>
  <text id="actionLabel" x="1060" y="560" font-size="18" fill="#C9C2FF" text-anchor="middle" opacity="0">1 ACTION · PRESSED</text>

  <!-- Actor: fingertip that performs the one action -->
  <g id="finger" transform="translate(1060 388)">
    <g id="fingerInner">
      <rect x="-26" y="10" width="52" height="150" rx="26" fill="#F7D6C4" stroke="#120C33" stroke-width="5"/>
      <rect x="-14" y="22" width="28" height="22" rx="8" fill="#FFF1E8" stroke="#120C33" stroke-width="3"/>
    </g>
  </g>
</svg>
</div>

<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { overwrite: false } });
  var nodes = gsap.utils.toArray(".node");
  var nOff = gsap.utils.toArray(".nOff");
  var nOn = gsap.utils.toArray(".nOn");
  var links = gsap.utils.toArray(".link");

  // ---- Initial (cue) states, set explicitly so any seek is reproducible ----
  gsap.set("#goalInner", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#controlInner", { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#ring", { rotation: 0, transformOrigin: "50% 50%" });
  gsap.set("#ripple", { scale: 1, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#cap", { y: 0, scaleY: 1, transformOrigin: "50% 100%" });
  gsap.set("#fingerInner", { x: 150, y: 260, rotation: -18, transformOrigin: "50% 0%" });
  gsap.set("#raysInner", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#glow", { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#bulbInner", { scale: 0.92, transformOrigin: "50% 50%" });
  gsap.set("#bannerInner", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set("#scoreInner", { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" });
  nodes.forEach(function (n) {
    gsap.set(n, {
      x: +n.dataset.dx, y: +n.dataset.dy, rotation: +n.dataset.r,
      scale: 0.85, transformOrigin: "50% 50%"
    });
  });

  // ---- CUE 0.00–0.80: goal + single control appear, control pulses ----
  tl.to("#goalInner", { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.0);
  tl.to("#controlInner", { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.6)" }, 0.12);
  tl.to("#ring", { rotation: 60, duration: 0.95, ease: "none" }, 0.0);
  tl.to("#controlInner", { scale: 1.06, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.46);
  nodes.forEach(function (n, i) {
    tl.to(n, { y: "+=" + (i % 2 ? 6 : -6), duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1 + i * 0.03);
  });

  // ---- ACTION 0.45–0.95: fingertip travels in and presses TAP ----
  tl.to("#fingerInner", { x: 10, y: 22, rotation: -8, duration: 0.33, ease: "power2.out" }, 0.45);
  tl.to("#fingerInner", { y: 34, duration: 0.08, ease: "power2.in" }, 0.80);
  tl.to("#cap", { y: 10, scaleY: 0.94, duration: 0.08, ease: "power2.in" }, 0.80);
  tl.to("#ring", { opacity: 0, scale: 1.15, duration: 0.2, ease: "power2.out" }, 0.86);
  tl.fromTo("#ripple", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.86);
  tl.to("#cap", { y: 0, scaleY: 1, duration: 0.18, ease: "back.out(2)" }, 0.92);
  tl.to("#fingerInner", { x: 170, y: 360, rotation: -20, duration: 0.42, ease: "power2.in" }, 1.02);
  tl.to("#actionLabel", { opacity: 1, duration: 0.2, ease: "none" }, 0.95);

  // ---- OUTCOME 0.90–2.10: idea lights, links shoot out, nodes dock ----
  tl.to("#glow", { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.9);
  tl.to("#bulbLit", { opacity: 1, duration: 0.12, ease: "none" }, 0.9);
  tl.to("#faceOff", { opacity: 0, duration: 0.1, ease: "none" }, 0.9);
  tl.to("#faceOn", { opacity: 1, duration: 0.1, ease: "none" }, 0.92);
  tl.to("#bulbInner", { scale: 1.12, duration: 0.12, ease: "power2.out" }, 0.9);
  tl.to("#bulbInner", { scale: 1, duration: 0.28, ease: "back.out(2)" }, 1.02);
  tl.to("#raysInner", { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.98);

  links.forEach(function (l, i) {
    tl.to(l, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, 1.0 + i * 0.05);
  });
  nodes.forEach(function (n, i) {
    var t = 1.16 + i * 0.05;
    tl.to(n, { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, t);
    tl.to(nOff[i], { opacity: 0, duration: 0.12, ease: "none" }, t);
    tl.to(nOn[i], { opacity: 1, duration: 0.12, ease: "none" }, t + 0.04);
  });
  tl.to("#hex", { opacity: 1, duration: 0.3, ease: "none" }, 1.5);

  tl.to("#bannerInner", { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.7)" }, 1.62);
  tl.to("#scoreInner", { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.8)" }, 1.8);

  // Hold settled result to the end of the 3 s composition.
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0, false);
  window.addEventListener("hf-seek", function (e) {
    var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : null;
    if (t !== null) tl.seek(t, false);
  });
})();
</script>

</html>
