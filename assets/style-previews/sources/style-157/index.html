<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan-Lit Documentary — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #080C12; overflow: hidden; }
  #root { width: 100%; height: 100%; position: relative; }
  #stage { width: 100%; height: 100%; display: block; }
  .mono { font-family: Menlo, "SF Mono", Monaco, Consolas, monospace; font-size: 13px; letter-spacing: 1.5px; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-size: 46px; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vg" cx=".65" cy=".5" r=".7">
      <stop offset="0" stop-color="#121B27"/>
      <stop offset="1" stop-color="#06090E"/>
    </radialGradient>
    <radialGradient id="scanned" cx="840" cy="370" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2A3A"/>
      <stop offset="1" stop-color="#132030"/>
    </radialGradient>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1h4" stroke="#76E1CB" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="disc"><circle cx="840" cy="370" r="258"/></clipPath>
    <!-- Timed scanning mask: cumulative swept sector, path d derived from the GSAP-owned sweep angle -->
    <mask id="scanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <path id="sweptPath" d="M840 370Z" fill="#fff"/>
    </mask>
  </defs>

  <!-- Stationary background: unscanned regions stay near black -->
  <rect width="1280" height="720" fill="#070A10"/>
  <rect width="1280" height="720" fill="url(#vg)"/>
  <circle cx="840" cy="370" r="260" fill="#0A1018"/>

  <!-- Evidence layers (registered once, revealed only through the scan mask) -->
  <g id="scannedLayer" mask="url(#scanMask)" clip-path="url(#disc)">
    <circle cx="840" cy="370" r="260" fill="url(#scanned)"/>
    <circle cx="840" cy="370" r="260" fill="url(#sl)"/>
    <g id="returns" fill="#F5F4E8"></g>
  </g>

  <!-- Instrument graticule -->
  <g id="graticule" fill="none" stroke="#294359" stroke-width="1.5">
    <circle class="ring" cx="840" cy="370" r="85"/>
    <circle class="ring" cx="840" cy="370" r="170"/>
    <circle class="ring" cx="840" cy="370" r="255"/>
    <path id="crossH" d="M580 370H1100"/>
    <path id="crossV" d="M840 110V630"/>
  </g>
  <g id="ticks" stroke="#294359" stroke-width="1"></g>

  <!-- Instrument sweep (teal = instrument colour only) -->
  <g clip-path="url(#disc)">
    <g id="sweep" transform="rotate(30 840 370)">
      <g id="wedge"></g>
      <path d="M840 370H1100" stroke="#76E1CB" stroke-width="2"/>
    </g>
  </g>

  <!-- Relationship line (drawn only after both findings exist) -->
  <line id="link" x1="715" y1="440" x2="715" y2="440" stroke="#F5F4E8" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="5 6"/>

  <!-- Evidence E1 · IDEA (measured evidence = cream) -->
  <g id="e1">
    <circle id="e1ping" cx="700" cy="450" r="6" fill="none" stroke="#F5F4E8" stroke-width="1.5" opacity="0"/>
    <circle id="e1ring" cx="700" cy="450" r="18" fill="none" stroke="#F5F4E8" stroke-opacity=".45" opacity="0"/>
    <circle id="e1dot" cx="700" cy="450" r="6" fill="#F5F4E8" opacity="0"/>
  </g>

  <!-- Evidence E2 · SYSTEM: three connected nodes -->
  <g id="e2">
    <circle id="e2ping" cx="991" cy="266" r="10" fill="none" stroke="#F5F4E8" stroke-width="1.5" opacity="0"/>
    <path id="e2tri" d="M990 250L1012 272L972 276Z" fill="none" stroke="#F5F4E8" stroke-width="1.8" stroke-linejoin="round"/>
    <circle id="e2ring" cx="991" cy="266" r="34" fill="none" stroke="#F5F4E8" stroke-opacity=".45" opacity="0"/>
    <circle class="e2n" id="e2n1" cx="990" cy="250" r="5.5" fill="#F5F4E8" opacity="0"/>
    <circle class="e2n" id="e2n3" cx="972" cy="276" r="5" fill="#F5F4E8" opacity="0"/>
    <circle class="e2n" id="e2n2" cx="1012" cy="272" r="5" fill="#F5F4E8" opacity="0"/>
  </g>

  <!-- Evidence labels on stable dark backing, tagged with their scan -->
  <g class="mono">
    <g id="lab1" opacity="0">
      <rect x="546" y="470" width="146" height="26" fill="#070B11" stroke="#294359"/>
      <text x="556" y="488" fill="#F5F4E8">E1 · IDEA</text>
      <text x="652" y="488" fill="#76E1CB" font-size="10" letter-spacing="1">P1</text>
    </g>
    <g id="lab2" opacity="0">
      <rect x="1040" y="228" width="170" height="26" fill="#070B11" stroke="#294359"/>
      <text x="1050" y="246" fill="#F5F4E8">E2 · SYSTEM</text>
      <text x="1172" y="246" fill="#76E1CB" font-size="10" letter-spacing="1">P2</text>
    </g>
    <g id="lab3" opacity="0">
      <rect x="786" y="394" width="146" height="24" fill="#070B11" stroke="#294359"/>
      <text x="796" y="411" fill="#C9D6DF">LINKED · PASS 2</text>
    </g>

    <!-- Case-file column -->
    <text id="caseFile" x="70" y="190" fill="#76E1CB" opacity="0">CASE FILE 07</text>
    <text id="pass1" x="70" y="560" fill="#6D8296" opacity="0">PASS 1  ▸ SIGNAL</text>
    <text id="pass2" x="70" y="584" fill="#6D8296" opacity="0">PASS 2  ▸ NETWORK</text>
    <rect id="pass1bar" x="56" y="549" width="4" height="14" fill="#76E1CB" opacity="0"/>
    <rect id="pass2bar" x="56" y="573" width="4" height="14" fill="#76E1CB" opacity="0"/>
  </g>
  <g class="serif" fill="#F5F4E8">
    <text class="tl" x="70" y="260" opacity="0">An idea</text>
    <text class="tl" x="70" y="316" opacity="0">becomes a</text>
    <text class="tl" x="70" y="372" opacity="0">connected</text>
    <text class="tl" x="70" y="428" opacity="0">system.</text>
  </g>
  <path id="rule" d="M70 462H420" stroke="#294359" stroke-width="2" stroke-dasharray="350" stroke-dashoffset="350"/>
  <text id="sub" class="sans" x="70" y="500" fill="#AFC0CC" opacity="0">Two signals, two passes, one relationship.</text>
</svg>
</div>

<script src="gsap.min.js"></script>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var CX = 840, CY = 370, R = 260;
  var A0 = 30; // sweep start angle (deg, SVG clockwise from +x)

  // ---- Static construction (seeded, built once) ----
  var seed = 157;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  var returns = document.getElementById('returns');
  function dot(x, y, r, o) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', r.toFixed(2)); c.setAttribute('fill-opacity', o.toFixed(2));
    returns.appendChild(c);
  }
  // diffuse background returns (ground clutter)
  for (var i = 0; i < 320; i++) {
    var rr = Math.sqrt(rnd()) * 250, th = rnd() * Math.PI * 2;
    dot(CX + Math.cos(th) * rr, CY + Math.sin(th) * rr, 0.8 + rnd() * 1.4, 0.10 + rnd() * 0.22);
  }
  // clustered returns around the two evidence regions
  function cluster(x, y, n, spread) {
    for (var k = 0; k < n; k++) {
      var d = Math.pow(rnd(), 1.6) * spread, a = rnd() * Math.PI * 2;
      dot(x + Math.cos(a) * d, y + Math.sin(a) * d, 0.9 + rnd() * 1.6, 0.25 + rnd() * 0.35);
    }
  }
  cluster(700, 450, 46, 48);
  cluster(991, 266, 60, 58);
  // faint range arcs inside scanned layer
  [42, 128, 212].forEach(function (r) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', r);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#294359'); c.setAttribute('stroke-opacity', '.6');
    c.setAttribute('stroke-dasharray', '2 6');
    returns.appendChild(c);
  });

  // bearing ticks
  var ticks = document.getElementById('ticks');
  for (var t = 0; t < 72; t++) {
    var ang = t * 5 * Math.PI / 180, l = (t % 6 === 0) ? 12 : 5;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + (CX + Math.cos(ang) * 260).toFixed(1) + ' ' + (CY + Math.sin(ang) * 260).toFixed(1) +
      'L' + (CX + Math.cos(ang) * (260 + l)).toFixed(1) + ' ' + (CY + Math.sin(ang) * (260 + l)).toFixed(1));
    ticks.appendChild(p);
  }

  // sweep wedge: trailing slices behind the arm (arm points along +x before rotation)
  var wedge = document.getElementById('wedge');
  var SL = 14, SPAN = 42;
  for (var s = 0; s < SL; s++) {
    var a1 = -(s + 1) * SPAN / SL * Math.PI / 180, a2 = -s * SPAN / SL * Math.PI / 180;
    var w = document.createElementNS(NS, 'path');
    w.setAttribute('d', 'M' + CX + ' ' + CY + 'L' + (CX + Math.cos(a1) * R).toFixed(2) + ' ' + (CY + Math.sin(a1) * R).toFixed(2) +
      'A' + R + ' ' + R + ' 0 0 1 ' + (CX + Math.cos(a2) * R).toFixed(2) + ' ' + (CY + Math.sin(a2) * R).toFixed(2) + 'Z');
    w.setAttribute('fill', '#76E1CB');
    w.setAttribute('fill-opacity', (0.30 * Math.pow(1 - s / SL, 1.8)).toFixed(3));
    wedge.appendChild(w);
  }

  // ---- Derived drawing from the GSAP-owned sweep proxy ----
  var sweepEl = document.getElementById('sweep');
  var swept = document.getElementById('sweptPath');
  var state = { a: A0 };
  function pt(deg, r) { var q = deg * Math.PI / 180; return (CX + Math.cos(q) * r).toFixed(2) + ' ' + (CY + Math.sin(q) * r).toFixed(2); }
  function draw() {
    var a = state.a;
    sweepEl.setAttribute('transform', 'rotate(' + a.toFixed(3) + ' ' + CX + ' ' + CY + ')');
    var span = Math.max(0, Math.min(360, a - A0));
    var RR = R + 4, d;
    if (span <= 0.01) d = 'M' + CX + ' ' + CY + 'Z';

  // graticule + copy establish

    var L = 2 * Math.PI * parseFloat(c.getAttribute('r'));
    c.setAttribute('stroke-dasharray', L.toFixed(1));
    tl.fromTo(c, { attr: { 'stroke-dashoffset': L } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power2.inOut' }, 0);
  });
  tl.fromTo(['#crossH', '#crossV'], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'sine.inOut' }, 0.05);
  tl.fromTo('#ticks', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'sine.inOut' }, 0.1);
  tl.fromTo('#caseFile', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'sine.inOut' }, 0);
  tl.fromTo('.tl', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.06 }, 0.05);
  tl.fromTo('#rule', { attr: { 'stroke-dashoffset': 350 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.45, ease: 'power2.inOut' }, 0.25);
  tl.fromTo(['#pass1', '#pass2'], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'sine.inOut' }, 0.15);

  // the sweep: one revolution for two passes, then decelerate and dim
  tl.fromTo(state, { a: A0 }, { a: A0 + 360, duration: TREV, ease: 'none' }, T0);
  tl.to(state, { a: A0 + 410, duration: 0.65, ease: 'power2.out' }, T0 + TREV);
  tl.fromTo('#wedge', { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: 'sine.inOut', immediateRender: false }, 1.9);
  tl.fromTo('#sweep', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, T0 - 0.08);

  // pass indicators
  tl.fromTo('#pass1', { fill: '#6D8296' }, { fill: '#76E1CB', duration: 0.15, ease: 'sine.inOut', immediateRender: false }, T0);
  tl.fromTo('#pass1bar', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, T0);
  tl.to('#pass1', { fill: '#C9D6DF', duration: 0.15, ease: 'sine.inOut' }, PASS_SPLIT);
  tl.to('#pass1bar', { opacity: 0, duration: 0.15, ease: 'sine.inOut' }, PASS_SPLIT);
  tl.fromTo('#pass2', { fill: '#6D8296' }, { fill: '#76E1CB', duration: 0.15, ease: 'sine.inOut', immediateRender: false }, PASS_SPLIT);
  tl.fromTo('#pass2bar', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, PASS_SPLIT);
  tl.to('#pass2', { fill: '#C9D6DF', duration: 0.2, ease: 'sine.inOut' }, 1.95);
  tl.to('#pass2bar', { opacity: 0, duration: 0.2, ease: 'sine.inOut' }, 1.95);

  // PASS 1 finding: E1 · IDEA
  tl.fromTo('#e1dot', { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 6 }, duration: 0.25, ease: 'back.out(1.2)' }, tE1);
  tl.fromTo('#e1ping', { opacity: 0.9, attr: { r: 6 } }, { opacity: 0, attr: { r: 44 }, duration: 0.5, ease: 'power2.out', immediateRender: false }, tE1);
  tl.fromTo('#e1ring', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'sine.inOut' }, tE1 + 0.1);
  tl.fromTo('#lab1', { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out' }, tE1 + 0.08);

  // PASS 2 finding: E2 · SYSTEM (nodes appear as the sweep crosses each bearing)
  tl.fromTo('#e2n1', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, tN1);
  tl.fromTo('#e2n3', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, tN3);
  tl.fromTo('#e2n2', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, tN2);
  var triLen = 31.1 + 40.2 + 31.1;
  document.getElementById('e2tri').setAttribute('stroke-dasharray', triLen.toFixed(1));
  tl.fromTo('#e2tri', { attr: { 'stroke-dashoffset': triLen } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.28, ease: 'power2.inOut' }, tN2 + 0.02);
  tl.fromTo('#e2ping', { opacity: 0.9, attr: { r: 10 } }, { opacity: 0, attr: { r: 64 }, duration: 0.5, ease: 'power2.out', immediateRender: false }, tN1);
  tl.fromTo('#e2ring', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'sine.inOut' }, tN2 + 0.1);
  tl.fromTo('#lab2', { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out' }, tN2 + 0.1);

  // Comparison delayed until both findings are visible
  var tLink = 1.95;
  tl.fromTo('#link', { attr: { x2: 715, y2: 440 } }, { attr: { x2: 962, y2: 284 }, duration: 0.4, ease: 'power2.inOut' }, tLink);
  tl.fromTo('#lab3', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'sine.inOut' }, tLink + 0.32);
  tl.fromTo('#sub', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, tLink + 0.1);
  // pad to full duration (settled hold 2.5s → 3.0s)
  tl.set({}, {}, 3);

  tl.seek(0, false);
  draw();
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : null;
    if (t !== null) tl.seek(t, false);
    draw();
  });
})();
</script>
