<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Urban Ink and Wash — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #E9ECE7; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #E9ECE7; }
  #scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .caption { position: absolute; left: 11%; top: 82.5%; margin: 0;
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400;
    font-size: 38px; line-height: 44px; color: #242831; opacity: 0; }
  .note { position: absolute; right: 6.25%; top: 91.5%; margin: 0;
    font-family: Georgia, "Times New Roman", serif; font-size: 16px; letter-spacing: 3px;
    color: #242831; opacity: 0; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="scene" width="1280" height="720"></canvas>
  <p class="caption" id="caption">An idea becomes<br>a connected system.</p>
  <p class="note" id="note">MAIN ST. · SKETCH NO. 7</p>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720;
  var INK = "#242831", ACTIVE = "#9F352D", SKY = "#8FB3C6", PAPER = "#E9ECE7";
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");

  function rng(seed) {

    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

  // ---------- Stationary paper plane (cached, seeded) ----------
  var paper = mk(W, H);
  (function () {
    var p = paper.getContext("2d");
    p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
    var img = p.getImageData(0, 0, W, H), d = img.data, r = rng(4);
    for (var i = 0; i < d.length; i += 4) {
      var n = (r() - 0.5) * 9;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    p.putImageData(img, 0, 0);
    var r2 = rng(11);
    p.globalAlpha = 0.035; p.fillStyle = "#6b6f72";
    for (var k = 0; k < 900; k++) { // paper fibres
      p.fillRect(r2() * W, r2() * H, 1 + r2() * 3, 1);
    }
    p.globalAlpha = 1;
  })();

  // ---------- Pen strokes ----------
  // Each stroke: points, start/end in "line pass" units, width, overshoot.
  var strokes = [];
  function stroke(pts, t0, t1, w, opts) {
    opts = opts || {};
    var r = rng(strokes.length * 97 + 13);
    var over = opts.over == null ? 5 : opts.over;
    // overshoot first and last segment (urban-sketch construction marks)
    if (over > 0 && pts.length >= 2) {
      var a = pts[0], b = pts[1];
      var dx = a[0] - b[0], dy = a[1] - b[1], l = Math.hypot(dx, dy) || 1;
      pts = [[a[0] + dx / l * over, a[1] + dy / l * over]].concat(pts.slice(1));
      var y = pts[pts.length - 1], z = pts[pts.length - 2];
      dx = y[0] - z[0]; dy = y[1] - z[1]; l = Math.hypot(dx, dy) || 1;
      pts = pts.slice(0, -1).concat([[y[0] + dx / l * over, y[1] + dy / l * over]]);
    }
    // subdivide with seeded wobble
    var out = [], cum = [0], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i], p1 = pts[i + 1];
      var sl = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      var n = Math.max(2, Math.ceil(sl / 7));

        var q = [p0[0] + (p1[0] - p0[0]) * u + nx * off, p0[1] + (p1[1] - p0[1]) * u + ny * off];

      }

      var press = 0.55 + 0.45 * Math.sin(Math.min(1, u * 1.15) * Math.PI * 0.5 + 0.0) * (1 - Math.pow(u, 6) * 0.5);

  }
  function rect(x0, y0, x1, y1, t0, t1, w) { stroke([[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]], t0, t1, w, { over: 3 }); }

  // Big street structure first (pass units 0..1 mapped by GSAP)
  stroke([[0, 400], [1280, 400]], 0.00, 0.16, 2.6, { over: 0, wobble: 0.5 });
  stroke([[0, 640], [560, 400]], 0.04, 0.20, 3.2);
  stroke([[1280, 640], [720, 400]], 0.06, 0.22, 3.2);
  // left block
  stroke([[60, 160], [330, 250], [330, 440], [60, 540], [60, 160]], 0.14, 0.40, 3.2, { over: 4 });
  stroke([[330, 250], [470, 290], [470, 410], [330, 440]], 0.28, 0.46, 3.0);
  // right block
  stroke([[1220, 160], [950, 250], [950, 440], [1220, 540], [1220, 160]], 0.18, 0.44, 3.2, { over: 4 });
  stroke([[950, 250], [810, 290], [810, 410], [950, 440]], 0.32, 0.50, 3.0);
  // landmark tower (recurring anchor)
  stroke([[600, 410], [600, 180], [640, 140], [680, 180], [680, 410]], 0.44, 0.66, 3.6, { over: 3 });
  stroke([[600, 180], [680, 180]], 0.60, 0.68, 3.0);
  stroke([[640, 140], [640, 84]], 0.64, 0.72, 2.8, { over: 0 });
  // facade details
  var det = [
    [[100, 250], [290, 300]], [[100, 330], [290, 360]], [[100, 410], [290, 420]],
    [[1180, 250], [990, 300]], [[1180, 330], [990, 360]], [[1180, 410], [990, 420]],
    [[360, 300], [360, 400]], [[440, 310], [440, 400]], [[920, 300], [920, 400]], [[840, 310], [840, 400]],
    [[620, 220], [660, 220]], [[620, 270], [660, 270]], [[620, 320], [660, 320]],
    [[150, 520], [150, 470], [210, 455], [210, 497]], [[1130, 520], [1130, 470], [1070, 455], [1070, 497]],
    [[626, 410], [626, 372], [654, 372], [654, 410]]
  ];
  det.forEach(function (s, i) { stroke(s, 0.58 + i * 0.016, 0.70 + i * 0.016, 1.7, { over: 3, wobble: 0.5 }); });
  // cobble/kerb hatching on the road
  for (var c = 0; c < 4; c++) {
    var yy = 430 + c * c * 9 + c * 14, sp = (yy - 400) / 240;
    stroke([[640 - 70 - sp * 330, yy], [640 - 30 - sp * 160, yy]], 0.74 + c * 0.02, 0.82 + c * 0.02, 1.1, { over: 0, wobble: 0.4 });
    stroke([[640 + 30 + sp * 160, yy], [640 + 70 + sp * 330, yy]], 0.75 + c * 0.02, 0.83 + c * 0.02, 1.1, { over: 0, wobble: 0.4 });
  }

  // lamp = the idea (circle + rays), drawn as strokes too
  var lamp = [];
  for (var a = 0; a <= 36; a++) { var th = -Math.PI / 2 + a / 36 * Math.PI * 2; lamp.push([640 + Math.cos(th) * 10, 72 + Math.sin(th) * 10]); }
  stroke(lamp, 0.86, 0.94, 2.8, { over: 0, wobble: 0.2 });

  function drawStroke(s, p) {
    if (p <= 0) return;
    var L = s.len * clamp(p, 0, 1);
    ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.globalAlpha = s.alpha;
    for (var i = 1; i < s.pts.length; i++) {
      if (s.cum[i - 1] >= L) break;
      var a = s.pts[i - 1], b = s.pts[i], f = 1;
      if (s.cum[i] > L) f = (L - s.cum[i - 1]) / (s.cum[i] - s.cum[i - 1] || 1);
      ctx.lineWidth = s.w[i];
      ctx.beginPath(); ctx.moveTo(a[0], a[1]);
      ctx.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Transparent pigment islands (separate irregular masks) ----------
  function blob(cx, cy, rx, ry, seed, rough, sq) {
    var r = rng(seed), N = 96, ph = [r() * 6, r() * 6, r() * 6], pts = [];
    for (var i = 0; i < N; i++) {
      var th = i / N * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
      var e = 2 / sq;
      var x = Math.sign(c) * Math.pow(Math.abs(c), e), y = Math.sign(s) * Math.pow(Math.abs(s), e);
      var k = 1 + rough * (0.5 * Math.sin(th * 5 + ph[0]) + 0.3 * Math.sin(th * 11 + ph[1]) + 0.2 * Math.sin(th * 23 + ph[2])) + (r() - 0.5) * rough * 0.6;
      pts.push({ x: x * rx * k, y: y * ry * k, lag: r() });
    }
    return { cx: cx, cy: cy, pts: pts };
  }
  function blobPath(g, b, p, ox, oy) {
    g.beginPath();
    for (var i = 0; i < b.pts.length; i++) {
      var q = b.pts[i];
      var pp = clamp((p * 1.35 - q.lag * 0.35), 0, 1);
      pp = 1 - Math.pow(1 - pp, 2.2);

    }
    g.closePath();
  }

  function washLayer(b, color, alpha, seed) {
    var cv = mk(W, H), g = cv.getContext("2d"), r = rng(seed);
    g.fillStyle = color; g.globalAlpha = alpha;
    blobPath(g, b, 1); g.fill();
    g.save(); blobPath(g, b, 1); g.clip();
    g.globalAlpha = alpha * 0.55; // second, offset pass = pooled pigment
    for (var j = 0; j < 5; j++) {
      g.beginPath();
      g.ellipse(b.cx + (r() - 0.5) * 120, b.cy + (r() - 0.5) * 180, 30 + r() * 60, 40 + r() * 90, r() * 3, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 0.10; // granulation
    for (var k = 0; k < 2600; k++) g.fillRect(b.cx + (r() - 0.5) * 900, b.cy + (r() - 0.5) * 600, 1.4, 1.4);

    return cv;

  var lampBlob = blob(640, 76, 30, 28, 33, 0.14, 2.0);
  var skyBlob = blob(640, 182, 520, 116, 7, 0.035, 6.0);
  var towerWash = washLayer(towerBlob, ACTIVE, 0.42, 5);
  var lampWash = washLayer(lampBlob, "#C8553A", 0.42, 6);
  var skyWash = washLayer(skyBlob, SKY, 0.26, 8);
  // light gap on the tower's lit face (paper left bare)
  var gap = blob(668, 300, 9, 90, 40, 0.15, 2.4);
  [towerWash].forEach(function (cv) {
    var g = cv.getContext("2d"); g.globalCompositeOperation = "destination-out"; g.globalAlpha = 0.85;

  });

  function drawWash(cv, b, p) {
    if (p <= 0) return;
    ctx.save();
    blobPath(ctx, b, p); ctx.clip();
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(cv, 0, 0);
    ctx.restore();
  }

  // ---------- Connections: idea lamp -> building nodes ----------
  var nodes = [[330, 250], [470, 290], [950, 250], [810, 290], [60, 160], [1220, 160]];
  var ctrl = [[470, 210], [560, 240], [790, 210], [720, 240], [340, 60], [940, 60]];
  function quad(p0, c, p1, t) {

  var caption = document.getElementById("caption"), note = document.getElementById("note");

    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

    drawWash(skyWash, skyBlob, S.sky);
    drawWash(towerWash, towerBlob, S.tower);
    drawWash(lampWash, lampBlob, S.lamp);
    for (var i = 0; i < strokes.length; i++) {
      var s = strokes[i];
      drawStroke(s, (S.line - s.t0) / (s.t1 - s.t0));

  tl.to(S, { line: 1, duration: 1.40, ease: "power1.inOut" }, 0.0);
  tl.to(S, { rays: 1, duration: 0.25, ease: "power2.out" }, 1.30);
  // 1.35–2.05  local colour opens on the landmark only after it reads
  tl.to(S, { tower: 1, duration: 0.70, ease: "sine.inOut" }, 1.35);
  tl.to(S, { lamp: 1, duration: 0.45, ease: "sine.out" }, 1.45);
  tl.to(S, { sky: 1, duration: 0.75, ease: "sine.inOut" }, 1.55);
  // 1.85–2.45  the idea connects to the street (system)
  tl.to(S, { links: 1, duration: 0.55, ease: "power2.inOut" }, 1.85);
  tl.to(S, { nodes: 1, duration: 0.50, ease: "back.out(1.6)" }, 1.95);
  // 2.05–2.45  captions, then hold to 3.0
  tl.fromTo(caption, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" }, 2.05);
  tl.fromTo(note, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.15);
  tl.set({}, {}, 3.0);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  function seekTo(t) { tl.seek(clamp(+t || 0, 0, 3), false); render(); }
  window.addEventListener("hf-seek", function (e) {
    var t = e && e.detail && (e.detail.time != null ? e.detail.time : e.detail);
    if (typeof t === "number") seekTo(t); else render();
  });
  tl.seek(0); render();
})();
</script>
