<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Uncut Countdown — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #E9EFF2; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; }
  svg { display: block; width: 100%; height: 100%; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family: Menlo, "SF Mono", Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D9E3E9" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- stationary background -->
  <rect width="1280" height="720" fill="#E9EFF2"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- heading -->
  <text class="sans" x="64" y="78" font-size="32" font-weight="700" fill="#142536">An idea becomes a connected system</text>
  <text class="sans" x="66" y="108" font-size="14" letter-spacing="4" fill="#3E5568">FOUR VIEWS · ONE CLOCK</text>

  <!-- connectors from clock to views -->
  <g id="connectors" fill="none"></g>

  <!-- views -->
  <g id="views"></g>

  <!-- the one authoritative clock (fixed region) -->
  <g id="clock">
    <circle id="pulse" cx="290" cy="400" r="130" fill="none" stroke="#3FA9DC" stroke-width="6" opacity="0"/>
    <circle cx="290" cy="400" r="130" fill="#142536"/>
    <g id="ticks"></g>
    <circle id="arc" cx="290" cy="400" r="112" fill="none" stroke="#3FA9DC" stroke-width="10"
            pathLength="1" stroke-dasharray="0 1" transform="rotate(-90 290 400)"/>
    <!-- trigger marker: separate from ordinary ticks -->
    <path id="trigger" d="M290 262 L280 246 H300 Z" fill="#3FA9DC"/>
    <text id="clockT" class="mono" x="290" y="372" text-anchor="middle" font-size="16" letter-spacing="3" fill="#B9D5DE">T MINUS</text>
    <text id="clockDigits" class="mono" x="290" y="420" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">02.20</text>
    <text id="clockLabel" class="sans" x="290" y="452" text-anchor="middle" font-size="13" letter-spacing="3" fill="#B9D5DE">TO CONNECTED</text>
  </g>

  <text class="sans" x="640" y="684" text-anchor="middle" font-size="16" fill="#3E5568">Every view runs on the same clock — the outcome view lights up at zero.</text>
</svg>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var DUR = 3, TRIGGER = 2.2;
  var CX = 290, CY = 400, R = 130;
  var VW = 310, VH = 220;
  var CELLS = [[560, 150], [890, 150], [560, 390], [890, 390]];
  var NAMES = ["01 · SPARK", "02 · PAIR", "03 · LINKS", "04 · SYSTEM"];

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  var E = {
    p3o: gsap.parseEase("power3.out"),
    p2i: gsap.parseEase("power2.in"),
    p3io: gsap.parseEase("power3.inOut"),
    p2o: gsap.parseEase("power2.out"),
    back: gsap.parseEase("back.out(1.7)")
  };
  function prog(t, a, b, ease) { var p = clamp((t - a) / (b - a)); return ease ? ease(p) : p; }
  function lerp(a, b, p) { return a + (b - a) * p; }

  // clock ticks (ordinary ticks; trigger has its own marker)
  var ticks = document.getElementById("ticks");
  for (var i = 0; i < 44; i++) {
    if (i === 0) continue;
    var a = (i / 44) * Math.PI * 2 - Math.PI / 2;
    el("line", {
      x1: CX + Math.cos(a) * 120, y1: CY + Math.sin(a) * 120,
      x2: CX + Math.cos(a) * 126, y2: CY + Math.sin(a) * 126,
      stroke: "#4E6A80", "stroke-width": 2
    }, ticks);
  }

  // views
  var viewsG = document.getElementById("views");
  var connG = document.getElementById("connectors");
  var views = [];
  function draw(parent, d, stroke, width) {
    return el("path", { d: d, fill: "none", stroke: stroke, "stroke-width": width, "stroke-linecap": "round",
      "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }, parent);
  }
  for (var v = 0; v < 4; v++) {
    var g = el("g", {}, viewsG);
    var frame = el("rect", { x: 0, y: 0, width: VW, height: VH, rx: 10, fill: "#FFFFFF", stroke: "#A9C3CE", "stroke-width": 2 }, g);
    var label = el("text", { "class": "mono", x: 18, y: 30, "font-size": 13, "font-weight": 700, fill: "#3E5568" }, g);
    label.textContent = NAMES[v];
    var sync = el("text", { "class": "mono", x: VW - 18, y: 30, "font-size": 11, "text-anchor": "end", fill: "#5F7686" }, g);
    sync.textContent = "SYNC";
    // shared-clock bar: same position in every view
    el("line", { x1: 18, y1: VH - 22, x2: VW - 18, y2: VH - 22, stroke: "#D3E1E7", "stroke-width": 4, "stroke-linecap": "round" }, g);
    var fill = el("line", { x1: 18, y1: VH - 22, x2: 18, y2: VH - 22, stroke: "#005885", "stroke-width": 4, "stroke-linecap": "round" }, g);
    el("path", { d: "M" + (VW - 18) + " " + (VH - 32) + "V" + (VH - 12), stroke: "#3FA9DC", "stroke-width": 3 }, g);
    var head = el("circle", { cx: 18, cy: VH - 22, r: 5, fill: "#142536" }, g);
    var conn = el("path", { fill: "none", stroke: "#9FBCC8", "stroke-width": 2, "stroke-dasharray": "6 6" }, connG);
    views.push({ g: g, frame: frame, label: label, fill: fill, head: head, conn: conn, art: [], nodes: [] });
  }

  // 01 SPARK — a lightbulb idea
  var s = views[0];
  s.art.push(draw(s.g, "M155 70 a28 28 0 1 1 -0.1 0 Z", "#142536", 3));
  s.art.push(draw(s.g, "M141 122 v18 h28 v-18 M146 150 h18", "#142536", 3));
  s.art.push(draw(s.g, "M155 46 v-8 M120 60 l-6 -6 M190 60 l6 -6 M108 96 h-9 M202 96 h9", "#005885", 3));
  // 02 PAIR — two ideas linked
  var p = views[1];
  p.art.push(draw(p.g, "M110 110 L200 110", "#142536", 3));
  [[110, 110], [200, 110]].forEach(function (c) { p.nodes.push(el("circle", { cx: c[0], cy: c[1], r: 0, fill: "#142536" }, p.g)); });
  // 03 LINKS — a small tree
  var l = views[2];
  l.art.push(draw(l.g, "M155 70 L95 140 M155 70 L155 140 M155 70 L215 140", "#142536", 3));
  [[155, 70], [95, 140], [155, 140], [215, 140]].forEach(function (c) { l.nodes.push(el("circle", { cx: c[0], cy: c[1], r: 0, fill: "#142536" }, l.g)); });
  // 04 SYSTEM — the outcome network
  var o = views[3];
  var hx = 155, hy = 106, hr = 58, pts = [];
  for (var k = 0; k < 6; k++) { var ang = Math.PI / 6 + k * Math.PI / 3; pts.push([hx + Math.cos(ang) * hr, hy + Math.sin(ang) * hr]); }
  var ghost = el("path", { d: "M" + pts.map(function (q) { return q.join(" "); }).join("L") + "Z", fill: "none", stroke: "#B9D5DE", "stroke-width": 2, "stroke-dasharray": "4 5", opacity: 0 }, o.g);
  var hexD = "M" + pts.map(function (q) { return q.join(" "); }).join("L") + "Z";
  var spokes = pts.map(function (q) { return "M" + hx + " " + hy + "L" + q[0] + " " + q[1]; }).join("");
  o.art.push(draw(o.g, hexD, "#005885", 3));
  o.art.push(draw(o.g, spokes, "#005885", 3));
  pts.forEach(function (q) { o.nodes.push(el("circle", { cx: q[0], cy: q[1], r: 0, fill: "#005885" }, o.g)); });
  var hub = el("circle", { cx: hx, cy: hy, r: 0, fill: "#FFFFFF", stroke: "#005885", "stroke-width": 4 }, o.g);

  var digits = document.getElementById("clockDigits");
  var clockT = document.getElementById("clockT");
  var clockLabel = document.getElementById("clockLabel");
  var arc = document.getElementById("arc");
  var pulse = document.getElementById("pulse");
  var trig = document.getElementById("trigger");

  function setArt(path, pr) { path.setAttribute("stroke-dashoffset", (1 - pr).toFixed(4)); }
  function setNodes(list, t, a, rad) {
    list.forEach(function (n, j) { n.setAttribute("r", (rad * prog(t, a + j * 0.04, a + j * 0.04 + 0.22, E.back)).toFixed(2)); });
  }

  function render(t) {
    t = Math.max(0, Math.min(DUR, t));
    // one authoritative clock: elapsed composition time, never restarted
    var remain = Math.max(0, TRIGGER - t);
    var cs = Math.round(remain * 100);
    var secs = Math.floor(cs / 100), cc = cs % 100;
    digits.textContent = (secs < 10 ? "0" : "") + secs + "." + (cc < 10 ? "0" : "") + cc;
    var fired = t >= TRIGGER;
    var clockP = Math.min(1, t / TRIGGER);
    arc.setAttribute("stroke-dasharray", clockP.toFixed(4) + " 1");
    clockT.textContent = fired ? "ZERO" : "T MINUS";
    clockLabel.textContent = fired ? "CONNECTED" : "TO CONNECTED";
    clockLabel.setAttribute("fill", fired ? "#3FA9DC" : "#B9D5DE");
    var pp = prog(t, TRIGGER, TRIGGER + 0.45, E.p2o);
    pulse.setAttribute("r", (130 + 40 * pp).toFixed(2));
    pulse.setAttribute("opacity", (fired ? 1 - pp : 0).toFixed(3));
    trig.setAttribute("transform", "translate(290 254) scale(" + (1 + 0.5 * (1 - pp) * (fired ? 1 : 0)) + ") translate(-290 -254)");

    for (var i = 0; i < 4; i++) {
      var vw = views[i];
      // expand from the clock into the synchronised grid
      var ex = prog(t, 0.2 + i * 0.14, 0.7 + i * 0.14, E.p3o);
      var sx = CX - VW * 0.15 / 2, sy = CY - VH * 0.15 / 2;
      var x = lerp(sx, CELLS[i][0], ex), y = lerp(sy, CELLS[i][1], ex), sc = lerp(0.15, 1, ex);
      var op = prog(t, 0.2 + i * 0.14, 0.45 + i * 0.14);
      if (i < 3) {
        // converge back into the clock after the trigger
        var cv = prog(t, 2.25 + i * 0.04, 2.6 + i * 0.04, E.p2i);
        x = lerp(x, sx, cv); y = lerp(y, sy, cv); sc = lerp(sc, 0.15, cv); op *= 1 - cv;
      } else {
        // outcome view grows to the readable hero position
        var gr = prog(t, 2.25, 2.65, E.p3io);
        x = lerp(x, 575, gr); y = lerp(y, 150, gr); sc = lerp(sc, 2.0, gr);
      }
      vw.g.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") scale(" + sc.toFixed(4) + ")");
      vw.g.setAttribute("opacity", op.toFixed(3));
      // shared clock bar inside each view
      var bx = 18 + (VW - 36) * clockP;
      vw.fill.setAttribute("x2", bx.toFixed(2));
      vw.head.setAttribute("cx", bx.toFixed(2));
      vw.head.setAttribute("fill", fired ? "#3FA9DC" : "#142536");
      // connector from clock edge to the view's left middle
      var lx = x, ly = y + VH * sc / 2;
      var mx = (CX + R + 6 + lx) / 2;
      vw.conn.setAttribute("d", "M" + (CX + R + 6) + " " + CY + "C" + mx + " " + CY + " " + mx + " " + ly.toFixed(2) + " " + lx.toFixed(2) + " " + ly.toFixed(2));
      vw.conn.setAttribute("opacity", (op * prog(t, 0.5 + i * 0.14, 0.75 + i * 0.14)).toFixed(3));
    }
    // view content develops on the same clock
    setArt(views[0].art[0], prog(t, 0.55, 0.95, E.p2o));
    setArt(views[0].art[1], prog(t, 0.8, 1.05, E.p2o));
    setArt(views[0].art[2], prog(t, 1.0, 1.25, E.p2o));
    setNodes(views[1].nodes, t, 0.85, 10);
    setArt(views[1].art[0], prog(t, 1.0, 1.3, E.p2o));
    setNodes(views[2].nodes, t, 1.15, 9);
    setArt(views[2].art[0], prog(t, 1.3, 1.7, E.p2o));
    ghost.setAttribute("opacity", (prog(t, 1.2, 1.5) * (1 - prog(t, TRIGGER, TRIGGER + 0.2))).toFixed(3));
    // trigger keyed once: outcome system connects at zero
    setArt(views[3].art[0], prog(t, TRIGGER, TRIGGER + 0.3, E.p2o));
    setArt(views[3].art[1], prog(t, TRIGGER + 0.08, TRIGGER + 0.38, E.p2o));
    setNodes(views[3].nodes, t, TRIGGER, 9);
    hub.setAttribute("r", (12 * prog(t, TRIGGER + 0.1, TRIGGER + 0.35, E.back)).toFixed(2));
    var out = views[3];
    out.frame.setAttribute("stroke", fired ? "#005885" : "#A9C3CE");
    out.frame.setAttribute("stroke-width", fired ? 4 : 2);
    out.label.setAttribute("fill", fired ? "#005885" : "#3E5568");
    out.conn.setAttribute("stroke", fired ? "#005885" : "#9FBCC8");
    out.conn.setAttribute("stroke-dasharray", fired ? "none" : "6 6");
    out.conn.setAttribute("stroke-width", fired ? 4 : 2);
  }

  var state = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(state.t); } }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener("hf-seek", function (e) {
    var tt = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tl.time();
    render(tt);
  });
})();
</script>
