<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coloured Pencil Story — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #E1E5DA; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #E1E5DA; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #paper, #scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  .txt { position: absolute; margin: 0; font-family: Georgia, "Times New Roman", serif; color: #242831; white-space: nowrap; }
  .title { left: 70px; font-size: 42px; font-style: italic; line-height: 50px; }
  #t1 { top: 62px; }
  #t2 { top: 112px; }
  .label { left: 812px; font-size: 22px; line-height: 28px; padding: 0 6px; margin-left: -6px; background: rgba(225, 229, 218, 0.92); border-radius: 3px; }
  #l1 { top: 235px; }
  #l2 { top: 295px; }
  #l3 { top: 375px; }
  #cap { left: 70px; top: 632px; font-size: 17px; line-height: 24px; color: #3E4454; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <div id="stage">
    <canvas id="paper" width="1280" height="720"></canvas>
    <canvas id="scene" width="1280" height="720"></canvas>
    <p class="txt title" id="t1">An idea becomes</p>
    <p class="txt title" id="t2">a connected system</p>
    <p class="txt label" id="l1" data-reveal-after="leader-1">first spark</p>
    <p class="txt label" id="l2" data-reveal-after="leader-2">new link</p>
    <p class="txt label" id="l3" data-reveal-after="leader-3">the system inside</p>
    <p class="txt" id="cap">fig. 3 — outer layer peeled back to show the interior</p>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720, DURATION = 3;

  // ---------- palette (approved idea colours + scene paper) ----------
  var C = {
    paper: "#E1E5DA",      // cool sage drawing paper (scene-dependent background)
    paperWarm: "#F2ECDD",  // warm paper left visible on highlights / flap underside
    ink: "#242831",        // foreground graphite
    slate: "#3B4152",      // slate pencil
    ochre: "#D19A32",      // ochre pencil (bulb exterior)
    active: "#9F352D"      // active red (the connected system)
  };

  // ---------- seeded RNG ----------
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  // ---------- geometry ----------
  var BC = { x: 520, y: 310, r: 170 };
  var bulbPts = (function () {
    var pts = [], i, a;
    var a0 = -Math.PI / 2, a1 = Math.atan2(137, 100);
    for (i = 0; i <= 60; i++) { a = a0 + (a1 - a0) * i / 60; pts.push([BC.x + BC.r * Math.cos(a), BC.y + BC.r * Math.sin(a)]); }
    pts.push([600, 520]); pts.push([440, 520]); pts.push([420, 447]);
    var b0 = Math.atan2(137, -100), b1 = Math.PI * 1.5;
    for (i = 1; i <= 50; i++) { a = b0 + (b1 - b0) * i / 50; pts.push([BC.x + BC.r * Math.cos(a), BC.y + BC.r * Math.sin(a)]); }
    return pts;
  })();
  var bulbLen = [0];
  for (var bi = 1; bi < bulbPts.length; bi++) {
    bulbLen.push(bulbLen[bi - 1] + Math.hypot(bulbPts[bi][0] - bulbPts[bi - 1][0], bulbPts[bi][1] - bulbPts[bi - 1][1]));
  }
  function bulbPath(ctx) {
    ctx.moveTo(bulbPts[0][0], bulbPts[0][1]);
    for (var i = 1; i < bulbPts.length; i++) ctx.lineTo(bulbPts[i][0], bulbPts[i][1]);
    ctx.closePath();
  }
  var bulbP2D = new Path2D(); bulbPath(bulbP2D);

  // cutaway quad: hinge A-B is the left edge (aligned with the original outline)
  var CUT = [[520, 190], [700, 190], [700, 470], [560, 470]];
  function cutPath(ctx) { ctx.moveTo(CUT[0][0], CUT[0][1]); for (var i = 1; i < 4; i++) ctx.lineTo(CUT[i][0], CUT[i][1]); ctx.closePath(); }
  var HA = CUT[0], HB = CUT[3];
  var hl = Math.hypot(HB[0] - HA[0], HB[1] - HA[1]);
  var U = [(HB[0] - HA[0]) / hl, (HB[1] - HA[1]) / hl];
  var N = [U[1], -U[0]]; // points to the right of the hinge (into the cut)

  var NODES = [[580, 250], [650, 310], [590, 390], [616, 432]];
  var EDGES = [[0, 1], [1, 2], [0, 2], [2, 3]];
  var LEADER_Y = [250, 310, 390];

  // ---------- cached paper tooth (static) ----------
  var paperCv = document.getElementById("paper");
  (function () {
    var p = paperCv.getContext("2d");
    p.fillStyle = C.paper; p.fillRect(0, 0, W, H);
    var img = p.getImageData(0, 0, W, H), d = img.data, r = rng(7), i, n;
    for (i = 0; i < d.length; i += 4) {
      n = (r() - 0.5) * 16 + (r() < 0.04 ? -14 : 0);
      d[i] = Math.max(0, Math.min(255, d[i] + n + 2));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n - 3));
    }
    p.putImageData(img, 0, 0);
    // faint warm fibres
    var rf = rng(11);
    p.lineWidth = 0.6;
    for (i = 0; i < 900; i++) {
      var x = rf() * W, y = rf() * H, a = rf() * Math.PI, l = 3 + rf() * 9;
      p.strokeStyle = rf() < 0.5 ? "rgba(170,140,95,0.10)" : "rgba(255,252,240,0.22)";
      p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
    }
  })();

  // ---------- cached pencil grain (tooth that breaks strokes) ----------
  var grain = mk(W, H);
  (function () {
    var g = grain.getContext("2d"), img = g.createImageData(W, H), d = img.data, r = rng(23), i, v;
    for (i = 0; i < d.length; i += 4) {
      v = r(); v = v * v;
      d[i] = d[i + 1] = d[i + 2] = 0;
      d[i + 3] = Math.floor(v * 205);
    }
    g.putImageData(img, 0, 0);
  })();

  // ---------- hatch stroke guides (seeded, chord-clipped to the bulb) ----------
  var probe = mk(4, 4).getContext("2d");
  function buildHatch(angleDeg, spacing, seed, lineWidth) {
    var a = angleDeg * Math.PI / 180, dir = [Math.cos(a), Math.sin(a)], nor = [-dir[1], dir[0]];
    var cx = 520, cy = 330, R = 260, r = rng(seed), strokes = [];
    for (var off = -R; off <= R; off += spacing) {
      var o = off + (r() - 0.5) * spacing * 0.35;
      var ox = cx + nor[0] * o, oy = cy + nor[1] * o, first = null, last = null;
      for (var s = -R; s <= R; s += 3) {
        var x = ox + dir[0] * s, y = oy + dir[1] * s;
        if (probe.isPointInPath(bulbP2D, x, y)) { if (first === null) first = s; last = s; }
      }
      if (first === null) continue;
      first -= 4 + r() * 6; last += 4 + r() * 6;
      var pts = [], k, segs = 7, bend = (r() - 0.5) * 3.2;
      for (k = 0; k <= segs; k++) {
        var f = k / segs, ss = first + (last - first) * f, w = Math.sin(f * Math.PI) * bend + (r() - 0.5) * 0.9;
        pts.push([ox + dir[0] * ss + nor[0] * w, oy + dir[1] * ss + nor[1] * w]);
      }
      strokes.push({ pts: pts, w: lineWidth * (0.8 + r() * 0.4), alpha: 0.7 + r() * 0.3, jx: (r() - 0.5) * 1.4, jy: (r() - 0.5) * 1.4 });
    }
    return strokes;
  }
  var HATCH_A = buildHatch(35, 7, 101, 2.4);    // ochre local hue
  var HATCH_B = buildHatch(-48, 9, 202, 1.3);   // slate crossing hue (form shadow)
  var HATCH_CAP = (function () {
    var r = rng(303), s = [];
    for (var x = 440; x < 610; x += 9) {
      s.push({ pts: [[x + (r() - 0.5), 590], [x + 30 + (r() - 0.5), 520]], w: 1.4, alpha: 0.85, jx: 0, jy: 0 });
    }
    return s;
  })();

  function polyPartial(ctx, pts, p) {
    var n = pts.length - 1, endF = p * n, i;
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i <= n; i++) {
      if (i <= endF) ctx.lineTo(pts[i][0], pts[i][1]);
      else {
        var f = endF - (i - 1);
        if (f > 0) ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
        break;
      }
    }
  }

  // draw strokes with a staggered build; progress 0..1
  function drawStrokes(ctx, strokes, color, progress, stagger) {
    if (progress <= 0) return;
    var n = strokes.length;
    ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (var i = 0; i < n; i++) {
      var st = (i / n) * stagger, p = clamp01((progress - st) / (1 - stagger));
      if (p <= 0) continue;
      var s = strokes[i];
      ctx.globalAlpha = s.alpha; ctx.lineWidth = s.w;
      ctx.beginPath(); polyPartial(ctx, s.pts, p); ctx.stroke();
      // lighter second pass offset: pencil layering
      ctx.globalAlpha = s.alpha * 0.45; ctx.lineWidth = s.w * 0.6;
      ctx.save(); ctx.translate(s.jx, s.jy); ctx.beginPath(); polyPartial(ctx, s.pts, p); ctx.stroke(); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // a temp layer gets pencil grain knocked out of it before compositing
  var layer = mk(W, H), lctx = layer.getContext("2d");
  function beginLayer() { lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = "source-over"; lctx.globalAlpha = 1; lctx.clearRect(0, 0, W, H); return lctx; }
  function endLayer(dst, alpha) {
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = "destination-out"; lctx.globalAlpha = 1;
    lctx.drawImage(grain, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    dst.globalAlpha = alpha == null ? 1 : alpha; dst.drawImage(layer, 0, 0); dst.globalAlpha = 1;
  }

  function hatchExterior(ctx, pa, pb) {
    var l = beginLayer();
    l.save(); l.beginPath(); bulbPath(l); l.clip();
    drawStrokes(l, HATCH_A, C.ochre, pa, 0.7);
    l.globalCompositeOperation = "source-over";
    drawStrokes(l, HATCH_B, C.slate, pb, 0.65);
    l.restore();
    endLayer(ctx, 1);
  }

  // cached fully built exterior (used for the lifting flap's outer face)
  var exteriorFull = mk(W, H);
  hatchExterior(exteriorFull.getContext("2d"), 1, 1);

  // cached interior (warm paper + faint red crossing hatch)
  var interiorCv = mk(W, H);
  (function () {
    var ic = interiorCv.getContext("2d");
    ic.save(); ic.beginPath(); bulbPath(ic); ic.clip(); ic.beginPath(); cutPath(ic); ic.clip();
    ic.fillStyle = C.paperWarm; ic.fillRect(0, 0, W, H);
    ic.restore();
    var l = beginLayer();
    l.save(); l.beginPath(); bulbPath(l); l.clip();
    l.beginPath(); l.moveTo(560, 470); l.lineTo(700, 470); l.lineTo(700, 190); l.closePath(); l.clip();
    var r = rng(404); l.strokeStyle = C.active; l.lineWidth = 1.3;
    for (var o = -300; o < 300; o += 6) {
      var a = 70 * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), x = 630 + -dy * o, y = 330 + dx * o;
      l.globalAlpha = 0.22 + r() * 0.1;
      l.beginPath(); l.moveTo(x - dx * 260, y - dy * 260); l.lineTo(x + dx * 260, y + dy * 260); l.stroke();
    }
    l.restore();
    endLayer(ic, 1);
  })();

  // ---------- pencil line helpers ----------
  function pencilBulbOutline(ctx, p) {
    if (p <= 0) return;
    var total = bulbLen[bulbLen.length - 1], target = total * p;
    var l = beginLayer();
    l.strokeStyle = C.ink; l.lineCap = "round"; l.lineJoin = "round";
    for (var pass = 0; pass < 2; pass++) {
      var off = pass ? 0.9 : 0;
      l.lineWidth = pass ? 1.6 : 2.8; l.globalAlpha = pass ? 0.6 : 0.95;
      l.beginPath(); l.moveTo(bulbPts[0][0] + off, bulbPts[0][1]);
      for (var i = 1; i < bulbPts.length; i++) {
        if (bulbLen[i] <= target) l.lineTo(bulbPts[i][0] + off, bulbPts[i][1] - off * 0.5);
        else {
          var f = (target - bulbLen[i - 1]) / (bulbLen[i] - bulbLen[i - 1]);
          l.lineTo(bulbPts[i - 1][0] + (bulbPts[i][0] - bulbPts[i - 1][0]) * f + off, bulbPts[i - 1][1] + (bulbPts[i][1] - bulbPts[i - 1][1]) * f - off * 0.5);
          break;
        }
      }
      if (p >= 1) l.closePath();
      l.stroke();
    }
    endLayer(ctx, 1);
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function drawCap(ctx, p) {
    if (p <= 0) return;
    var l = beginLayer();
    l.save(); l.beginPath(); roundRectPath(l, 450, 528, 140, 56, 8); l.clip();
    drawStrokes(l, HATCH_CAP, C.slate, p, 0.6);
    l.restore();
    l.globalAlpha = clamp01(p * 1.6); l.strokeStyle = C.ink; l.lineWidth = 3;
    l.beginPath(); roundRectPath(l, 450, 528, 140, 56, 8); l.stroke(); l.globalAlpha = 1;
    endLayer(ctx, 1);
  }

  // fold transform: compress/mirror distances perpendicular to the hinge by c = cos(theta)
  function foldMatrix(c) {
    var k = c - 1;
    var a = 1 + k * N[0] * N[0], b = k * N[0] * N[1], d = 1 + k * N[1] * N[1];
    // x' = A + M (x - A)
    var e = HA[0] - (a * HA[0] + b * HA[1]);
    var f = HA[1] - (b * HA[0] + d * HA[1]);
    return [a, b, b, d, e, f];
  }

  function drawFlap(ctx, theta) {
    var c = Math.cos(theta), s = Math.sin(theta);
    if (Math.abs(c) < 0.03) {
      // edge-on: just the paper edge along the hinge
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(HA[0], HA[1]); ctx.lineTo(HB[0], HB[1]); ctx.stroke();
      return;
    }
    var m = foldMatrix(c);
    // cast shadow of the lifted flap onto the interior
    ctx.save();
    ctx.beginPath(); bulbPath(ctx); ctx.clip(); ctx.beginPath(); cutPath(ctx); ctx.clip();
    var sg = ctx.createLinearGradient(HA[0], HA[1], HA[0] + N[0] * 90, HA[1] + N[1] * 90);
    sg.addColorStop(0, "rgba(36,40,49," + (0.28 * s).toFixed(3) + ")");
    sg.addColorStop(1, "rgba(36,40,49,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
    ctx.beginPath(); bulbPath(ctx); ctx.clip();
    ctx.beginPath(); cutPath(ctx); ctx.clip();
    if (c > 0) {
      // outer (hatched) face, foreshortened and darkened as it turns
      ctx.drawImage(paperCv, 0, 0);
      ctx.drawImage(exteriorFull, 0, 0);
      ctx.fillStyle = "rgba(36,40,49," + (0.35 * (1 - c)).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    } else {
      // underside: warm unhatched paper with a light slate hatch, lit as it lands
      ctx.fillStyle = C.paperWarm; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = C.slate; ctx.lineWidth = 1; ctx.globalAlpha = 0.28;
      ctx.beginPath();
      for (var o = -400; o < 400; o += 9) { ctx.moveTo(300 + o, 600); ctx.lineTo(560 + o, 100); }
      ctx.stroke(); ctx.globalAlpha = 1;
      ctx.globalAlpha = 0.22; ctx.drawImage(grain, 0, 0); ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(36,40,49," + (0.22 * (1 + c) * 0.8).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    // crisp edge of the flap, constant line width
    ctx.beginPath(); ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]); cutPath(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.strokeStyle = C.slate; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]); bulbPath(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.restore();
  }

  function drawNetwork(ctx, S) {
    var l = beginLayer();
    l.save(); l.beginPath(); bulbPath(l); l.clip();
    l.strokeStyle = C.active; l.lineCap = "round";
    for (var i = 0; i < EDGES.length; i++) {
      var p = S["e" + i]; if (p <= 0) continue;
      var a = NODES[EDGES[i][0]], b = NODES[EDGES[i][1]];
      for (var pass = 0; pass < 2; pass++) {
        var o = pass ? 0.8 : 0;
        l.lineWidth = pass ? 1.6 : 3.2; l.globalAlpha = pass ? 0.55 : 1;
        l.beginPath(); l.moveTo(a[0] + o, a[1] - o); l.lineTo(a[0] + (b[0] - a[0]) * p + o, a[1] + (b[1] - a[1]) * p - o); l.stroke();
      }
    }
    l.globalAlpha = 1; l.fillStyle = C.active;
    for (var j = 0; j < NODES.length; j++) {
      var sc = S["n" + j]; if (sc <= 0) continue;
      l.beginPath(); l.arc(NODES[j][0], NODES[j][1], 9.5 * sc, 0, Math.PI * 2); l.fill();
    }
    l.restore();
    endLayer(ctx, 1);
    // leaders: drawn from the cutaway nodes out to the labels
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.lineCap = "round";
    for (var k = 0; k < 3; k++) {
      var lp = S["ld" + k]; if (lp <= 0) continue;
      var x0 = NODES[k][0] + 10, y = LEADER_Y[k];
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + (800 - x0) * lp, y); ctx.stroke();
    }
  }

  // ---------- render from timeline state ----------
  var scene = document.getElementById("scene").getContext("2d");
  var S = {
    hatchA: 0, hatchB: 0, outline: 0, cap: 0, peel: 0,
    e0: 0, e1: 0, e2: 0, e3: 0, n0: 0, n1: 0, n2: 0, n3: 0, ld0: 0, ld1: 0, ld2: 0
  };
  var PEEL_MAX = Math.PI * 0.9;

  function render() {
    var ctx = scene;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);
    var theta = S.peel * PEEL_MAX;
    if (S.peel > 0) {
      // exterior with the cutaway lifted out
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, H); cutPath(ctx); ctx.clip("evenodd");
      hatchExterior(ctx, S.hatchA, S.hatchB);
      ctx.restore();
      ctx.drawImage(interiorCv, 0, 0);
      drawNetwork(ctx, S);
      // clean section boundary along the cut (exterior side)
      ctx.save(); ctx.beginPath(); bulbPath(ctx); ctx.clip();
      ctx.globalAlpha = clamp01(S.peel * 3); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
      ctx.beginPath(); cutPath(ctx); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
      pencilBulbOutline(ctx, S.outline);
      drawCap(ctx, S.cap);
      drawFlap(ctx, theta);
    } else {
      hatchExterior(ctx, S.hatchA, S.hatchB);
      pencilBulbOutline(ctx, S.outline);
      drawCap(ctx, S.cap);
    }
  }

  // ---------- one seekable GSAP timeline ----------
  var motion = gsap.timeline({ paused: true });
  // Act 1 — broad hatching before details; exterior reads by 0.95s
  motion.to(S, { hatchA: 1, duration: 0.62, ease: "power1.inOut" }, 0.04);
  motion.to(S, { hatchB: 1, duration: 0.55, ease: "power1.inOut" }, 0.3);
  motion.to(S, { outline: 1, duration: 0.5, ease: "power2.inOut" }, 0.1);
  motion.to(S, { cap: 1, duration: 0.3, ease: "power1.out" }, 0.58);
  // Act 2 — peel back the outer layer along the original outline (hinge)
  motion.to(S, { peel: 1, duration: 0.62, ease: "power2.inOut" }, 1.0);
  // Act 3 — the system inside: nodes, links, leaders
  motion.to(S, { n0: 1, duration: 0.22, ease: "back.out(2)" }, 1.42);
  motion.to(S, { e0: 1, duration: 0.2, ease: "power1.inOut" }, 1.52);
  motion.to(S, { n1: 1, duration: 0.22, ease: "back.out(2)" }, 1.62);
  motion.to(S, { e1: 1, duration: 0.2, ease: "power1.inOut" }, 1.7);
  motion.to(S, { e2: 1, duration: 0.24, ease: "power1.inOut" }, 1.72);
  motion.to(S, { n2: 1, duration: 0.22, ease: "back.out(2)" }, 1.84);
  motion.to(S, { e3: 1, duration: 0.16, ease: "power1.inOut" }, 1.92);
  motion.to(S, { n3: 1, duration: 0.2, ease: "back.out(2)" }, 2.0);
