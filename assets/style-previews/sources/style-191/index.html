<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut-Paper Spy Titles — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0E1B29; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; }
  #root svg { display: block; width: 100%; height: 100%; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- hard offset paper shadow (no blur) -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#050B12" flood-opacity="0.6"/>
    </filter>
    <clipPath id="clipCircle"><circle cx="360" cy="330" r="220"/></clipPath>
    <!-- the two sides of the graphic cut (line from 40,640 to 700,20, extended) -->
    <clipPath id="clipUpper"><polygon points="-60,733.9 760,-36.4 -60,-36.4"/></clipPath>
    <clipPath id="clipLower"><polygon points="-60,733.9 760,-36.4 760,733.9"/></clipPath>
    <clipPath id="clipSub"><rect id="subWipe" x="650" y="270" width="0" height="70"/></clipPath>
    <clipPath id="clipFile"><rect id="fileWipe" x="650" y="570" width="0" height="44"/></clipPath>
  </defs>

  <!-- stationary background -->
  <rect width="1280" height="720" fill="#0E1B29"/>
  <polygon points="0,560 1280,470 1280,720 0,720" fill="#13283B"/>

  <!-- THE IDEA: cut-paper bulb -->
  <g id="bulb">
    <g filter="url(#shadow)">
      <circle cx="360" cy="330" r="220" fill="#B9D5DE"/>
      <rect x="290" y="548" width="140" height="26" fill="#B9D5DE"/>
      <rect x="306" y="584" width="108" height="22" fill="#B9D5DE"/>
    </g>

    <!-- hidden silhouette layer: the network inside the opening shape -->
    <g id="hiddenNet" clip-path="url(#clipCircle)">
      <g stroke="#0E1B29" stroke-width="10" fill="none" stroke-linecap="round">
        <path d="M360 330L480 230M360 330L260 450M360 330L480 440M260 450L480 440M480 230L480 440M250 220L480 230"/>
      </g>
      <g fill="#0E1B29">
        <circle cx="480" cy="230" r="18"/><circle cx="260" cy="450" r="18"/><circle cx="480" cy="440" r="18"/>
      </g>
    </g>

    <!-- upper paper half (stays) -->
    <g clip-path="url(#clipUpper)">
      <circle cx="360" cy="330" r="220" fill="#EDF1F3"/>
    </g>

    <!-- connections that grow across the white half after the cut -->
    <g clip-path="url(#clipUpper)">
      <g clip-path="url(#clipCircle)" stroke="#0E1B29" stroke-width="10" fill="none" stroke-linecap="round">
        <path class="edge" d="M360 330L250 220" stroke-dasharray="160" stroke-dashoffset="160"/>
        <path class="edge" d="M480 230L250 220" stroke-dasharray="240" stroke-dashoffset="240"/>
        <path class="edge" d="M360 330L480 230" stroke-dasharray="160" stroke-dashoffset="160"/>
        <path class="edge" d="M360 330L260 450" stroke-dasharray="160" stroke-dashoffset="160"/>
      </g>
    </g>
    <circle id="nodeA" cx="250" cy="220" r="18" fill="#0E1B29"/>

    <!-- lower paper half: the piece that is cut away -->
    <g id="pieceB">
      <g clip-path="url(#clipLower)" filter="url(#shadow)">
        <circle cx="360" cy="330" r="220" fill="#EDF1F3"/>
      </g>
    </g>

    <circle id="core" cx="360" cy="330" r="34" fill="#D9482B"/>
  </g>

  <!-- the graphic cut -->
  <path id="slash" d="M700 20L40 640" stroke="#D9482B" stroke-width="6" fill="none"
        stroke-dasharray="910" stroke-dashoffset="910"/>

  <!-- TITLE -->
  <g font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900">
    <text x="650" y="250" font-size="128" fill="#EDF1F3" letter-spacing="-4"><tspan id="wAn" visibility="hidden">AN</tspan><tspan id="wIdea" visibility="hidden"> IDEA</tspan></text>
    <g clip-path="url(#clipSub)">
      <text x="656" y="318" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="40" fill="#B9D5DE">becomes a connected</text>
    </g>
    <g id="slab">
      <g transform="rotate(-4 900 420)" filter="url(#shadow)">
        <rect x="640" y="350" width="560" height="150" fill="#D9482B"/>
        <text x="664" y="465" font-size="122" fill="#0E1B29" letter-spacing="-3">SYSTEM</text>
      </g>
    </g>
  </g>
  <g clip-path="url(#clipFile)">
    <text x="660" y="600" font-family="'Courier New',monospace" font-size="20" fill="#B9D5DE" letter-spacing="6">FILE 01 / THE NETWORK INSIDE</text>
  </g>
</svg>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { overwrite: false } });

  // 0.00 — paper idea drops onto the desk
  tl.fromTo('#bulb', { y: -36 }, { y: 0, duration: 0.25, ease: 'power2.out' }, 0);
  // hard-cut title words
  tl.set('#wAn', { attr: { visibility: 'visible' } }, 0.17);
  tl.set('#wIdea', { attr: { visibility: 'visible' } }, 0.33);

  // 0.55 — the red slash is drawn across the opening shape
  tl.fromTo('#slash', { attr: { 'stroke-dashoffset': 910 } },
    { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power2.in' }, 0.55);

  // 0.90 — THE CUT: the lower paper half slides away along the slash, revealing the network
  tl.fromTo('#pieceB', { x: 0, y: 0, rotation: 0 },
    { x: -720, y: 676, rotation: -8, svgOrigin: '360 330', duration: 0.38, ease: 'power2.in' }, 0.9);

  // 1.18 — the idea's core lights up
  tl.fromTo('#core', { scale: 0 }, { scale: 1, svgOrigin: '360 330', duration: 0.22, ease: 'back.out(1.2)' }, 1.18);

  // 1.28 — connections spread across the remaining paper
  tl.fromTo('.edge', { attr: { 'stroke-dashoffset': function (i, el) { return el.getAttribute('stroke-dasharray'); } } },
    { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power2.inOut', stagger: 0.08 }, 1.28);
  tl.fromTo('#nodeA', { scale: 0 }, { scale: 1, svgOrigin: '250 220', duration: 0.2, ease: 'back.out(1.2)' }, 1.5);

  // 1.45 — subtitle wipe
  tl.fromTo('#subWipe', { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.28, ease: 'power2.out' }, 1.45);

  // 1.72 — SYSTEM slab slaps in
  tl.fromTo('#slab', { x: 720 }, { x: 0, duration: 0.3, ease: 'power2.out' }, 1.72);

  // 2.10 — case file line
  tl.fromTo('#fileWipe', { attr: { width: 0 } }, { attr: { width: 540 }, duration: 0.24, ease: 'steps(6)' }, 2.1);

  // hold to 3.0 (settled from 2.34)
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0);
})();
</script>

</html>
