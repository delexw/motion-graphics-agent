<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full-Screen Type Cuts — An idea becomes a system.</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0E1A26; overflow: hidden; }
  #root { width: 100%; height: 100%; position: relative; }
  #root svg { width: 100%; height: 100%; display: block; }
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sysWipe"><rect id="sysWipeRect" x="60" y="380" width="0" height="200"/></clipPath>
  </defs>
  <!-- stationary background -->
  <rect width="1280" height="720" fill="#0E1A26"/>
  <rect width="12" height="720" fill="#3BB0E6"/>

  <!-- CUT 1 : "An idea" -->
  <g id="cut1">
    <text x="96" y="120" font-size="18" letter-spacing="6" fill="#7F99B0">CUT 01 / 03</text>
    <text id="c1word" x="88" y="430" font-size="200" font-weight="300" letter-spacing="-4" fill="#FFFFFF">An idea</text>
  </g>

  <!-- CUT 2 : "becomes a" -->
  <g id="cut2">
    <text x="96" y="120" font-size="18" letter-spacing="6" fill="#7F99B0">CUT 02 / 03</text>
    <text id="c2word" x="88" y="420" font-size="150" font-weight="700" letter-spacing="-3" fill="#FFFFFF">becomes a</text>
  </g>

  <!-- CUT 3 : stable reading frame -->
  <g id="cut3">
    <text x="96" y="120" font-size="18" letter-spacing="6" fill="#7F99B0">CUT 03 / 03</text>
    <text x="92" y="250" font-size="92" font-weight="300" fill="#8EA6BA">An idea</text>
    <text x="92" y="360" font-size="92" font-weight="700" fill="#FFFFFF">becomes a</text>
    <g clip-path="url(#sysWipe)">
      <text id="sysWord" x="86" y="530" font-size="176" font-weight="900" letter-spacing="-6" fill="#3BB0E6">system.</text>
    </g>
    <g id="chip1"><rect x="96" y="600" width="200" height="64" fill="#17293B"/><text x="118" y="639" font-size="20" font-weight="700" letter-spacing="3" fill="#8EA6BA">AN IDEA</text></g>
    <g id="chip2"><rect x="312" y="600" width="200" height="64" fill="#17293B"/><text x="334" y="639" font-size="20" font-weight="700" letter-spacing="3" fill="#FFFFFF">BECOMES</text></g>
    <g id="chip3"><rect x="528" y="600" width="200" height="64" fill="#3BB0E6"/><text x="550" y="639" font-size="20" font-weight="700" letter-spacing="3" fill="#0E1A26">SYSTEM.</text></g>
    <text id="footer" x="1184" y="639" font-size="14" letter-spacing="4" fill="#7F99B0" text-anchor="end">ONE THOUGHT · THREE CUTS</text>
  </g>

  <!-- complementary image: idea -> connected system (one network, reframed per cut) -->
  <g id="net" transform="translate(1040 360) scale(1.6)">
    <g fill="none" stroke-linecap="round">
      <line class="rim" x1="-110" y1="-110" x2="120" y2="-100" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="rim" x1="120" y1="-100" x2="130" y2="110" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="rim" x1="130" y1="110" x2="-100" y2="130" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="rim" x1="-100" y1="130" x2="-110" y2="-110" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="spoke" x1="0" y1="0" x2="-110" y2="-110" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="spoke" x1="0" y1="0" x2="120" y2="-100" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="spoke" x1="0" y1="0" x2="130" y2="110" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <line class="spoke" x1="0" y1="0" x2="-100" y2="130" pathLength="1" stroke="#E8EEF2" stroke-width="4" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <circle id="ring" r="52" stroke="#3BB0E6" stroke-width="4" stroke-dasharray="6 8" opacity="0"/>
      <circle id="halo" r="48" stroke="#3BB0E6" stroke-width="3" opacity="0"/>
    </g>
    <g id="n1" class="node"><circle r="18" fill="#3BB0E6" stroke="#0E1A26" stroke-width="6"/></g>
    <g id="n2" class="node"><circle r="18" fill="#3BB0E6" stroke="#0E1A26" stroke-width="6"/></g>
    <g id="n3" class="node"><circle r="18" fill="#3BB0E6" stroke="#0E1A26" stroke-width="6"/></g>
    <g id="n4" class="node"><circle r="18" fill="#3BB0E6" stroke="#0E1A26" stroke-width="6"/></g>
    <g id="hub"><circle r="30" fill="#FFFFFF"/><circle r="9" fill="#0E1A26"/></g>
  </g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var C1 = 0.7, C2 = 1.4; // explicit hard cut times (seconds)
  var nodes = [
    { id: "#n1", x: -110, y: -110 },
    { id: "#n2", x: 120, y: -100 },
    { id: "#n3", x: 130, y: 110 },
    { id: "#n4", x: -100, y: 130 }
  ];
  var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
  function cutSet(target, from, to, at) {
    tl.fromTo(target, from, Object.assign({ duration: 0 }, to), at);
  }

  // Initial (t=0) states, owned by gsap.set; every later change is in tl.
  gsap.set(["#cut2", "#cut3"], { autoAlpha: 0 });
  gsap.set("#cut1", { autoAlpha: 1 });
  gsap.set("#c1word", { y: 40, opacity: 0 });
  gsap.set("#hub", { scale: 0, svgOrigin: "0 0" });
  gsap.set("#halo", { scale: 0.6, opacity: 0, svgOrigin: "0 0" });
  gsap.set(".node", { x: 0, y: 0, opacity: 0 });
  gsap.set(["#chip1", "#chip2", "#chip3"], { y: 24, opacity: 0 });
  gsap.set("#footer", { opacity: 0 });

  // CUT 1 (0 - 0.7): "An idea" + a single idea dot
  tl.fromTo("#c1word", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 0.0);
  tl.fromTo("#hub", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.8)", svgOrigin: "0 0" }, 0.04);
  tl.fromTo("#halo", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 0.3, ease: "power2.out", svgOrigin: "0 0" }, 0.12);

  // CUT 2 at 0.7: hard cut, new type frame + reframed image
  cutSet("#cut1", { autoAlpha: 1 }, { autoAlpha: 0 }, C1);
  cutSet("#cut2", { autoAlpha: 0 }, { autoAlpha: 1 }, C1);
  cutSet("#net", { attr: { transform: "translate(1040 360) scale(1.6)" } }, { attr: { transform: "translate(1085 370) scale(1.1)" } }, C1);
  cutSet("#halo", { opacity: 0.9 }, { opacity: 0 }, C1);
  // the idea splits into connected nodes: spokes draw with the nodes
  nodes.forEach(function (n, i) {
    var at = C1 + 0.04 + i * 0.05;
    tl.fromTo(n.id, { x: 0, y: 0, opacity: 0 }, { x: n.x, y: n.y, opacity: 1, duration: 0.34, ease: "power3.out" }, at);
    tl.fromTo(document.querySelectorAll(".spoke")[i], { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.34, ease: "power3.out" }, at);
  });

  // CUT 3 at 1.4: stable reading frame
  cutSet("#cut2", { autoAlpha: 1 }, { autoAlpha: 0 }, C2);
  cutSet("#cut3", { autoAlpha: 0 }, { autoAlpha: 1 }, C2);
  cutSet("#net", { attr: { transform: "translate(1085 370) scale(1.1)" } }, { attr: { transform: "translate(1040 340) scale(1)" } }, C2);
  tl.fromTo("#sysWipeRect", { attr: { width: 0 } }, { attr: { width: 700 }, duration: 0.36, ease: "power3.inOut" }, C2 + 0.04);
  tl.fromTo(".rim", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.inOut", stagger: 0.06 }, C2 + 0.12);
  tl.fromTo("#ring", { opacity: 0, rotation: -40, svgOrigin: "0 0" }, { opacity: 1, rotation: 0, svgOrigin: "0 0", duration: 0.35, ease: "power2.out" }, C2 + 0.3);
  tl.fromTo(["#chip1", "#chip2", "#chip3"], { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out", stagger: 0.08 }, C2 + 0.42);
  tl.fromTo("#footer", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "sine.inOut" }, C2 + 0.6);
  // settled by ~2.25s; hold to 3.0s
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0, false);
})();
</script>

</html>
