<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII Phosphor Terminal — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #04070A; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; }
  #stage { display: block; width: 100%; height: 100%; }
</style>
<script src="./gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720" aria-label="An idea becomes a connected system"></canvas>
</div>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720, DURATION = 3;
  // ---- palette (approved roles) ----
  var GLASS_CENTER = "#132131", GLASS_EDGE = "#070B10";
  var PHOSPHOR = "#76E1CB";      // single phosphor colour (active)
  var FOREGROUND = "#F5F4E8";    // copy + fresh-cell flash
  var SECONDARY = "#294359";     // rules, idle legend
  var DIM = "#7F9DB2";           // small labels
  var BEZEL = "#1C232C";

  // ---- one fixed-width grid for every mark ----
  var X0 = 120, Y0 = 92, CW = 14, CH = 26, COLS = 74, ROWS = 21;
  var FONT = "22px Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace";
  var TITLE_FONT = "bold 34px Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace";
  var RAMP = " .:-=+*#%@"; // glyph-coverage density ramp (10 levels)

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var glyphLayer = document.createElement("canvas");
  glyphLayer.width = W; glyphLayer.height = H;
  var gctx = glyphLayer.getContext("2d");

  function cx(col) { return X0 + col * CW; }
  function cy(row) { return Y0 + row * CH; }

  // ---- static monitor texture (cached once) ----
  var bg = document.createElement("canvas");
  bg.width = W; bg.height = H;
  (function buildBackground() {
    var b = bg.getContext("2d");
    b.fillStyle = "#04070A"; b.fillRect(0, 0, W, H);
    // bezel

    var bz = b.createLinearGradient(0, 30, 0, 690);
    bz.addColorStop(0, "rgba(255,255,255,0.06)"); bz.addColorStop(0.5, "rgba(255,255,255,0)"); bz.addColorStop(1, "rgba(0,0,0,0.25)");

    g.addColorStop(0, GLASS_CENTER); g.addColorStop(1, GLASS_EDGE);

    b.lineWidth = 28; b.strokeStyle = "rgba(0,0,0,0.35)"; b.shadowColor = "rgba(0,0,0,0.8)"; b.shadowBlur = 30;

  // ---- bulb (the idea): brightness field quantised to the ramp ----
  var BULB_COL = 1, BULB_ROW = 3, BULB_W = 24;
  var bulbCells = []; // {col,row,level,band}
  (function buildBulb() {
    var ccx = 12 * CW, ccy = 5.2 * CH, R = 148;
    for (var r = 0; r < 11; r++) {
      for (var c = 0; c < BULB_W; c++) {
        var px = (c + 0.5) * CW, py = (r + 0.5) * CH;
        var d = Math.hypot(px - ccx, py - ccy);
        if (d > R) continue;
        var body = Math.pow(1 - d / R, 0.55);
        var hl = Math.exp(-(Math.pow(px - (ccx - 48), 2) + Math.pow(py - (ccy - 46), 2)) / (2 * 42 * 42));
        var b = Math.min(1, body * 0.78 + hl * 0.45);
        var lvl = Math.max(1, Math.round(b * 9));
        bulbCells.push({ col: BULB_COL + c, row: BULB_ROW + r, level: lvl });
      }
    }
    // neck + base, still as density glyphs (fixed final characters)
    var base = [
      [11, "     +########+     "],
      [12, "     [========]     "],
      [13, "      '------'      "]
    ];
    base.forEach(function (ln) {
      for (var i = 0; i < ln[1].length; i++) {
        var ch = ln[1][i]; if (ch === " ") continue;
        bulbCells.push({ col: BULB_COL + 2 + i, row: BULB_ROW + ln[0], glyph: ch, level: 9 });
      }
    });

    bulbCells.forEach(function (cell) {
      var localRow = cell.row - BULB_ROW;      // 0..14
      cell.band = Math.floor((13 - localRow) / 2); // 0 (base) .. 6 (top)
    });
  })();
  var BULB_START = 0.22, BAND_GAP = 0.095, STEP = 0.034;
  function bulbLevelAt(cell, t) {
    var s = BULB_START + cell.band * BAND_GAP;
    if (t < s) return { k: 0, since: 0 };
    var k = Math.min(cell.level, Math.floor((t - s) / STEP) + 1);
    var changeAt = s + (k - 1) * STEP;
    return { k: k, since: t - changeAt };
  }
  function bulbGlyph(cell, k) {
    if (k <= 0) return " ";
    if (cell.glyph && k >= cell.level) return cell.glyph;
    return RAMP[cell.glyph ? Math.min(k, 8) : k];
  }

  var net = []; for (var i0 = 0; i0 < NH; i0++) net.push(new Array(NW).fill(" "));
  function put(c, r, s) { for (var i = 0; i < s.length; i++) net[r][c + i] = s[i]; }

    var r, c;
    for (c = 3; c < 24; c++) { net[0][c] = "-"; net[12][c] = "-"; }

    put(0, 0, "(o)"); put(24, 0, "(o)"); put(0, 12, "(o)"); put(24, 12, "(o)");

  // BFS from the entry node (left middle) -> reveal order grows along the links
  var netCells = [];
  (function orderNet() {
    var depth = []; for (var r = 0; r < NH; r++) depth.push(new Array(NW).fill(-1));
    var q = [[0, 6], [1, 6], [2, 6]]; q.forEach(function (p) { depth[p[1]][p[0]] = 0; });
    var head = 0, maxD = 0;
    while (head < q.length) {
      var p = q[head++], d = depth[p[1]][p[0]];
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var x = p[0] + dx, y = p[1] + dy;
        if (x < 0 || y < 0 || x >= NW || y >= NH) continue;
        if (net[y][x] === " " || depth[y][x] >= 0) continue;
        depth[y][x] = d + 1; maxD = Math.max(maxD, d + 1); q.push([x, y]);
      }

    for (var y = 0; y < NH; y++) for (var x = 0; x < NW; x++) {

      netCells.push({ col: NET_COL + x, row: NET_ROW + y, glyph: net[y][x], depth: Math.max(0, depth[y][x]), maxD: maxD });
    }
  })();
  var NET_START = 1.42, NET_SPAN = 0.78, NET_STEP = 0.04;
  var NET_STAGES = [".", ":", "+"]; // density bands before the final link glyph
  function netStateAt(cell, t) {
    var s = NET_START + (cell.depth / cell.maxD) * NET_SPAN;
    if (t < s) return { k: 0, since: 0 };
    var k = Math.min(4, Math.floor((t - s) / NET_STEP) + 1);
    return { k: k, since: t - (s + (k - 1) * NET_STEP) };
  }
  function netGlyph(cell, k) { return k <= 0 ? " " : (k >= 4 ? cell.glyph : NET_STAGES[k - 1]); }

  // ---- copy ----
  var PROMPT = "idea@term:~$ ./connect --all";
  var OK = "  [ok]";
  var TITLE = "AN IDEA BECOMES A CONNECTED SYSTEM";
  var LEGEND = [".", ":", "+", "#", "@"];

  // ---- drawing helpers (integer cell coordinates) ----
  function drawCell(c, ch, col, row, color, alpha) {

    c.globalAlpha = alpha; c.fillStyle = color;
    c.fillText(ch, cx(col) + 7, cy(row) + 13);
  }

  function render(t) {
    t = Math.max(0, Math.min(DURATION, t));
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.clearRect(0, 0, W, H);
    gctx.font = FONT; gctx.textAlign = "center"; gctx.textBaseline = "middle";

    // prompt line (typed, row 0)
    var pn = Math.max(0, Math.min(PROMPT.length, Math.floor((t - 0.02) / 0.009)));
    for (var i = 0; i < pn; i++) drawCell(gctx, PROMPT[i], i, 0, FOREGROUND, 1);
    if (t >= 2.3) {
      var okn = Math.min(OK.length, Math.floor((t - 2.3) / 0.02) + 1);
      for (i = 0; i < okn; i++) drawCell(gctx, OK[i], PROMPT.length + i, 0, PHOSPHOR, 1);
    }
    // rule (row 1), registered sweep
    var rn = Math.min(COLS, Math.floor(t / 0.004));
    for (i = 0; i < rn; i++) drawCell(gctx, "-", i, 1, SECONDARY, 1);

    // bulb: density bands replace cells; previous glyph persists and decays
    var maxBand = 0;

    for (i = 0; i < LEGEND.length; i++) {

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.filter = "none";
    ctx.drawImage(bg, 0, 0);
    ctx.save();
    rr(ctx, 92, 66, 1096, 588, 26); ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    ctx.filter = "blur(7px)"; ctx.globalAlpha = 0.6; ctx.drawImage(glyphLayer, 0, 0);
    ctx.filter = "blur(2px)"; ctx.globalAlpha = 0.35; ctx.drawImage(glyphLayer, 0, 0);

    ctx.drawImage(glyphLayer, 0, 0);

    // title on its solid panel: 2-cell pitch on the same grid, sharp, no bloom over letters
    ctx.font = TITLE_FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var TT0 = 0.3, TSTEP = 0.02;
    var tn = t < TT0 ? 0 : Math.min(TITLE.length, Math.floor((t - TT0) / TSTEP) + 1);
    ctx.fillStyle = FOREGROUND;
    for (i = 0; i < tn; i++) {
      if (TITLE[i] !== " ") ctx.fillText(TITLE[i], cx(2 + i * 2) + CW, cy(19));
    }
    if (t >= TT0) {
      var curCol = 2 + tn * 2;
      ctx.fillStyle = PHOSPHOR;
      ctx.fillRect(cx(curCol) + 4, cy(18) + 12, CW + 6, 30);
    }
  }

  // ---- one paused GSAP timeline owns time ----
  // The tweened property's setter redraws, so every seek (even with suppressed events) repaints.
  var _t = 0;
  var state = {};
  Object.defineProperty(state, "t", { get: function () { return _t; }, set: function (v) { _t = v; render(v); } });

  window.addEventListener("hf-seek", function (e) {
    var tt = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tl.time();

})();
</script>
