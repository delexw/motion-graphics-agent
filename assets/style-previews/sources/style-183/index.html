<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printed Long Take — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #15120F; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; background: #15120F; overflow: hidden; }
  #plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #caption {
    position: absolute; left: 5%; top: 84.5%; margin: 0;
    font-family: Georgia, "Times New Roman", serif; font-weight: normal;
    font-size: 36px; line-height: 1.1; color: #EADBC0; background: #15120F;
    padding: 2px 6px 4px 0; white-space: nowrap; opacity: 0;
  }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="plate" width="1280" height="720"></canvas>
  <h1 id="caption">An idea becomes a connected system</h1>
</div>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720;
  // One print coordinate system: plate is 1440 x 480 world units, viewed through a fixed 1160 x 480 window.
  // The pan is kept to ~280 px (under ~5 px per frame) so the registered texture stays coherent between frames.
  var PW = 1440, PH = 480, WX = 60, WY = 80, VW = 1160, VH = 480;
  var CAM_MAX = PW - VW;              // 280
  var INK = "#15120F", PLATE = "#1F1A15", MARK = "#3F362C", LIGHT = "#EADBC0", ACTIVE = "#C0463A", LABEL = "#A8957A";

  var canvas = document.getElementById("plate");
  var ctx = canvas.getContext("2d");

  // ---------- seeded helpers ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

    return clamp(v, 0, 1);
  }

  // ---------- static engraving texture (cached once) ----------
  var tex = document.createElement("canvas"); tex.width = PW; tex.height = PH;
  (function buildTexture() {
    var tg = tex.getContext("2d");
    tg.fillStyle = PLATE; tg.fillRect(0, 0, PW, PH);
    var marks = document.createElement("canvas"); marks.width = PW; marks.height = PH;
    var g = marks.getContext("2d");
    var rnd = mulberry32(183);
    // zone weights: I seed dots, II parallel lines, III crosshatch mesh
    function wDots(x) { return 1 - smooth(410, 530, x); }
    function wLines(x) { return smooth(410, 530, x); }
    function wCross(x) { return smooth(900, 1020, x); }
    // line spacing narrows continuously: ~20 -> 16 -> 14 -> 11 (kept coarse enough to survive video encoding)
    function sp(x) { return x < 470 ? 20 : x < 960 ? 20 - 6 * smooth(470, 960, x) : 14 - 3 * smooth(960, 1440, x); }
    // phase table phi(x) = integral dx / sp(x), over extended range for slanted lines
    var X0 = -1200, X1 = 3600, phi = [], acc = 0;
    for (var x = X0; x <= X1; x++) { phi.push(acc); acc += 1 / sp(x); }
    function invPhi(n) { // smallest x with phi >= n
      var lo = 0, hi = phi.length - 1; while (lo < hi) { var m = (lo + hi) >> 1; if (phi[m] < n) lo = m + 1; else hi = m; } return X0 + lo;
    }
    g.lineCap = "round";
    function family(slope, weightFn) {
      var nMax = Math.floor(acc);
      for (var n = 1; n < nMax; n++) {
        var xb = invPhi(n);
        for (var y = 0; y < PH; y += 6) {
          var xa = xb + slope * y, xc = xb + slope * (y + 6);
          var xm = (xa + xc) / 2;
          if (xm < -10 || xm > PW + 10) continue;
          var w = weightFn(xm);
          if (w < 0.02) continue;
          var tn = tone(xm, y);
          g.globalAlpha = 0.75 + 0.25 * w;
          g.strokeStyle = MARK;
          g.lineWidth = (1.0 + 1.0 * tn) * (0.6 + 0.4 * w);
          g.beginPath(); g.moveTo(xa, y); g.lineTo(xc, y + 6); g.stroke();
        }
      }
    }
    var T = 1 / Math.tan(35 * Math.PI / 180);
    family(-T, wLines);
    family(T, wCross);
    // seed stipple, 28 pt grid with tonal radius
    g.fillStyle = MARK;
    for (var gx = 14; gx < 620; gx += 28) {
      for (var gy = 14; gy < PH; gy += 28) {
        var w = wDots(gx); if (w < 0.03) continue;
        var jx = gx + (rnd() - 0.5) * 2.2, jy = gy + (rnd() - 0.5) * 2.2;
        g.globalAlpha = 0.75 + 0.25 * w;
        g.beginPath(); g.arc(jx, jy, (1.4 + 1.2 * tone(gx, gy)) * w, 0, Math.PI * 2); g.fill();
      }
    }
    g.globalAlpha = 1;
    // soften the burin marks once (static, cached) so the panning texture stays coherent after encoding
    tg.filter = "blur(1px)"; tg.drawImage(marks, 0, 0); tg.filter = "none";
  })();

  // ---------- trace geometry (world units) ----------
  var segs = [
    [[120, 320], [260, 320], [380, 190], [520, 190]],
    [[520, 190], [700, 190], [820, 330], [980, 330]],
    [[980, 330], [1140, 330], [1260, 200], [1420, 200]],
    [[1420, 200], [1580, 200], [1680, 300], [1800, 300]],
    [[1800, 300], [1940, 300], [2040, 220], [2150, 220]]

  // compress the long trace into the shorter plate while keeping its shape family
  segs = segs.map(function (s) { return s.map(function (q) { return [120 + (q[0] - 120) * 0.532, q[1]]; }); });
  var pts = [];
  segs.forEach(function (s, i) {
    for (var k = (i ? 1 : 0); k <= 60; k++) {
      var t = k / 60, u = 1 - t;
      pts.push([
        u*u*u*s[0][0] + 3*u*u*t*s[1][0] + 3*u*t*t*s[2][0] + t*t*t*s[3][0],
        u*u*u*s[0][1] + 3*u*u*t*s[1][1] + 3*u*t*t*s[2][1] + t*t*t*s[3][1]
      ]);
    }
  });
  var START = [120, 320], HUB = [1200, 220];
  var landmarks = [[333, 190], [578, 330], [812, 200], [1014, 300]];
  var nodes = { A: [1340, 110], B: [1385, 268], C: [1285, 392], D: [1085, 398] };
  var links = [ // [from, to, start, end] within network progress 0..1
    [HUB, nodes.A, 0.00, 0.45], [HUB, nodes.B, 0.08, 0.52], [HUB, nodes.C, 0.16, 0.60],
    [HUB, nodes.D, 0.24, 0.68], [nodes.A, nodes.B, 0.45, 0.85], [nodes.B, nodes.C, 0.52, 0.92], [nodes.C, nodes.D, 0.60, 1.00]
  ];

  // ---------- camera: steady rate, slowing where hatch spacing changes ----------
  var CAM_END = 2.3, NET_START = 2.12, NET_END = 2.62;

    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function render(time) {
    var t = clamp(time, 0, 3);
    var cam = camAt(t);
    var c = cam / CAM_MAX;
    var head = 120 + (HUB[0] - 120) * Math.pow(c, 0.8);
    var net = easeNet(clamp((t - NET_START) / (NET_END - NET_START), 0, 1));

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);

    // registered plate through the moving viewport
    ctx.save();
    ctx.beginPath(); ctx.rect(WX, WY, VW, VH); ctx.clip();
    ctx.translate(WX - cam, WY);
    ctx.drawImage(tex, 0, 0);
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    // carved trace up to the burin head
    groove(function () {
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) {
        var p = pts[i];
        if (p[0] <= head) { ctx.lineTo(p[0], p[1]); continue; }

      }
    }, 3);

    // network links grow from the hub
    links.forEach(function (L) {
      var k = clamp((net - L[2]) / (L[3] - L[2]), 0, 1); if (k <= 0) return;
      var a = L[0], b = L[1];
      groove(function () { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k); }, 3);
    });

    // start node
    ring(START, 13, PLATE, 1);
    ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.arc(START[0], START[1], 4, 0, Math.PI * 2); ctx.fill();
    // landmarks pop as the trace passes
    landmarks.forEach(function (p) { ring(p, 8, PLATE, easePop(clamp((head - p[0]) / 90, 0, 1))); });
    // network nodes pop when their first link arrives
    [[nodes.A, 0.45], [nodes.B, 0.52], [nodes.C, 0.60], [nodes.D, 0.68]].forEach(function (n) {

      gr.addColorStop(0, "rgba(234,219,192," + (0.9 * tipA) + ")"); gr.addColorStop(1, "rgba(234,219,192,0)");

    }
    ctx.restore();

    // plate edge (fixed window frame)
    ctx.strokeStyle = "#3A3128"; ctx.lineWidth = 2; ctx.strokeRect(WX, WY, VW, VH);

    // registered zone labels travel with the plate
    ctx.save();
    ctx.beginPath(); ctx.rect(WX, 568, VW, 34); ctx.clip();
    ctx.font = "13px Menlo, Monaco, monospace"; ctx.fillStyle = LABEL; ctx.textBaseline = "alphabetic";
    if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
    [["I · SEED · 28 PT", 4], ["II · LINES · 16 PT", 474], ["III · MESH · 12 PT", 964]].forEach(function (l) {
      ctx.fillText(l[0], WX + l[1] - cam, 592);
    });
    ctx.restore();
  }

  // ---------- one paused GSAP timeline owns time ----------
  var driver = { _t: 0 };
  Object.defineProperty(driver, "t", { get: function () { return this._t; }, set: function (v) { this._t = v; render(v); } });

  tl.fromTo("#caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
  tl.fromTo(driver, { t: 0 }, { t: 3, duration: 3, ease: "none", immediateRender: true }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  function redraw() { render(tl.time()); }
  window.addEventListener("hf-seek", function (e) {
    var d = e && e.detail; var tt = d && typeof d.time === "number" ? d.time : null;
    if (tt !== null && Math.abs(tl.time() - tt) > 1e-6) tl.seek(tt, false);
    redraw();
  });
  render(0);
})();
</script>
