<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Satellite Image Briefing — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #16212B; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; }
  #root svg { display: block; width: 100%; height: 100%; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family: Menlo, "SF Mono", Consolas, monospace; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="14" height="5" fill="#5B7356"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B9D5DE" stroke-opacity=".22"/>
    </pattern>
    <pattern id="rows" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="8" height="3" fill="#6E7F55"/>
    </pattern>
    <clipPath id="plateClip"><rect x="0" y="0" width="800" height="470"/></clipPath>
    <clipPath id="wipeClip"><rect id="wipeRect" x="0" y="0" width="0" height="470"/></clipPath>
    <mask id="outlineMask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="840" height="510">
      <path id="outlineDraw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"
        d="M300 112 Q470 70 690 182 Q722 330 606 404 Q420 432 312 400 Q262 300 300 112 Z"
        fill="none" stroke="#fff" stroke-width="10"/>
    </mask>

    <!-- shared landscape: identical footprint, scale and north in both plates -->
    <g id="base">
      <rect width="800" height="470" fill="#71876A"/>
      <rect width="800" height="470" fill="url(#hatch)" opacity=".42"/>
      <rect x="470" y="0" width="330" height="140" fill="#7E9370"/>
      <rect x="470" y="0" width="330" height="140" fill="url(#rows)" opacity=".5"/>
      <rect x="0" y="160" width="100" height="160" fill="#667D5F"/>
      <rect x="240" y="300" width="150" height="70" fill="#86986F"/>
      <path d="M0 372 C140 340 250 410 380 380 S620 318 800 344 V470 H0 Z" fill="#46697C"/>
      <path d="M0 372 C140 340 250 410 380 380 S620 318 800 344" fill="none" stroke="#9FB3A0" stroke-width="2" opacity=".6"/>
      <path d="M118 0 L226 470" stroke="#D2CBB0" stroke-width="6" fill="none"/>
      <path d="M0 150 H800" stroke="#D2CBB0" stroke-width="5" fill="none"/>
    </g>
    <g id="landmark">
      <circle r="13" fill="#F2EFE4" stroke="#142536" stroke-width="3"/>
      <path d="M-14 0h28M0 -14v28" stroke="#142536" stroke-width="2"/>
    </g>
    <g id="site"><rect x="-9" y="-9" width="18" height="18" fill="#EDF1F3" stroke="#142536" stroke-width="2"/></g>
  </defs>

  <!-- stationary background -->
  <rect width="1280" height="720" fill="#16212B"/>

  <!-- heading -->
  <text x="60" y="56" class="sans" font-size="30" font-weight="700" fill="#EDF1F3">An idea becomes a connected system</text>
  <text x="60" y="88" class="mono" font-size="14" letter-spacing="2" fill="#B9D5DE">BRIEFING 07 · TWO DATED PLATES · SAME FOOTPRINT · NORTH UP</text>

  <!-- map plate -->
  <g id="plate" transform="translate(60 112)">
    <g clip-path="url(#plateClip)">
      <!-- T0 plate -->
      <g id="t0">
        <use href="#base"/>
        <use href="#site" x="440" y="190" transform="translate(440 190) scale(.7) translate(-440 -190)"/>
        <rect width="800" height="470" fill="url(#grid)"/>
      </g>

      <!-- T1 plate, revealed by wipe after registration -->
      <g id="t1" clip-path="url(#wipeClip)">
        <use href="#base"/>
        <!-- surface change in T1: cleared parcels, new built footprints and tracks -->
        <g fill="#B7AE8E">
          <rect x="420" y="168" width="44" height="44"/>
          <rect x="500" y="128" width="40" height="42"/>
          <rect x="618" y="218" width="44" height="44"/>
          <rect x="538" y="338" width="44" height="40"/>
          <rect x="310" y="150" width="40" height="40"/>
          <rect x="358" y="348" width="44" height="40"/>
        </g>
        <g fill="#8D9592">
          <rect x="428" y="176" width="12" height="10"/><rect x="446" y="194" width="10" height="10"/>
          <rect x="508" y="136" width="10" height="12"/><rect x="626" y="228" width="12" height="10"/>
          <rect x="644" y="244" width="10" height="10"/><rect x="546" y="346" width="12" height="10"/>
          <rect x="318" y="158" width="10" height="10"/><rect x="366" y="356" width="10" height="12"/>
        </g>
        <path d="M440 190 L520 150 L640 240 L560 360 M440 190 L330 170 M440 190 L380 370 L560 360"
          fill="none" stroke="#C9C1A2" stroke-width="3" opacity=".8"/>
        <rect width="800" height="470" fill="url(#grid)"/>
      </g>

      <!-- registration ghost: T1 line-art before alignment -->
      <g id="ghost" transform="translate(64 -46) rotate(4 360 220)" opacity="0">
        <rect x="1" y="1" width="798" height="468" fill="none" stroke="#EDF1F3" stroke-width="2" stroke-dasharray="8 6"/>
        <path d="M118 0 L226 470 M0 150 H800" stroke="#EDF1F3" stroke-width="2.5" fill="none"/>
        <path d="M0 372 C140 340 250 410 380 380 S620 318 800 344" stroke="#EDF1F3" stroke-width="2.5" fill="none"/>
        <circle cx="360" cy="220" r="16" fill="none" stroke="#EDF1F3" stroke-width="2.5"/>
        <path d="M340 220h40M360 200v40" stroke="#EDF1F3" stroke-width="2"/>
      </g>

      <!-- change layer: one contrast colour, restrained opacity -->
      <g id="change">
        <path id="outlineFill" d="M300 112 Q470 70 690 182 Q722 330 606 404 Q420 432 312 400 Q262 300 300 112 Z"
          fill="#5FD0FF" fill-opacity="0"/>
        <path d="M300 112 Q470 70 690 182 Q722 330 606 404 Q420 432 312 400 Q262 300 300 112 Z"
          fill="none" stroke="#5FD0FF" stroke-width="2.5" pathLength="100" stroke-dasharray="1.6 1" mask="url(#outlineMask)"/>
        <g fill="none" stroke="#5FD0FF" stroke-width="4" stroke-linecap="round">
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M440 190 L520 150"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M440 190 L330 170"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M440 190 L380 370"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M520 150 L640 240"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M440 190 L560 360"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M640 240 L560 360"/>
          <path class="link" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M380 370 L560 360"/>
        </g>
        <g id="nodes">
          <g class="node" transform="translate(440 190)"><g class="pop"><use href="#site"/></g></g>
          <g class="node" transform="translate(520 150)"><g class="pop"><use href="#site"/></g></g>
          <g class="node" transform="translate(330 170)"><g class="pop"><use href="#site"/></g></g>
          <g class="node" transform="translate(380 370)"><g class="pop"><use href="#site"/></g></g>
          <g class="node" transform="translate(640 240)"><g class="pop"><use href="#site"/></g></g>
          <g class="node" transform="translate(560 360)"><g class="pop"><use href="#site"/></g></g>
        </g>
      </g>

      <!-- shared landmark in the common coordinate plane -->
      <use href="#landmark" x="360" y="220"/>

      <!-- wipe edge -->
      <g id="wipeEdge" transform="translate(0 0)" opacity="0">
        <rect x="-1.5" y="0" width="3" height="470" fill="#EDF1F3"/>
      </g>
    </g>
    <rect x="0" y="0" width="800" height="470" fill="none" stroke="#B9D5DE" stroke-opacity=".55"/>

    <!-- date tags: always visible, outside the change region -->
    <g class="mono" font-size="15" font-weight="700">
      <rect x="12" y="12" width="170" height="30" fill="#EDF1F3"/>
      <text x="24" y="33" fill="#142536">T0 · 2024-03-02</text>
      <rect x="618" y="12" width="170" height="30" fill="#EDF1F3"/>
      <text x="630" y="33" fill="#142536">T1 · 2026-11-26</text>
    </g>
    <!-- scale + north (bottom-right, on dark backing) -->
    <g class="mono" font-size="12" fill="#EDF1F3">
      <rect x="628" y="424" width="160" height="34" fill="#16212B" fill-opacity=".82"/>
      <path d="M640 436h80" stroke="#EDF1F3" stroke-width="3"/>
      <text x="640" y="452">0 — 500 m</text>
      <text x="748" y="447" font-weight="700">N↑</text>
    </g>
  </g>

  <!-- coordinate ticks outside the plate -->
  <g class="mono" font-size="11" fill="#B9D5DE">
    <text x="60" y="600">12.4920°E</text>
    <text x="422" y="600">12.4964°E</text>
    <text x="796" y="600">12.5008°E</text>
    <path d="M420 582v8" stroke="#B9D5DE"/>
  </g>

  <!-- side panel -->
  <g transform="translate(900 112)" class="mono">
    <text x="0" y="14" font-size="12" letter-spacing="2" fill="#B9D5DE">LANDMARK ⊕</text>
    <text x="0" y="40" font-size="17" font-weight="700" fill="#EDF1F3">41.9028°N</text>
    <text x="0" y="64" font-size="17" font-weight="700" fill="#EDF1F3">12.4964°E</text>
    <path d="M0 88H320" stroke="#B9D5DE" stroke-opacity=".35"/>

    <text x="0" y="118" font-size="12" letter-spacing="2" fill="#B9D5DE">REGISTRATION</text>
    <text id="regOff" x="0" y="146" font-size="15" fill="#EDF1F3">offset 64 m E · 46 m N · 4.0°</text>
    <g id="regOk" opacity="0">
      <rect x="0" y="160" width="250" height="30" fill="#EDF1F3"/>
      <text x="12" y="181" font-size="14" font-weight="700" fill="#142536">PLATES CO-REGISTERED</text>
    </g>
    <path d="M0 214H320" stroke="#B9D5DE" stroke-opacity=".35"/>

    <text x="0" y="244" font-size="12" letter-spacing="2" fill="#B9D5DE">COMPARISON</text>
    <text x="0" y="272" font-size="15" fill="#EDF1F3">T0  2024-03-02</text>
    <text x="0" y="296" font-size="15" fill="#EDF1F3">T1  2026-11-26</text>
    <g id="legend" opacity="0">
      <path d="M2 330h40" stroke="#5FD0FF" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="54" y="335" font-size="13" fill="#B9D5DE">region of change</text>
      <path d="M2 358h40" stroke="#5FD0FF" stroke-width="4"/>
      <text x="54" y="363" font-size="13" fill="#B9D5DE">new links (T1)</text>
    </g>
  </g>

  <!-- caption -->
  <g id="caption" class="mono" opacity="0">
    <text x="60" y="648" font-size="18" font-weight="700" fill="#5FD0FF">Δ CHANGE TRACED — 1 spark became 6 linked sites</text>
    <text x="60" y="678" font-size="13" fill="#B9D5DE">Same landmark ⊕, same scale, same north. Illustrative procedural plates, not real imagery.</text>
  </g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });

  // 1 · Establish shared landscape, ghost T1 plate enters misaligned
  tl.fromTo("#ghost", { opacity: 0 }, { opacity: 0.95, duration: 0.2, ease: "none" }, 0.05);
  // 2 · Register on the landmark (translate + rotate to identity)
  tl.fromTo("#ghost", { attr: { transform: "translate(64 -46) rotate(4 360 220)" } },
    { attr: { transform: "translate(0 0) rotate(0 360 220)" }, duration: 0.75, ease: "power3.inOut" }, 0.2);
  tl.fromTo("#regOff", { opacity: 1 }, { opacity: 0.35, duration: 0.2, ease: "none" }, 0.8);
  tl.fromTo("#regOk", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.92);

  // 3 · Wipe T0 -> T1 across the registered footprint
  tl.fromTo("#wipeEdge", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 1.0);
  tl.fromTo("#wipeRect", { attr: { width: 0 } }, { attr: { width: 800 }, duration: 0.7, ease: "power1.inOut" }, 1.02);
  tl.fromTo("#wipeEdge", { attr: { transform: "translate(0 0)" } }, { attr: { transform: "translate(800 0)" }, duration: 0.7, ease: "power1.inOut" }, 1.02);
  tl.fromTo("#ghost", { opacity: 0.95 }, { opacity: 0, duration: 0.5, ease: "none" }, 1.15);
  tl.fromTo("#wipeEdge", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 1.72);

  // 4 · Trace the region of change and the linked system
  tl.fromTo("#outlineDraw", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55 }, 1.6);
  tl.fromTo("#outlineFill", { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": 0.16 }, duration: 0.4, ease: "none" }, 1.85);
  tl.fromTo(".pop", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(1.6)", stagger: 0.06 }, 1.7);
  tl.fromTo(".link", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.28, ease: "power2.out", stagger: 0.05 }, 1.8);
  tl.fromTo("#legend", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.9);
  tl.fromTo("#caption", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 1.95);

  // 5 · Hold the outlined change
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  tl.seek(0);
})();
</script>
