<html>
<head>
<meta charset="utf-8">
<title>Art Deco — An idea becomes a connected system</title>
<style>

  #video{width:100%;height:100%;position:relative}
  #video svg{width:100%;height:100%;display:block}

</head>
<body>

  <defs>
    <clipPath id="archClip"><path d="M340 440 V260 A300 300 0 0 1 940 260 V440 Z"/></clipPath>
    <clipPath id="discClip"><circle cx="640" cy="170" r="30"/></clipPath>
    <clipPath id="medalReveal"><rect id="medalRevealRect" x="640" y="110" width="0" height="120"/></clipPath>
    <clipPath id="subClip"><rect id="subClipRect" x="640" y="470" width="0" height="50"/></clipPath>
    <clipPath id="titleClip"><rect id="titleClipRect" x="640" y="520" width="0" height="80"/></clipPath>
    <clipPath id="chevClip"><rect id="chevClipRect" x="640" y="612" width="0" height="42"/></clipPath>
    <pattern id="chev" width="30" height="30" patternUnits="userSpaceOnUse" x="490" y="618">
      <path d="M0 22 L15 8 L30 22" stroke="#B99A57" stroke-width="2" fill="none"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">

      <stop offset=".5" stop-color="#F6EEDC" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F6EEDC" stop-opacity="0"/>

    <pattern id="inlay" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="3.5" y="0" width="1" height="8" fill="#B99A57"/>
    </pattern>
    <!-- Glint lives in its own clip, limited to the medallion metal -->
    <clipPath id="glintClip"><circle cx="640" cy="170" r="30"/><path d="M594.5 170 a45.5 45.5 0 1 0 91 0 a45.5 45.5 0 1 0 -91 0 Z M597.5 170 a42.5 42.5 0 1 0 85 0 a42.5 42.5 0 1 0 -85 0 Z" clip-rule="evenodd"/></clipPath>
    <!-- One left door leaf set; the right set is the exact mirror about x=640 -->
    <g id="leafSet">
      <g class="leaf3">
        <path d="M340 -40 H440 V440 H340 Z" fill="#151515"/>
        <path d="M340 -40 H440 V440 H340 Z" fill="url(#inlay)" fill-opacity=".22" stroke="#B99A57" stroke-width="1.5"/>
      </g>
      <g class="leaf2">
        <path d="M340 -40 H520 V110 H544 V250 H566 V330 H544 V440 H340 Z" fill="#151515"/>
        <path d="M340 -40 H520 V110 H544 V250 H566 V330 H544 V440 H340 Z" fill="url(#inlay)" fill-opacity=".34" stroke="#B99A57" stroke-width="2"/>
        <path d="M521.5 -40 V108.5 H545.5 V248.5 H567.5" stroke="#F6EEDC" stroke-opacity=".45" stroke-width=".8" fill="none"/>
      </g>
      <g class="leaf1">
        <path d="M340 -40 H640 V440 H340 Z" fill="#151515"/>
        <path d="M340 -40 H640 V440 H340 Z" fill="url(#inlay)" fill-opacity=".5" stroke="#B99A57" stroke-width="2"/>
        <path d="M640 110 H604 V156 H566 V214 H528 V272 H490 V330 H452 V420 H640 Z" fill="#151515"/>
        <path d="M640 110 H604 V156 H566 V214 H528 V272 H490 V330 H452 V420 H640" fill="none" stroke="#B99A57" stroke-width="1.8"/>
        <path d="M640 140 H618 V182 H586 V236 H554 V290 H522 V344 H486 V400 H640" fill="none" stroke="#F6EEDC" stroke-opacity=".55" stroke-width=".9"/>
        <path d="M624 -40 V100" stroke="#B99A57" stroke-width="1" fill="none"/>
        <polygon points="640,134 604,170 640,206" fill="#B99A57"/>
        <polygon points="640,154 620,170 640,186" fill="#151515"/>
      </g>
    </g>
  </defs>

  <!-- Stationary ground and frame -->
  <rect width="1280" height="720" fill="#151515"/>
  <rect x="24" y="24" width="1232" height="672" fill="none" stroke="#B99A57" stroke-width="2"/>
  <rect x="36" y="36" width="1208" height="648" fill="none" stroke="#B99A57" stroke-width=".8"/>
  <g stroke="#B99A57" stroke-width="2" fill="none">
    <path d="M24 84 H52 V52 H84 V24"/><path d="M1256 84 H1228 V52 H1196 V24"/>
    <path d="M24 636 H52 V668 H84 V696"/><path d="M1256 636 H1228 V668 H1196 V696"/>
  </g>

  <!-- Arch interior: sunburst, rings, network, ziggurat, medallion -->
  <g clip-path="url(#archClip)">
    <g id="rays" stroke="#B99A57" stroke-width="1.4" stroke-opacity=".8" fill="none"></g>
    <g id="rings" fill="none" stroke="#B99A57" stroke-opacity=".8" stroke-width=".7">
      <circle cx="640" cy="440" r="130"/><circle cx="640" cy="440" r="210"/>
    </g>
  </g>

  <g id="network" stroke="#F6EEDC" stroke-width="1.3" fill="none">
    <polyline id="netL" points="596,170 470,190 410,300 440,404"/>
    <polyline id="netR" points="684,170 810,190 870,300 840,404"/>
    <line id="branchL" x1="470" y1="190" x2="560" y2="296"/>
    <line id="branchR" x1="810" y1="190" x2="720" y2="296"/>
  </g>

  <path id="zigFill" d="M440 440 V404 H480 V368 H520 V332 H560 V296 H592 V258 H688 V296 H720 V332 H760 V368 H800 V404 H840 V440 Z" fill="#151515"/>
  <g id="zig" fill="none" stroke="#B99A57" stroke-width="2.5" stroke-linejoin="miter">
    <path id="zigL" d="M640 258 H592 V296 H560 V332 H520 V368 H480 V404 H440 V440 H640"/>
    <path id="zigR" d="M640 258 H688 V296 H720 V332 H760 V368 H800 V404 H840 V440 H640"/>
  </g>
  <g id="flutes" stroke="#F6EEDC" stroke-opacity=".55" stroke-width="1">
    <line x1="610" y1="270" x2="610" y2="436"/><line x1="625" y1="270" x2="625" y2="436"/>
    <line x1="640" y1="270" x2="640" y2="436"/><line x1="655" y1="270" x2="655" y2="436"/>
    <line x1="670" y1="270" x2="670" y2="436"/>
  </g>
  <line id="stem" x1="640" y1="258" x2="640" y2="214" stroke="#B99A57" stroke-width="3"/>

  <g id="medal" clip-path="url(#medalReveal)">
    <circle id="ring" cx="640" cy="170" r="44" fill="none" stroke="#F6EEDC" stroke-width="1.5"/>
    <circle cx="640" cy="170" r="30" fill="#B99A57"/>
    <polygon points="640,156 654,170 640,184 626,170" fill="#151515"/>
  </g>
  <!-- Single closing shine: separate clip over the medallion metal only -->
  <g clip-path="url(#glintClip)">
    <rect id="glint" opacity="0" x="540" y="100" width="40" height="140" fill="url(#sheen)" transform="rotate(24 640 170)"/>
  </g>
  <polygon clip-path="url(#medalReveal)" points="640,156 654,170 640,184 626,170" fill="#151515"/>

  <g fill="#B99A57" stroke="#F6EEDC" stroke-width="1">
    <polygon class="node" opacity="0" id="n1L" points="470,180 480,190 470,200 460,190"/>
    <polygon class="node" opacity="0" id="n1R" points="810,180 820,190 810,200 800,190"/>
    <polygon class="node" opacity="0" id="n2L" points="410,290 420,300 410,310 400,300"/>
    <polygon class="node" opacity="0" id="n2R" points="870,290 880,300 870,310 860,300"/>
  </g>

  <!-- Nested stepped door leaves, clipped to the arch; part from the central axis -->
  <g clip-path="url(#archClip)">
    <g id="doorL"></g>
    <g id="doorR"></g>
  </g>

  <!-- Arch outlines draw from both bases toward the apex on the axis -->
  <g fill="none" stroke="#B99A57">
    <path id="archOL" d="M340 440 V260 A300 300 0 0 1 640 -40" stroke-width="2"/>
    <path id="archOR" d="M940 440 V260 A300 300 0 0 0 640 -40" stroke-width="2"/>
    <path id="archIL" d="M356 440 V262 A284 284 0 0 1 640 -22" stroke-width=".8"/>
    <path id="archIR" d="M924 440 V262 A284 284 0 0 0 640 -22" stroke-width=".8"/>
  </g>

  <!-- Nested stepped side frames (graduated setbacks); each pair is mirrored about x=640 -->
  <g id="stepFrames"></g>

  <g fill="none" stroke="#B99A57" stroke-width="2">
    <path id="towerL" d="M120 440 V300 H140 V260 H160 V300 H180 V440"/>
    <path id="towerR" d="M1160 440 V300 H1140 V260 H1120 V300 H1100 V440"/>
  </g>
  <g stroke="#B99A57" fill="none">
    <path id="groundL" d="M640 440 H100" stroke-width="2"/><path id="groundR" d="M640 440 H1180" stroke-width="2"/>
    <path id="ground2L" d="M640 448 H100" stroke-width=".8"/><path id="ground2R" d="M640 448 H1180" stroke-width=".8"/>
  </g>

  <!-- Approved copy: stable reading area below the ground line -->
  <g stroke="#B99A57" stroke-width="1" fill="none">
    <path id="ruleL" d="M450 499 H300"/><path id="ruleR" d="M830 499 H980"/>
  </g>
  <text clip-path="url(#subClip)" x="640" y="505" text-anchor="middle" font-size="18" letter-spacing="12" fill="#B99A57">AN IDEA BECOMES</text>
  <text clip-path="url(#titleClip)" x="640" y="584" text-anchor="middle" font-size="58" font-weight="500" letter-spacing="10" fill="#F6EEDC">A CONNECTED SYSTEM</text>
  <rect clip-path="url(#chevClip)" x="490" y="618" width="300" height="30" fill="url(#chev)"/>
  <g stroke="#B99A57" stroke-width="1" fill="none">
    <path id="chevTopL" d="M640 616 H490"/><path id="chevTopR" d="M640 616 H790"/>
    <path id="chevBotL" d="M640 650 H490"/><path id="chevBotR" d="M640 650 H790"/>
  </g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script src="chroma.min.js"></script>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const C={bg:'#151515',fg:'#F6EEDC',gold:'#B99A57'};
  // Palette validation only (no recolouring): gold subtitle and ivory title on the black ground.
  window.__decoContrast={gold:chroma.contrast(C.gold,C.bg),ivory:chroma.contrast(C.fg,C.bg)};

  // Build sunburst rays (individual lines so each draws from the hub outward).
  const rayEnds=[[1132,353],[1110,269],[1073,190],[1023,119],[961,57],[890,7],[811,-30],[727,-52],[640,-60],[553,-52],[469,-30],[390,7],[319,57],[257,119],[207,190],[170,269],[148,353]];
  const raysG=document.getElementById('rays');
  const rays=rayEnds.map(([x,y])=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',640);l.setAttribute('y1',440);l.setAttribute('x2',x);l.setAttribute('y2',y);raysG.appendChild(l);return l;});

  // Instantiate mirrored door leaf sets.
  const tpl=document.getElementById('leafSet');
  const doorL=document.getElementById('doorL'), doorR=document.getElementById('doorR');
  const left=tpl.cloneNode(true); left.removeAttribute('id'); doorL.appendChild(left);
  const rightInner=document.createElementNS(NS,'g'); rightInner.setAttribute('transform','matrix(-1 0 0 1 1280 0)');
  const right=tpl.cloneNode(true); right.removeAttribute('id'); rightInner.appendChild(right); doorR.appendChild(rightInner);
  // Wrap each leaf so GSAP owns only the wrapper translation (mirror matrix stays authored).
  function wrapLeaf(root,cls){const leaf=root.querySelector('.'+cls);const w=document.createElementNS(NS,'g');leaf.parentNode.insertBefore(w,leaf);w.appendChild(leaf);return w;}
  const leavesL=['leaf1','leaf2','leaf3'].map(c=>wrapLeaf(left,c));
  const leavesR=['leaf1','leaf2','leaf3'].map(c=>wrapLeaf(right,c));

  // Nested stepped side frames: three graduated setback pilasters per side.
  // k=2 is outermost/shortest; each has a dark body, gold raised edge and an ivory inner bevel line.
  const framesG=document.getElementById('stepFrames');
  const framePairs=[0,1,2].map(k=>{
    const x0=324-24*k, top=90+40*k;
    const d='M'+x0+' 440 V262 H'+(x0-12)+' V192 H'+(x0-24)+' V'+top+' H'+(x0-40)+' V440 Z';
    const bevel='M'+(x0-2.5)+' 438 V264.5 H'+(x0-14.5)+' V194.5 H'+(x0-26.5)+' V'+(top+2.5);
    const make=mirror=>{
      const outer=document.createElementNS(NS,'g');
      const inner=document.createElementNS(NS,'g');
      if(mirror)inner.setAttribute('transform','matrix(-1 0 0 1 1280 0)');
      inner.innerHTML='<path d="'+d+'" fill="#151515" stroke="#B99A57" stroke-width="2"/>'+
        '<path d="'+bevel+'" fill="none" stroke="#F6EEDC" stroke-opacity=".5" stroke-width=".8"/>'+
        '<path d="M'+(x0-34)+' '+(top+16)+' V428" fill="none" stroke="#B99A57" stroke-width="1"/>';
      outer.appendChild(inner);return outer;};
    const L=make(false), R=make(true);
    framesG.appendChild(L);framesG.appendChild(R);
    return {k,L,R};
  });
  // Draw outermost first so inner frames overlap it (nested reading order).
  framePairs.slice().reverse().forEach(p=>{framesG.appendChild(p.L);framesG.appendChild(p.R);});

  const $=id=>document.getElementById(id);
  function prepDraw(el){const L=el.getTotalLength()+1;el.style.strokeDasharray=L+' '+L;el.style.strokeDashoffset=L;return L;}
  const tl=gsap.timeline({paused:true,defaults:{immediateRender:false}});
  function draw(els,start,dur,ease,stagger){
    els=[].concat(els);
    els.forEach((el,i)=>{const L=prepDraw(el);
      const at=start+(typeof stagger==='function'?stagger(i):(stagger||0)*i);
      tl.fromTo(el,{strokeDashoffset:L},{strokeDashoffset:0,duration:dur,ease:ease||'power2.inOut'},at);});
  }

  // 0.00–0.66  Outer steps arrive in mirrored pairs, outermost first, travelling toward the axis.
  framePairs.slice().reverse().forEach((p,i)=>{
    const at=i*0.11;
    tl.fromTo(p.L,{x:-90,opacity:0},{x:0,opacity:1,duration:0.44,ease:'power3.out'},at);
    tl.fromTo(p.R,{x:90,opacity:0},{x:0,opacity:1,duration:0.44,ease:'power3.out'},at);
  });

  // 0.00–0.55  Establish: closed inlaid doors; arch, towers and ground draw toward the axis.
  draw([$('archOL'),$('archOR')],0,0.55,'power2.inOut');
  draw([$('archIL'),$('archIR')],0.08,0.55,'power2.inOut');
  draw([$('groundL'),$('groundR'),$('ground2L'),$('ground2R')],0,0.5,'power2.out');
  draw([$('towerL'),$('towerR')],0.15,0.5,'power2.inOut');

  // 0.30–1.15  Mirrored sweep: three nested stepped leaves telescope outward from x=640.
  const travel=[300,222,102], starts=[0.30,0.38,0.46], durs=[0.85,0.74,0.62];
  travel.forEach((d,i)=>{
    tl.fromTo(leavesL[i],{x:0},{x:-d,duration:durs[i],ease:'power3.inOut'},starts[i]);
    tl.fromTo(leavesR[i],{x:0},{x:-d,duration:durs[i],ease:'power3.inOut'},starts[i]); // inside mirror matrix: -x moves right
  });

  // 0.40–1.15  Sunburst rays draw from the hub, centre ray first, pairs outward.
  draw(rays,0.40,0.6,'power2.out',i=>Math.abs(i-8)*0.018);
  tl.fromTo('#rings',{opacity:0},{opacity:1,duration:0.4,ease:'sine.inOut'},0.75);

  // 0.60–1.15  Ziggurat halves draw from the top centre down both sides; flutes rise.
  draw([$('zigL'),$('zigR')],0.60,0.55,'power2.inOut');
  tl.fromTo('#flutes',{scaleY:0,transformOrigin:'50% 100%'},{scaleY:1,duration:0.4,ease:'power2.out'},0.95);
  draw($('stem'),0.95,0.2,'power2.out');

  // 1.00–1.35  Focal mark: medallion uncovered by a mirrored clip from the axis.
  tl.fromTo('#medalRevealRect',{attr:{x:640,width:0}},{attr:{x:590,width:100},duration:0.35,ease:'power2.inOut'},1.0);
  tl.fromTo('#ring',{scale:0.82,transformOrigin:'50% 50%'},{scale:1,duration:0.4,ease:'back.out(1.2)'},1.0);

  // 1.30–1.80  The idea connects: network lines run out to each node, nodes land on arrival.
  const netDur=0.5, netStart=1.30;
  draw([$('netL'),$('netR')],netStart,netDur,'none');
  const f1=128.27/361.81, f2=(128.27+125.30)/361.81;
  gsap.utils.toArray('.node').forEach(n=>gsap.set(n,{transformOrigin:'50% 50%'}));
  tl.fromTo(['#n1L','#n1R'],{scale:0,opacity:0},{scale:1,opacity:1,duration:0.18,ease:'back.out(1.2)'},netStart+netDur*f1);
  tl.fromTo(['#n2L','#n2R'],{scale:0,opacity:0},{scale:1,opacity:1,duration:0.18,ease:'back.out(1.2)'},netStart+netDur*f2);
  draw([$('branchL'),$('branchR')],netStart+netDur*f1+0.04,0.28,'power2.out');

  // 1.50–2.40  Copy opens from the axis (static glyphs, clip only) for a clean hold.
  draw([$('ruleL'),$('ruleR')],1.50,0.4,'power2.out');
  tl.fromTo('#subClipRect',{attr:{x:640,width:0}},{attr:{x:280,width:720},duration:0.4,ease:'power2.inOut'},1.50);
  tl.fromTo('#titleClipRect',{attr:{x:640,width:0}},{attr:{x:160,width:960},duration:0.5,ease:'power2.inOut'},1.72);
  tl.fromTo('#chevClipRect',{attr:{x:640,width:0}},{attr:{x:486,width:308},duration:0.4,ease:'power2.inOut'},2.0);
  draw([$('chevTopL'),$('chevTopR'),$('chevBotL'),$('chevBotR')],2.0,0.4,'power2.inOut');

  // 2.20–2.62  One eye-catching shine across the medallion metal (separate glint clip).
  // Glint is opacity 0 before 2.2 s in every seek direction and finishes outside the metal.
  tl.fromTo('#glint',{attr:{opacity:0}},{attr:{opacity:1},duration:0.04,ease:'none'},2.20);
  tl.fromTo('#glint',{attr:{x:540}},{attr:{x:700},duration:0.42,ease:'power2.inOut'},2.20);

  // Hold settled frame to 3.0 s.
  tl.to({}, {duration:0.001}, 2.999);
  tl.progress(1).progress(0);
  window.__timelines={video:tl};
})();
</script>
