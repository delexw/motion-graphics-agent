<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Rhythm Montage — An idea becomes a connected system</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#12162E;overflow:hidden}
  #root{width:100%;height:100%;position:relative}
  svg{display:block;width:100%;height:100%}
  .lbl{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;letter-spacing:2px;fill:#F3EEE4}
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="panel"><rect x="40" y="40" width="1200" height="520"/></clipPath>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F5C"/><stop offset="1" stop-color="#E07B4C"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E22"/><stop offset="1" stop-color="#1E2452"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#F6B14A" stop-opacity=".55"/><stop offset="1" stop-color="#F6B14A" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#12162E"/>

  <g clip-path="url(#panel)">
    <!-- SHOT A: signal close-up (every 90 s) -->
    <g id="shotA">
      <rect x="40" y="40" width="1200" height="520" fill="#1F2650"/>
      <rect x="40" y="470" width="1200" height="90" fill="#191F45"/>
      <rect x="465" y="520" width="40" height="40" fill="#0E1228"/>
      <rect x="385" y="70" width="200" height="460" rx="32" fill="#0E1228"/>
      <circle cx="485" cy="171" r="62" fill="#3A2A2A" id="lampRed"/>
      <circle cx="485" cy="321" r="62" fill="#3A3226"/>
      <circle cx="485" cy="321" r="150" fill="url(#glow)" id="lampGlow" opacity="0"/>
      <circle cx="485" cy="321" r="62" fill="#F6B14A" id="lampAmber" opacity="0"/>
      <circle cx="485" cy="471" r="50" fill="#1C2A2A"/>
      <path id="beamA" d="M560 321H1240" stroke="#F6B14A" stroke-width="3" stroke-dasharray="6 10" fill="none" opacity="0"/>
      <text class="lbl" x="640" y="276" id="lblA" opacity="0">EVERY 90 S · SIGNAL</text>
    </g>

    <!-- SHOT B: train wide (every 4 min) -->
    <g id="shotB" opacity="0">
      <rect x="40" y="40" width="1200" height="520" fill="#1F2650"/>
      <g fill="#262E5E">
        <rect x="80" y="120" width="140" height="190"/><rect x="250" y="160" width="110" height="150"/>
        <rect x="860" y="100" width="160" height="210"/><rect x="1060" y="150" width="140" height="160"/>
      </g>
      <rect x="40" y="368" width="1200" height="192" fill="#191F45"/>
      <path d="M40 366H1240" stroke="#5FD0C2" stroke-width="6"/>
      <g id="train">
        <rect x="-760" y="276" width="800" height="86" rx="14" fill="#0E1228"/>
        <g fill="#F6B14A" opacity=".85">
          <rect x="-720" y="296" width="44" height="26" rx="3"/><rect x="-640" y="296" width="44" height="26" rx="3"/>
          <rect x="-560" y="296" width="44" height="26" rx="3"/><rect x="-480" y="296" width="44" height="26" rx="3"/>
          <rect x="-400" y="296" width="44" height="26" rx="3"/><rect x="-320" y="296" width="44" height="26" rx="3"/>
          <rect x="-240" y="296" width="44" height="26" rx="3"/><rect x="-160" y="296" width="44" height="26" rx="3"/>
        </g>
        <circle cx="0" cy="321" r="110" fill="url(#glow)"/>
        <circle cx="0" cy="321" r="34" fill="#F6B14A"/>
        <path d="M40 321H760" stroke="#F6B14A" stroke-width="3" stroke-dasharray="6 10" fill="none"/>
      </g>
      <text class="lbl" x="640" y="226">EVERY 4 MIN · TRAIN</text>
    </g>

    <!-- SHOT C: fixed view, 18:00 -> 23:00 compressed -->
    <g id="shotC" opacity="0">
      <rect x="40" y="40" width="1200" height="520" fill="url(#dusk)"/>
      <rect x="40" y="40" width="1200" height="520" fill="url(#night)" id="nightSky" opacity="0"/>
      <g id="buildings"></g>
      <g id="links" fill="none" stroke="#5FD0C2" stroke-width="3" stroke-linecap="round"></g>
      <g id="lit"></g>
      <rect x="48" y="52" width="372" height="40" rx="4" fill="#12162E" opacity=".82"/>
      <text class="lbl" x="62" y="78">FIXED VIEW · 18:00 → 23:00</text>
    </g>
  </g>

  <!-- persistent clock readout (top right of panel) -->
  <rect x="1100" y="52" width="128" height="40" rx="4" fill="#12162E" opacity=".85"/>
  <text id="clock" class="lbl" x="1164" y="79" text-anchor="middle" style="font-size:20px">18:00</text>

  <!-- interval bars -->
  <g id="bars">
    <rect x="40" y="572" width="60" height="6" fill="#2A2F4E"/><rect x="110" y="572" width="60" height="6" fill="#2A2F4E"/>
    <rect x="180" y="572" width="60" height="6" fill="#2A2F4E"/><rect x="250" y="572" width="60" height="6" fill="#2A2F4E"/>
    <rect x="320" y="572" width="60" height="6" fill="#2A2F4E"/>
  </g>
  <g id="barsOn" fill="#F6B14A"></g>

  <text id="title" x="40" y="630" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#F3EEE4" opacity="0">An idea becomes a connected system.</text>
  <text id="sub" x="40" y="666" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#5FD0C2" opacity="0">One window lights, then the block answers.</text>
</svg>
</div>
<script src="gsap.min.js"></script>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

  // Buildings + window grids (deterministic)
  var B = [ {x:180,y:140,w:340,cols:9,rows:10}, {x:600,y:220,w:300,cols:8,rows:8}, {x:960,y:300,w:220,cols:6,rows:6} ];
  var gB = document.getElementById("buildings");
  B.forEach(function(b){
    el("rect",{x:b.x,y:b.y,width:b.w,height:560-b.y,fill:"#1B2045"},gB);
    for(var r=0;r<b.rows;r++) for(var c=0;c<b.cols;c++)
      el("rect",{x:b.x+8+36*c,y:b.y+10+40*r,width:18,height:22,fill:"#2C3463"},gB);
  });
  function node(bi,c,r){ var b=B[bi]; return {x:b.x+8+36*c, y:b.y+10+40*r}; }
  // A is the origin window, sitting where the signal lamp and train headlight were (485,321)
  var N = { A:node(0,8,4), Bn:node(0,6,5), C:node(0,3,6), D:node(0,6,2), E:node(1,2,3), F:node(1,5,1), G:node(1,6,5), H:node(2,1,3), I:node(2,4,1) };
  var order = ["A","Bn","E","C","D","F","G","H","I"];
  var edges = [["A","Bn"],["A","E"],["Bn","C"],["Bn","D"],["E","F"],["F","G"],["G","H"],["H","I"]];
  var gL = document.getElementById("links"), gW = document.getElementById("lit");
  var litEls = {}, linkEls = [];
  edges.forEach(function(e){
    var a=N[e[0]], b=N[e[1]];
    var len = Math.hypot(b.x-a.x, b.y-a.y);
    var p = el("path",{d:"M"+(a.x+9)+" "+(a.y+11)+"L"+(b.x+9)+" "+(b.y+11),"stroke-dasharray":len,"stroke-dashoffset":len},gL);
    linkEls.push(p);
  });
  order.forEach(function(k){
    var n=N[k];
    var g = el("g",{opacity:0},gW);
    el("rect",{x:n.x-9,y:n.y-9,width:36,height:40,fill:"#F6B14A",opacity:.22},g);
    el("rect",{x:n.x,y:n.y,width:18,height:22,fill:"#F6B14A"},g);
    litEls[k]=g;
  });

  // Interval bars (fill sequentially)
  var gOn = document.getElementById("barsOn"), barOn=[];
  for(var i=0;i<5;i++) barOn.push(el("rect",{x:40+70*i,y:572,width:60,height:6,opacity:0},gOn));

  var clock = document.getElementById("clock");
  var hours = {h:18};
  function setClock(){ var m=Math.round(hours.h*60); var hh=Math.floor(m/60), mm=m%60; clock.textContent = hh+":"+(mm<10?"0":"")+mm; }

  var tl = gsap.timeline({paused:true, defaults:{ease:"power2.inOut"}});
  // Title band
  tl.fromTo("#title",{opacity:0,y:14},{opacity:1,y:0,duration:0.4,ease:"power2.out"},0.1);

  // SHOT A: amber lamp lights, beam draws along the shared horizontal vector
  tl.to("#lampRed",{attr:{fill:"#24191C"},duration:0.2},0.12)
    .to("#lampAmber",{opacity:1,duration:0.18,ease:"power2.out"},0.18)
    .to("#lampGlow",{opacity:1,duration:0.3,ease:"power2.out"},0.18)
    .fromTo("#beamA",{opacity:1,scaleX:0,svgOrigin:"560 321"},{scaleX:1,duration:0.45,ease:"power2.out"},0.3)
    .to("#lblA",{opacity:1,duration:0.25},0.35)
    .to(barOn[0],{opacity:1,duration:0.15},0.3);

  // CUT 1 at 0.95: lamp at full phase -> headlight at the same point, same vector
  tl.set("#shotA",{opacity:0},0.95).set("#shotB",{opacity:1},0.95)
    .fromTo("#train",{x:485},{x:1010,duration:0.8,ease:"none"},0.95)
    .to(barOn[1],{opacity:1,duration:0.15},1.1);

  // CUT 2 at 1.75: headlight phase -> first lit window in the fixed view
  tl.set("#shotB",{opacity:0},1.75).set("#shotC",{opacity:1},1.75)
    .to("#nightSky",{opacity:1,duration:0.85,ease:"sine.inOut"},1.75)
    .to(hours,{h:23,duration:0.85,ease:"sine.inOut",onUpdate:setClock},1.75)
    .to(barOn[2],{opacity:1,duration:0.12},1.9)
    .to(barOn[3],{opacity:1,duration:0.12},2.15)
    .to(barOn[4],{opacity:1,duration:0.12},2.4);
  tl.to(litEls.A,{opacity:1,duration:0.12,ease:"power2.out"},1.8);
  // the block answers: links draw out from A, windows light as each link arrives
  var t0 = 1.92, step = 0.065;
  edges.forEach(function(e,i){
    var s = t0 + i*step;
    tl.to(linkEls[i],{attr:{"stroke-dashoffset":0},duration:0.18,ease:"power2.out"},s);
    tl.to(litEls[e[1]],{opacity:1,duration:0.1,ease:"power2.out"},s+0.15);
  });
  tl.fromTo("#sub",{opacity:0,y:8},{opacity:1,y:0,duration:0.3,ease:"power2.out"},1.95);
  tl.set({}, {}, 3);

  setClock();
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener("hf-seek", function(ev){ var t = ev && ev.detail && typeof ev.detail.time==="number" ? ev.detail.time : null; if(t!==null) tl.seek(t,false); });
})();
</script>

</html>
