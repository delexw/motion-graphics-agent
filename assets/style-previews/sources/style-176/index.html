<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broadcast News Package — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0A1F3A; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; }
  #root svg { display: block; width: 100%; height: 100%; }
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#14406E"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#3B6EA5" stroke-opacity=".22"/>
    </pattern>
    <clipPath id="strapClip"><rect id="strapClipRect" x="60" y="520" width="0" height="120"/></clipPath>
    <clipPath id="subClip"><rect id="subClipRect" x="230" y="600" width="0" height="40"/></clipPath>
  </defs>

  <!-- Stationary background + broadcast grid -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Pinned programme location mark: never animated -->
  <g id="programme-mark">
    <rect x="60" y="40" width="200" height="44" fill="#FFFFFF"/>
    <rect x="60" y="40" width="12" height="44" fill="#D62839"/>
    <text x="86" y="70" font-size="20" font-weight="700" fill="#0A1F3A" letter-spacing="2">IDEA DESK</text>
    <text x="1220" y="70" text-anchor="end" font-size="20" font-weight="700" fill="#FFFFFF">LIVE 09:41</text>
  </g>

  <!-- DATA LAYER A: by the numbers -->
  <g id="numbers-panel">
    <rect id="numbers-frame" x="60" y="130" width="560" height="320" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".35"/>
    <g id="numbers-content" data-reveal-after="numbers-frame" opacity="0">
      <text x="84" y="172" font-size="18" letter-spacing="3" fill="#9CC3EC">BY THE NUMBERS</text>
      <text id="n1" x="84" y="256" font-size="72" font-weight="700" fill="#FFFFFF">1</text>
      <text x="84" y="292" font-size="20" fill="#FFFFFF">IDEA</text>
      <text id="n2" x="260" y="256" font-size="72" font-weight="700" fill="#FFFFFF">7</text>
      <text x="260" y="292" font-size="20" fill="#FFFFFF">NODES</text>
      <text id="n3" x="436" y="256" font-size="72" font-weight="700" fill="#5FB3FF">11</text>
      <text x="436" y="292" font-size="20" fill="#FFFFFF">LINKS</text>
      <rect class="bar" x="84" y="370" width="40" height="40" fill="#FFFFFF"/>
      <rect class="bar" x="260" y="350" width="120" height="60" fill="#FFFFFF"/>
      <rect class="bar" x="436" y="330" width="160" height="80" fill="#5FB3FF"/>
      <text x="84" y="436" font-size="14" fill="#C9DCF0">SOURCE: IDEA DESK SYSTEM MODEL (ILLUSTRATIVE)</text>
    </g>
  </g>

  <!-- DATA LAYER B: network map -->
  <g id="map-panel">
    <rect id="map-frame" x="660" y="130" width="560" height="320" fill="#FFFFFF"/>
    <g id="map-content" data-reveal-after="map-frame" opacity="0">
      <rect x="660" y="130" width="560" height="40" fill="#E6ECF3"/>
      <text x="684" y="157" font-size="16" font-weight="700" fill="#0A1F3A" letter-spacing="3">SUPPORTING DATA · NETWORK MAP</text>
      <text x="684" y="436" font-size="14" fill="#3A4F66">SOURCE: IDEA DESK SYSTEM MODEL</text>
    </g>
    <g id="links" fill="none" stroke="#0A1F3A" stroke-width="3" stroke-linecap="round"></g>
    <g id="nodes"></g>
    <text id="origin-label" x="736" y="345" font-size="14" fill="#D62839" font-weight="700" opacity="0">ORIGIN</text>
  </g>

  <!-- Segment strap (lower third) -->
  <g id="strap">
    <g clip-path="url(#strapClip)">
      <rect x="60" y="520" width="170" height="80" fill="#D62839"/>
      <rect x="230" y="520" width="990" height="80" fill="#FFFFFF"/>
    </g>
    <text id="seg-label" data-reveal-after="strap" x="145" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2" opacity="0">SEGMENT 2</text>
    <text id="headline" data-reveal-after="strap" x="256" y="574" font-size="36" font-weight="700" fill="#0A1F3A" opacity="0">AN IDEA BECOMES A CONNECTED SYSTEM</text>
    <g clip-path="url(#subClip)">
      <rect x="230" y="600" width="990" height="40" fill="#0A1F3A"/>
    </g>
    <text id="subline" data-reveal-after="strap" x="256" y="627" font-size="19" fill="#FFFFFF" opacity="0">From one spark to seven linked nodes and eleven working connections</text>
  </g>
</svg>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var N = { O:[760,300], A:[880,220], B:[1000,250], C:[1120,210], D:[900,360], E:[1040,370], F:[1120,300] };

    var len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    p.setAttribute("d", "M" + a[0] + " " + a[1] + "L" + b[0] + " " + b[1]);
    p.setAttribute("stroke-dasharray", len.toFixed(2) + " " + (len + 4).toFixed(2));
    p.setAttribute("stroke-dashoffset", len.toFixed(2));
    linkG.appendChild(p);
    return { el: p, len: len };
  });
  var nodeEls = Object.keys(N).map(function (k) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", N[k][0]); c.setAttribute("cy", N[k][1]);
    if (k === "O") { c.setAttribute("r", 22); c.setAttribute("fill", "#D62839"); }
    else { c.setAttribute("r", 14); c.setAttribute("fill", "#FFFFFF"); c.setAttribute("stroke", "#0A1F3A"); c.setAttribute("stroke-width", 4); }
    nodeG.appendChild(c);
    return c;
  });

  var tl = gsap.timeline({ paused: true });

  // Beat 1 — segment strap wipe + headline read (0.00–1.10)
  tl.fromTo("#strapClipRect", { attr: { width: 0 } }, { attr: { width: 1160 }, duration: 0.42, ease: "power3.out" }, 0.05);
  tl.fromTo(["#seg-label", "#headline"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", stagger: 0.05 }, 0.47);
  tl.fromTo("#subClipRect", { attr: { width: 0 } }, { attr: { width: 990 }, duration: 0.3, ease: "power2.out" }, 0.52);
  tl.fromTo("#subline", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 0.82);

  // Beat 2 — switch to supporting data in the upper grid regions (1.10–2.30)
  tl.fromTo("#numbers-frame", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 1.1);
  tl.fromTo("#map-frame", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 1.18);
  tl.fromTo("#numbers-content", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, 1.4);
  tl.fromTo("#map-content", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, 1.48);
  tl.fromTo(".bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.32, ease: "power2.out", stagger: 0.08 }, 1.46);
  var counts = { a: 0, b: 0, c: 0 };
  var n1 = document.getElementById("n1"), n2 = document.getElementById("n2"), n3 = document.getElementById("n3");
  function drawCounts() {
    n1.textContent = String(Math.round(counts.a));
    n2.textContent = String(Math.round(counts.b));
    n3.textContent = String(Math.round(counts.c));
  }
  tl.fromTo(counts, { a: 0, b: 0, c: 0 }, { a: 1, b: 7, c: 11, duration: 0.6, ease: "power1.out", onUpdate: drawCounts }, 1.46);

  // Network: origin first, then links draw outward, nodes land when reached
  tl.fromTo(nodeEls[0], { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.2, ease: "back.out(1.6)" }, 1.5);
  tl.fromTo("#origin-label", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, 1.62);
  linkEls.forEach(function (l, i) {
    tl.to(l.el, { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power1.inOut" }, 1.6 + i * 0.045);
  });
  nodeEls.slice(1).forEach(function (c, i) {
    tl.fromTo(c, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 1.74 + i * 0.07);
  });

  // Beat 3 — settled hold: strap, data and the unchanged programme mark (2.30–3.00)
  tl.set({}, {}, 3);

  tl.progress(0).pause();
  drawCounts();
  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;
  window.addEventListener("hf-seek", function (e) {
    var t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : null;
    if (t !== null) tl.seek(t, false);
  });
})();
</script>

</html>
