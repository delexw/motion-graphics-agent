<html lang="en">
<head>
<meta charset="utf-8">
<title>Scratch Film — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #07090d; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; background: #07090d; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #caption { position: absolute; left: 70px; right: 70px; top: 83.4%; height: 16.6%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #07090d; font-family: "Courier New", Courier, monospace; text-align: center; }
  #title { color: #F5F4E8; font-size: 30px; font-weight: 700; letter-spacing: 3px; margin: 0; opacity: 0; }
  #sub { color: #76E1CB; font-size: 14px; letter-spacing: 4px; margin: 8px 0 0; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="caption">
    <p id="title">AN IDEA BECOMES A CONNECTED SYSTEM</p>
    <p id="sub">SCRATCHED INTO EMULSION · FRAME 0127</p>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720, FPS = 30;
  var FILM = { x: 70, y: 0, w: 1140, h: 600 };
  var COL = { stock: "#111722", sprocket: "#07090d", hole: "#1d2633", fg: "245,244,232", active: "118,225,203", secondary: "41,67,89" };

  // ---- seeded PRNG (mulberry32) ----
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  // ---- static cached film stock (opaque, stationary grain) ----
  var stock = document.createElement("canvas");
  stock.width = W; stock.height = H;
  (function buildStock() {
    var s = stock.getContext("2d");
    s.fillStyle = COL.sprocket; s.fillRect(0, 0, W, H);
    s.fillStyle = COL.hole;
    for (var y = 22; y < H; y += 72) {
      roundRect(s, 18, y, 20, 28, 5); s.fill();
      roundRect(s, W - 38, y, 20, 28, 5); s.fill();
    }
    s.fillStyle = COL.stock; s.fillRect(FILM.x, FILM.y, FILM.w, FILM.h);
    // emulsion grain: deterministic, very low amplitude
    var img = s.getImageData(FILM.x, FILM.y, FILM.w, FILM.h), d = img.data, r = rng(186);
    for (var i = 0; i < d.length; i += 4) {
      var n = (r() - 0.5) * 14;
      d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1;
    }
    s.putImageData(img, FILM.x, FILM.y);
    // a few permanent old base scratches (pinned to film coordinates)
    s.strokeStyle = "rgba(" + COL.fg + ",0.16)"; s.lineWidth = 1;
    [[210, 0, 214, 590], [640, 30, 636, 580], [1150, 0, 1156, 520], [120, 120, 124, 260]].forEach(function (l) {
      s.beginPath(); s.moveTo(l[0], l[1]); s.lineTo(l[2], l[3]); s.stroke();
    });
    s.strokeStyle = "rgba(" + COL.fg + ",0.3)";
    s.beginPath(); s.moveTo(FILM.x, 600.5); s.lineTo(FILM.x + FILM.w, 600.5); s.stroke();
  })();

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  // ---- geometry as polylines so partial reveal is exact and seekable ----
  function arcPts(cx, cy, rx, ry, a0, a1, n) {
    var p = []; for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p;
  }
  function linePts(x0, y0, x1, y1, n) { var p = []; for (var i = 0; i <= n; i++) p.push([x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]); return p; }
  function bez(p0, p1, p2, p3, n) {
    var p = []; for (var i = 0; i <= n; i++) { var t = i / n, u = 1 - t;
      p.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); } return p;
  }
  var BC = { x: 400, y: 300, r: 140 };
  // bulb outline: left neck -> globe -> right neck
  var bulbOutline = [].concat(
    bez([350, 470], [330, 430], [262, 400], [262, 300], 18),
    arcPts(BC.x, BC.y, 138, 140, Math.PI, Math.PI * 2, 48).slice(1),
    bez([538, 300], [538, 400], [470, 430], [450, 470], 18).slice(1)
  );
  var filament = [[372, 462], [388, 370], [412, 418], [436, 368], [452, 462]].reduce(function (acc, p, i, a) {
    if (i === 0) return [p]; return acc.concat(linePts(a[i-1][0], a[i-1][1], p[0], p[1], 10).slice(1));
  }, []);
  var base = [linePts(342, 492, 458, 492, 12), linePts(350, 520, 450, 520, 12), linePts(366, 548, 434, 548, 10)];
  var bulbPaths = [bulbOutline, filament].concat(base);

  // three exposures: each a slightly displaced, re-cut pass (seeded, fixed)
  var EXPOSURES = [
    { dx: 0, dy: 0, rot: 0, w: 3.0, a: 0.95 },
    { dx: 4.5, dy: -3.5, rot: 0.012, w: 1.5, a: 0.6 },
    { dx: -3.5, dy: 3, rot: -0.009, w: 1.1, a: 0.42 }
  ];
  function jitterPath(path, seed, amp) {
    var r = rng(seed); return path.map(function (p) { return [p[0] + (r() - 0.5) * amp, p[1] + (r() - 0.5) * amp]; });
  }
  var exposurePaths = EXPOSURES.map(function (e, ei) {
    var c = Math.cos(e.rot), s = Math.sin(e.rot);
    return bulbPaths.map(function (path, pi) {
      return jitterPath(path, 1000 + ei * 97 + pi * 13, ei === 0 ? 1.2 : 2.2).map(function (p) {
        var x = p[0] - BC.x, y = p[1] - BC.y; return [BC.x + x * c - y * s + e.dx, BC.y + x * s + y * c + e.dy];
      });
    });
  });

  // hatch scratches inside the globe — scratch density makes the silhouette bright
  var hatch = (function () {
    var r = rng(4242), lines = [];
    for (var k = -220; k <= 220; k += 7) {
      // diagonal line x - y = k through circle centre offset
      var nx = Math.SQRT1_2, ny = -Math.SQRT1_2; // normal
      var dist = k / 1; var R = 124;
      if (Math.abs(dist) >= R) continue;
      var half = Math.sqrt(R * R - dist * dist) * (0.82 + r() * 0.16);
      var cx = BC.x + nx * dist, cy = BC.y + ny * dist;
      var tx = Math.SQRT1_2, ty = Math.SQRT1_2;
      lines.push({ x0: cx - tx * half, y0: cy - ty * half, x1: cx + tx * half, y1: cy + ty * half,
        w: 0.9 + r() * 1.4, a: 0.35 + r() * 0.35, order: r() });
    }
    lines.sort(function (a, b) { return a.order - b.order; });
    return lines;
  })();
  // radiating short scratches (the idea "lights")
  var rays = (function () {
    var r = rng(77), out = [];
    for (var i = 0; i < 22; i++) {
      var a = Math.PI * 1.05 + (Math.PI * 0.9) * i / 21 + (r() - 0.5) * 0.05;
      var r0 = 160 + r() * 8, r1 = r0 + 22 + r() * 26;
      out.push({ x0: BC.x + Math.cos(a) * r0, y0: BC.y + Math.sin(a) * r0, x1: BC.x + Math.cos(a) * r1, y1: BC.y + Math.sin(a) * r1 });
    }
    return out;
  })();

  // connected system
  var N = { s: [540, 320], a: [690, 250], b: [850, 300], c: [1010, 200], d: [760, 440], e: [940, 480], f: [1070, 380] };
  var edges = [["s","a"],["a","b"],["a","d"],["b","c"],["b","e"],["d","e"],["c","f"],["e","f"]];
  var nodeOrder = ["a","b","d","c","e","f"];
  var faces = [["a","b","e","d"],["b","c","f","e"]];

  // ---- motion state: single owner = GSAP timeline ----
  var S = { exp0: 0, exp1: 0, exp2: 0, hatch: 0, rays: 0, net: 0, faces: 0, title: 0, sub: 0 };

  function strokePartial(path, prog, width, rgba) {
    if (prog <= 0) return;
    var n = path.length - 1, upto = prog * n, full = Math.floor(upto);
    ctx.lineWidth = width; ctx.strokeStyle = rgba;
    ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
    for (var i = 1; i <= Math.min(full, n); i++) ctx.lineTo(path[i][0], path[i][1]);
    if (full < n) { var f = upto - full, p = path[full], q = path[full + 1]; ctx.lineTo(p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f); }
    ctx.stroke();
  }
  function seg(x0, y0, x1, y1, prog, w, rgba) {
    if (prog <= 0) return; prog = Math.min(1, prog);
    ctx.lineWidth = w; ctx.strokeStyle = rgba; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * prog, y0 + (y1 - y0) * prog); ctx.stroke();
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function render(time) {
    var frame = Math.round(time * FPS);
    var fr = rng(9000 + frame);

    var flick = 1 + (fr() - 0.5) * 0.08;
    ctx.drawImage(stock, 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(FILM.x, FILM.y, FILM.w, FILM.h); ctx.clip();
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    // hatch density inside the globe
    var hn = hatch.length * S.hatch;
    for (var i = 0; i < hatch.length; i++) {
      var hp = clamp01(hn - i); if (hp <= 0) break;
      var h = hatch[i];
      seg(h.x0, h.y0, h.x1, h.y1, hp, h.w, "rgba(" + COL.fg + "," + (h.a * flick).toFixed(3) + ")");
    }
    // three exposures of the incised silhouette
    var ev = [S.exp0, S.exp1, S.exp2];
    for (var e = 0; e < 3; e++) {
      if (ev[e] <= 0) continue;
      var paths = exposurePaths[e], total = paths.length;
      for (var p = 0; p < total; p++) {
        // outline cut first, then filament, then base rings
        var local = clamp01(ev[e] * total - p * 0.75);
        strokePartial(paths[p], local, EXPOSURES[e].w, "rgba(" + COL.fg + "," + Math.min(1, EXPOSURES[e].a * flick).toFixed(3) + ")");
      }
    }
    // rays
    var rn = rays.length * S.rays;
    for (var j = 0; j < rays.length; j++) {
      var rp = clamp01((rn - j) * 1.5); if (rp <= 0) break;
      var ry = rays[j]; seg(ry.x0, ry.y0, ry.x1, ry.y1, rp, 1.6, "rgba(" + COL.fg + "," + (0.7 * flick).toFixed(3) + ")");
    }
    // system faces: sparse teal hatching (density = active)
    if (S.faces > 0) {
      faces.forEach(function (f, fi) {
        ctx.save(); ctx.beginPath();
        f.forEach(function (k, ki) { var q = N[k]; if (ki) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
        ctx.closePath(); ctx.clip();
        var r2 = rng(600 + fi);
        for (var x = 640; x < 1120; x += 6) {
          var thr = (x - 640) / 480;
          var pr = clamp01((S.faces - thr * 0.6) * 2.5);
          if (pr <= 0) continue;
          var a = (0.22 + r2() * 0.2) * flick;
          seg(x, 160, x - 160, 520, pr, 1.1, "rgba(" + COL.active + "," + a.toFixed(3) + ")");
        }
        ctx.restore();
      });
    }
    // edges, drawn in sequence; second offset pass for incision depth
    var en = edges.length * S.net;
    for (var k = 0; k < edges.length; k++) {
      var ep = clamp01(en - k); if (ep <= 0) break;
      var A = N[edges[k][0]], B = N[edges[k][1]];
      seg(A[0], A[1], B[0], B[1], ep, 2.4, "rgba(" + COL.active + "," + (0.95 * flick).toFixed(3) + ")");
      seg(A[0] + 3, A[1] + 5, B[0] + 3, B[1] + 5, ep, 1.1, "rgba(" + COL.active + ",0.4)");
    }
    // nodes: scratched ring + cross once its incoming edge arrives
    var arrive = { a: 1, b: 2, d: 3, c: 4, e: 5, f: 7 };
    nodeOrder.forEach(function (key) {
      var np = clamp01((en - arrive[key]) * 2.2); if (np <= 0) return;
      var q = N[key];
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(" + COL.fg + "," + (0.95 * flick).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(q[0], q[1], 17, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * np); ctx.stroke();
      seg(q[0] - 12, q[1] - 6, q[0] + 12, q[1] + 7, np * 1.5, 2, "rgba(" + COL.fg + ",0.95)");
      seg(q[0] - 6, q[1] + 12, q[0] + 7, q[1] - 13, np * 1.5 - 0.4, 2, "rgba(" + COL.fg + ",0.95)");
      seg(q[0] - 14, q[1] + 2, q[0] + 13, q[1], np * 1.5 - 0.7, 1.6, "rgba(" + COL.fg + ",0.8)");
    });

    // transient film-wear: 1–2 faint vertical scratches per frame, seeded by frame
    var count = fr() < 0.5 ? 1 : 2;
    for (var w = 0; w < count; w++) {
      var x = FILM.x + 20 + fr() * (FILM.w - 40), y0 = fr() * 200, len = 150 + fr() * 380;
      ctx.lineWidth = 0.8; ctx.strokeStyle = "rgba(" + COL.fg + "," + (0.07 + fr() * 0.07).toFixed(3) + ")";
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + (fr() - 0.5) * 4, y0 + len); ctx.stroke();
    }
    ctx.restore();

    // film-gate density (very slight, uniform; never masks the action)
    ctx.fillStyle = "rgba(7,9,13," + ((1 - flick) > 0 ? ((1 - flick) * 0.6).toFixed(3) : "0") + ")";
    ctx.fillRect(FILM.x, FILM.y, FILM.w, FILM.h);

    titleEl.style.opacity = S.title.toFixed(3);
    subEl.style.opacity = S.sub.toFixed(3);
  }

  var titleEl = document.getElementById("title"), subEl = document.getElementById("sub");

  var tl = gsap.timeline({ paused: true, onUpdate: function () { render(tl.time()); } });
  tl.to(S, { exp0: 1, duration: 0.75, ease: "power2.inOut" }, 0.1)
    .to(S, { hatch: 1, duration: 0.8, ease: "power2.inOut" }, 0.45)
    .to(S, { exp1: 1, duration: 0.55, ease: "power2.inOut" }, 0.6)
    .to(S, { exp2: 1, duration: 0.5, ease: "power2.inOut" }, 0.9)
    .to(S, { rays: 1, duration: 0.4, ease: "power2.inOut" }, 1.15)
    .to(S, { net: 1, duration: 0.95, ease: "sine.inOut" }, 1.2)
    .to(S, { faces: 1, duration: 0.5, ease: "power2.inOut" }, 1.9)
    .to(S, { title: 1, duration: 0.3, ease: "power2.inOut" }, 1.85)
    .to(S, { sub: 1, duration: 0.3, ease: "power2.inOut" }, 2.0)
    .to({}, { duration: 0.01 }, 2.99);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  function seekRender() { render(tl.time()); }
  window.addEventListener("hf-seek", function (ev) {
    var t = ev && ev.detail && typeof ev.detail.time === "number" ? ev.detail.time : null;
    if (t !== null) tl.seek(t, false);
    seekRender();
  });
  document.addEventListener("hf-seek", seekRender);
  tl.seek(0, false);
  render(0);
})();
</script>
