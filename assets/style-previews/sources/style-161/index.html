<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefly Pointillism — An idea becomes a connected system</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #070B14; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070B14; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy { position: absolute; left: 6.6%; top: 79%; font-family: "Avenir Next", Futura, "Trebuchet MS", "Helvetica Neue", Arial, sans-serif; color: #F5F4E8; }
  #title { margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: 0; opacity: 0; }
  #sub { margin: 10px 0 0 2px; font-size: 15px; letter-spacing: 4px; font-weight: 500; color: #76E1CB; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="video" data-width="1280" data-height="720" data-duration="3" data-fps="30">
  <canvas id="scene" width="1280" height="720"></canvas>
  <div class="copy">
    <h1 id="title">An idea becomes a connected system</h1>
    <div id="sub">ONE LIGHT · MANY PATHS</div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var W = 1280, H = 720;
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');

  // ---------- Palette roles ----------
  var WARM = [255, 210, 122];   // firefly dots
  var WARM2 = [255, 178, 85];
  var ACTIVE = [118, 225, 203]; // the single changing region
  var HOT = [232, 255, 248];

  // ---------- Seeded RNG (mulberry32) ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = rng(161);
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  // ---------- Static background (cached) ----------
  var bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  (function () {
    var b = bg.getContext('2d');
    var g = b.createRadialGradient(W * 0.35, H * 0.45, 0, W * 0.35, H * 0.45, W * 0.9);
    g.addColorStop(0, '#15233A'); g.addColorStop(1, '#070B14');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    var r = rng(7);
    for (var i = 0; i < 46; i++) {
      var x = r() * W, y = r() * H;
      if (x < 820 && y > 540) continue; // keep copy area calm
      b.fillStyle = 'rgba(245,244,232,' + (0.12 + r() * 0.3).toFixed(3) + ')';
      b.beginPath(); b.arc(x, y, 0.6 + r() * 1.0, 0, Math.PI * 2); b.fill();
    }
  })();

  // ---------- Sprites ----------
  function glowSprite(rgb, size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var s = c.getContext('2d'); var h = size / 2;
    var g = s.createRadialGradient(h, h, 0, h, h, h);
    g.addColorStop(0, 'rgba(' + rgb + ',1)');
    g.addColorStop(0.25, 'rgba(' + rgb + ',0.45)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    s.fillStyle = g; s.fillRect(0, 0, size, size);
    return c;
  }
  var haloWarm = glowSprite('255,200,97', 256);
  var haloActive = glowSprite('118,225,203', 128);

  // ---------- Bulb point cloud (seeded, fixed) ----------
  var bulbPath = new Path2D('M380 140C300 140 250 200 250 270C250 322 282 352 306 382C320 402 326 422 326 442H434C434 422 440 402 454 382C478 352 510 322 510 270C510 200 460 140 380 140Z');
  var basePath = new Path2D('M330 460H430V496H330Z');
  var hit = document.createElement('canvas').getContext('2d');
  var bulbDots = [];
  function addGrid(path, alphaMul, kind) {
    for (var y = 130; y < 500; y += 11) {
      for (var x = 240; x < 520; x += 11) {
        var pts = [[x + 3, y + 3, 1.9, WARM], [x + 8.5, y + 8, 1.25, WARM2]];
        for (var k = 0; k < 2; k++) {
          var p = pts[k];
          if (!hit.isPointInPath(path, p[0], p[1])) continue;
          // accumulation order: rising from the socket along the bulb's centre line, with seeded jitter
          var dx = p[0] - 380, dy = 470 - p[1];
          var order = Math.sqrt(dx * dx * 0.55 + dy * dy) / 360 + rand() * 0.16;
          if (kind === 'base') order = 0.02 + rand() * 0.12;
          bulbDots.push({ x: p[0], y: p[1], r: p[2], c: p[3], a: alphaMul * (0.78 + rand() * 0.22), o: order, tw: rand() * 6.283 });
        }
      }
    }
  }
  addGrid(bulbPath, 1, 'bulb');
  addGrid(basePath, 0.6, 'base');
  var maxO = 0; bulbDots.forEach(function (d) { if (d.o > maxO) maxO = d.o; });
  bulbDots.forEach(function (d) { d.o /= maxO; });

  // ---------- Routes (dots placed along visible paths) ----------
  function cubic(p0, p1, p2, p3, t) {
    var u = 1 - t;
    return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
            u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]];
  }
  function sampleRoute(c, spacing) {
    var fine = [], len = 0, prev = null;
    for (var i = 0; i <= 400; i++) {
      var p = cubic(c[0], c[1], c[2], c[3], i / 400);
      if (prev) len += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
      fine.push({ p: p, s: len }); prev = p;
    }
    var n = Math.max(2, Math.round(len / spacing)), out = [], j = 0;
    for (var k = 0; k <= n; k++) {
      var target = len * k / n;
      while (j < fine.length - 1 && fine[j + 1].s < target) j++;
      out.push({ x: fine[j].p[0], y: fine[j].p[1], u: k / n });
    }
    return out;
  }
  var R = {
    a: [[500,240],[600,190],[680,190],[770,200]],
    b: [[770,200],[850,260],[870,320],[900,380]],
    c: [[900,380],[960,300],[1010,260],[1080,240]],
    d: [[900,380],[960,450],[1000,490],[1040,520]],
    e: [[440,420],[560,500],[660,520],[760,520]],
    f: [[760,520],[820,470],[860,420],[900,380]]
  };
  // [route, start(0..1 of routeProg), span]
  var routeDefs = [['a',0,0.42],['e',0.05,0.42],['b',0.4,0.32],['f',0.45,0.32],['c',0.7,0.3],['d',0.72,0.28]];
  var routes = routeDefs.map(function (rd) { return { key: rd[0], s: rd[1], span: rd[2], dots: sampleRoute(R[rd[0]], 13) }; });

  // ---------- Node clusters ----------
  var nodeDefs = [[770,200,0.42],[760,520,0.47],[900,380,0.72],[1080,240,1.0],[1040,520,1.0]];
  var nodes = nodeDefs.map(function (nd, i) {
    var r = rng(400 + i), pts = [];
    for (var y = -26; y <= 26; y += 5.5) for (var x = -26; x <= 26; x += 5.5) {
      var jx = x + (r() - 0.5) * 1.6, jy = y + (r() - 0.5) * 1.6;
      if (jx * jx + jy * jy > 24 * 24) continue;
      pts.push({ x: jx, y: jy, r: 0.9 + r() * 0.9, o: r() });
    }
    return { x: nd[0], y: nd[1], arrive: nd[2], pts: pts };
  });

  // Pulse route: bulb -> a -> b -> c -> node (1080,240)
  var pulseChain = [];
  ['a','b','c'].forEach(function (k, i) {
    var d = sampleRoute(R[k], 13);
    d.forEach(function (p, j) { if (i > 0 && j === 0) return; pulseChain.push(p); });
  });

  // ---------- Animated state (GSAP is the only owner) ----------
  var S = { bulb: 0, glow: 0, route: 0, pulse: 0, target: 0 };

  function dot(x, y, r, rgb, a) {
    if (a <= 0.003) return;
    ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function mix(a, b, t) { return [Math.round(a[0] + (b[0]-a[0])*t), Math.round(a[1] + (b[1]-a[1])*t), Math.round(a[2] + (b[2]-a[2])*t)]; }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(bg, 0, 0);

    // bulb halo (bounded)
    if (S.glow > 0) {
      ctx.globalAlpha = 0.42 * S.glow;
      ctx.drawImage(haloWarm, 380 - 240, 320 - 240, 480, 480);
      ctx.globalAlpha = 1;
    }
    // bulb dots accumulate
    var bp = S.bulb;
    for (var i = 0; i < bulbDots.length; i++) {
      var d = bulbDots[i];
      var k = smooth((bp * 1.12 - d.o) / 0.12);
      if (k <= 0) continue;
      dot(d.x, d.y, d.r * (0.6 + 0.4 * k), d.c, d.a * k);
    }

    // pulse position along chain (index space)
    var pIdx = -100, pOn = S.pulse > 0 && S.pulse < 1;
    if (pOn) pIdx = S.pulse * (pulseChain.length - 1);

    // routes accumulate dot by dot
    routes.forEach(function (rt) {
      var local = clamp01((S.route - rt.s) / rt.span);
      var n = rt.dots.length;
      for (var j = 0; j < n; j++) {
        var p = rt.dots[j];
        var k = smooth((local * (n + 2) - j) / 2);
        if (k <= 0) break;
        dot(p.x, p.y, 1.8, WARM, 0.92 * k);
      }
    });

    // node clusters
    nodes.forEach(function (nd, ni) {
      var k = smooth((S.route - nd.arrive + 0.16) / 0.16);
      if (k <= 0) return;
      var isTarget = ni === 3;
      var lit = isTarget ? S.target : 0;
      ctx.globalAlpha = 0.5 * k;
      ctx.drawImage(haloWarm, nd.x - 50, nd.y - 50, 100, 100);
      ctx.globalAlpha = 1;
      if (lit > 0) {
        ctx.globalAlpha = 0.55 * lit;
        ctx.drawImage(haloActive, nd.x - 44, nd.y - 44, 88, 88);
        ctx.globalAlpha = 1;
      }
      var col = lit > 0 ? mix(WARM, ACTIVE, lit) : WARM;
      for (var j = 0; j < nd.pts.length; j++) {
        var p = nd.pts[j];
        var kk = smooth((k * 1.3 - p.o * 0.3) / 1.0);
        dot(nd.x + p.x * (0.55 + 0.45 * k), nd.y + p.y * (0.55 + 0.45 * k), p.r, col, 0.9 * kk);
      }
    });

    // sparse travelling pulse: only a short teal segment is active at once
    if (pOn) {
      for (var q = 0; q < pulseChain.length; q++) {
        var dist = pIdx - q;
        if (dist < -0.5 || dist > 6) continue;
        var w = dist < 0 ? 1 + dist * 2 : Math.max(0, 1 - dist / 6);
        var c = pulseChain[q];
        dot(c.x, c.y, 2.1, ACTIVE, 0.95 * w);
      }
      var f = pIdx - Math.floor(pIdx), i0 = Math.floor(pIdx), i1 = Math.min(pulseChain.length - 1, i0 + 1);
      var hx = pulseChain[i0].x + (pulseChain[i1].x - pulseChain[i0].x) * f;
      var hy = pulseChain[i0].y + (pulseChain[i1].y - pulseChain[i0].y) * f;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(haloActive, hx - 24, hy - 24, 48, 48);
      ctx.globalAlpha = 1;
      dot(hx, hy, 4, HOT, 1);
    }
  }

  // ---------- One paused, seekable GSAP timeline ----------
  var tl = gsap.timeline({ paused: true, onUpdate: render });
  tl.to(S, { bulb: 1, duration: 0.95, ease: 'power2.out' }, 0);
  tl.to(S, { glow: 1, duration: 0.8, ease: 'sine.inOut' }, 0.15);
  tl.to(S, { route: 1, duration: 1.0, ease: 'power1.inOut' }, 0.55);
  tl.to('#title', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.3);
  tl.to('#sub', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.55);
  // pulse starts only after the cluster + routes are recognisable
  tl.to(S, { pulse: 1, duration: 0.9, ease: 'sine.inOut' }, 1.6);
  tl.to(S, { target: 1, duration: 0.22, ease: 'power2.out' }, 2.42);
  tl.set({}, {}, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines.video = tl;

  window.addEventListener('hf-seek', function (e) {
    var t = e && e.detail && typeof e.detail.time === 'number' ? e.detail.time : tl.time();
    tl.seek(t, false); render();
  });
  tl.seek(0, false);
  render();
})();
</script>
